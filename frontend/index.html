            <div className="overflow-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-slate-500 text-xs">
                  <tr>
                    {["Vehicle (id)", "English", "Estonian", "Payload t", "GVW t", "kg CO₂e / km", "Load min", "Unload min", "Planning"].map(h => <th key={h} className="px-2 py-2 text-left font-semibold whitespace-nowrap">{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {vehicles.map(k => { const v = doc.vehicles[k]; const lab = v.labels || {}; return (
                    <tr key={k} className="border-t border-slate-100 align-top">
                      <td className="px-2 py-1.5 whitespace-nowrap"><div className="font-medium text-slate-800">{k}</div>{v.code && <div className="text-[10px] text-slate-400">{v.code}</div>}</td>
                      <td className="px-2 py-1.5 min-w-[190px]"><input className={inp} value={lab.en || ""} placeholder={k} onChange={e => upd(d => { d.vehicles[k].labels = { ...(d.vehicles[k].labels || {}), en: e.target.value }; })} /></td>
                      <td className="px-2 py-1.5 min-w-[190px]"><input className={inp} value={lab.ee || ""} placeholder="falls back to EU" onChange={e => upd(d => { d.vehicles[k].labels = { ...(d.vehicles[k].labels || {}), ee: e.target.value }; })} /></td>
                      <td className="px-2 py-1.5 w-24"><input className={inp} value={v.payload_t ?? ""} onChange={e => upd(d => { d.vehicles[k].payload_t = num(e.target.value); })} /></td>
                      <td className="px-2 py-1.5 w-24"><input className={inp} value={v.gvw_t ?? ""} onChange={e => upd(d => { d.vehicles[k].gvw_t = num(e.target.value); })} /></td>
                      <td className="px-2 py-1.5 w-28"><input className={inp} value={v.emissions_kg_co2e_per_km ?? ""} onChange={e => upd(d => { d.vehicles[k].emissions_kg_co2e_per_km = num(e.target.value); })} /></td>
                      <td className="px-2 py-1.5 w-20"><input className={inp} value={v.load_minutes ?? ""} placeholder={String((doc.planning || {}).load_minutes ?? "")} onChange={e => upd(d => { const n = num(e.target.value); if(n == null) delete d.vehicles[k].load_minutes; else d.vehicles[k].load_minutes = n; })} /></td>
                      <td className="px-2 py-1.5 w-20"><input className={inp} value={v.unload_minutes ?? ""} placeholder={String((doc.planning || {}).unload_minutes ?? "")} onChange={e => upd(d => { const n = num(e.target.value); if(n == null) delete d.vehicles[k].unload_minutes; else d.vehicles[k].unload_minutes = n; })} /></td>
                      <td className="px-2 py-1.5 text-center"><input type="checkbox" checked={!!v.planning_vehicle} onChange={e => upd(d => { d.vehicles[k].planning_vehicle = e.target.checked; d.planning_vehicles = Object.keys(d.vehicles).filter(x => !x.startsWith("_") && d.vehicles[x].planning_vehicle); })} /></td>
                    </tr>
                  ); })}
                </tbody>
              </table>
              <p className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100">
                The id is what a forecast line stores and what baked routes are keyed on — it cannot be renamed here. A vehicle the network is baked for cannot be removed. Blank load/unload minutes use the planning defaults. Routing dimensions and aliases are on the JSON tab.
              </p>
            </div>
          )}

          {tab === "materials" && (
            <div className="overflow-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50 text-slate-500 text-xs">
                  <tr>{["Material", "Density t/m³", "Default unit", "Volume ↔ weight", "Vehicles used"].map(h => <th key={h} className="px-2 py-2 text-left font-semibold whitespace-nowrap">{h}</th>)}</tr>
                </thead>
                <tbody>
                  {materials.map(k => { const c = doc.material_categories[k]; return (
                    <tr key={k} className="border-t border-slate-100 align-top">
                      <td className="px-2 py-1.5 font-medium text-slate-800 whitespace-nowrap">{k}</td>
                      <td className="px-2 py-1.5 w-28"><input className={inp} value={c.density_t_per_m3 ?? ""} onChange={e => upd(d => { d.material_categories[k].density_t_per_m3 = num(e.target.value); })} /></td>
                      <td className="px-2 py-1.5 w-28">
                        <select className={inp} value={c.default_unit || "t"} onChange={e => upd(d => { d.material_categories[k].default_unit = e.target.value; })}>
                          <option value="m3">m³</option><option value="t">tonnes</option><option value="vehicles">vehicles</option>
                        </select>
                      </td>
                      <td className="px-2 py-1.5 text-center"><input type="checkbox" checked={c.volume_convertible !== false} onChange={e => upd(d => { d.material_categories[k].volume_convertible = e.target.checked; })} /></td>
                      <td className="px-2 py-1.5">
                        <div className="flex flex-wrap gap-x-3 gap-y-1">
                          {vehicles.map(v => (
                            <label key={v} className="flex items-center gap-1 text-[11px] text-slate-600 whitespace-nowrap">
                              <input type="checkbox" checked={(c.vehicles || []).includes(v)} onChange={e => upd(d => {
                                const cur = d.material_categories[k].vehicles || [];
                                d.material_categories[k].vehicles = e.target.checked ? [...cur, v] : cur.filter(x => x !== v);
                              })} /> {vehLabel(v)}
                            </label>
                          ))}
                        </div>
                      </td>
                    </tr>
                  ); })}
                </tbody>
              </table>
              <p className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100">Which vehicles a material lists is advisory in Submit forecast — an unlisted vehicle is shown but disabled, never hidden.</p>
            </div>
          )}

          {tab === "planning" && (
            <div className="p-4 grid grid-cols-2 md:grid-cols-5 gap-4 max-w-4xl">
              {[["working_days_per_month", "Working days / month", "Every per-day figure in the app divides by this."],
                ["shift_hours_per_day", "Shift hours / day", "Trips one vehicle can make = shift ÷ cycle time."],
                ["avg_haul_speed_kmh", "Avg haul speed km/h", "Used only where HERE has no timing."],
                ["load_minutes", "Load minutes (default)", "Per-vehicle values override this."],
                ["unload_minutes", "Unload minutes (default)", "Per-vehicle values override this."]].map(([k, l, help]) => (
                <label key={k} className="block">
                  <span className="text-[11px] uppercase tracking-wide text-slate-400">{l}</span>
                  <input className={inp + " mt-1"} value={(doc.planning || {})[k] ?? ""} onChange={e => upd(d => { d.planning = d.planning || {}; d.planning[k] = num(e.target.value); })} />
                  <span className="block text-[11px] text-slate-400 mt-1">{help}</span>
                </label>
              ))}
            </div>
          )}

          {tab === "seasonal" && (
            <div className="p-4 space-y-3">
              {(doc.seasonal_restrictions || []).map((w, i) => (
                <div key={i} className="rounded-lg border border-slate-200 p-3 grid md:grid-cols-[1fr_2fr] gap-3">
                  <div className="space-y-2">
                    <input className={inp} value={w.name || ""} placeholder="Name" onChange={e => upd(d => { d.seasonal_restrictions[i].name = e.target.value; })} />
                    <div className="flex flex-wrap gap-1">
                      {MONTHS.map((m, mi) => (
                        <label key={m} className={"text-[11px] px-1.5 py-0.5 rounded border cursor-pointer " + ((w.months || []).includes(mi + 1) ? "bg-slate-800 text-white border-slate-800" : "border-slate-200 text-slate-600")}>
                          <input type="checkbox" className="hidden" checked={(w.months || []).includes(mi + 1)} onChange={e => upd(d => {
                            const cur = d.seasonal_restrictions[i].months || [];
                            d.seasonal_restrictions[i].months = e.target.checked ? [...cur, mi + 1].sort((a, b) => a - b) : cur.filter(x => x !== mi + 1);
                          })} />{m}
                        </label>
                      ))}
                    </div>
                    <button onClick={() => upd(d => { d.seasonal_restrictions.splice(i, 1); })} className="text-[11px] text-[color:var(--red)] hover:underline">Remove</button>
                  </div>
                  <div className="space-y-2">
                    <textarea className={inp + " h-16"} value={w.message || ""} placeholder="Message shown at submission and on the map timeline" onChange={e => upd(d => { d.seasonal_restrictions[i].message = e.target.value; })} />
                    <div className="flex flex-wrap gap-x-3 gap-y-1">
                      <span className="text-[11px] text-slate-400 w-full">Restricted vehicles (none = applies to every vehicle)</span>
                      {vehicles.map(v => (
                        <label key={v} className="flex items-center gap-1 text-[11px] text-slate-600 whitespace-nowrap">
                          <input type="checkbox" checked={(w.restricted_vehicles || []).includes(v)} onChange={e => upd(d => {
                            const cur = d.seasonal_restrictions[i].restricted_vehicles || [];
                            d.seasonal_restrictions[i].restricted_vehicles = e.target.checked ? [...cur, v] : cur.filter(x => x !== v);
                          })} /> {vehLabel(v)}
                        </label>
                      ))}
                    </div>
                  </div>
                </div>
              ))}
              <button onClick={() => upd(d => { d.seasonal_restrictions = [...(d.seasonal_restrictions || []), { name: "", months: [], restricted_vehicles: [], message: "" }]; })}
                className="text-xs font-semibold px-2.5 py-1.5 rounded-md border border-slate-200 hover:bg-slate-50">+ Add a window</button>
            </div>
          )}

          {tab === "raw" && (
            <div className="p-4">
              <p className="text-xs text-slate-500 mb-2">The whole document. Anything the other tabs do not cover — routing dimensions, aliases, the notes — is here. Saving from this tab sends exactly this text.</p>
              <textarea className="w-full h-[60vh] font-mono text-xs border border-slate-300 rounded-lg p-3" value={raw}
                onChange={e => { setRaw(e.target.value); setRawErr(""); try { setDoc(JSON.parse(e.target.value)); } catch(err){} }} />
              {rawErr && <div className="text-xs mt-1" style={{ color: "var(--red)" }}>{rawErr}</div>}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ================================================================= Look-ahead (Week 1)
// Tasks C, D and D2's panel. Sits ON the month line — there is no week_index on
// `forecasts`, no upload, no importer, and the public map's timeline stays monthly.
//
// Window: the current month and the next one. The browser's clock picks the WINDOW
// only; which cell is editable comes from the server's `next_week`, so a laptop with
// the wrong date cannot let someone confirm a different week.
const WEEK_NOS = [1, 2, 3, 4];
const WEEK_DAYS = { 1: "1–7", 2: "8–14", 3: "15–21", 4: "22–end" };
const wkKey = (r) => `${r.route_id}|${r.discipline || ""}|${r.section_id || ""}|${r.month_index}|${r.week_index}`;
const lineKeyOf = (r) => `${r.route_id}|${r.discipline || ""}|${r.section_id || ""}|${r.month_index}`;
const wkBody = (r) => ({ route_id: r.route_id, month_index: r.month_index,
                         discipline: r.discipline || "", section_id: r.section_id || "",
                         week_index: r.week_index });
const numOr = (v, d) => (v === "" || v == null || isNaN(+v)) ? d : +v;

function StatusChip({ s, parentChanged }){
  const map = { derived: ["#64748b", "rgba(100,116,139,.12)"],
                edited:  ["#B45309", "rgba(217,119,6,.14)"],
                confirmed: ["var(--green)", "rgba(3,158,134,.14)"] };
  const [c, bg] = map[s] || map.derived;
  return (
    <span className="inline-flex flex-wrap justify-end gap-1">
      <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full" style={{ color: c, background: bg }}>{s}</span>
      {/* The parent month's quantity moved after this week was set. Only ever shown on
          an edited or confirmed week — a derived one is refreshed instead of flagged. */}
      {parentChanged && (
        <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-full"
          style={{ color: "var(--red)", background: "rgba(191,46,85,.12)" }}
          title="The parent month's quantity changed after this week was set. This week was deliberately not refreshed.">
          parent month changed
        </span>
      )}
    </span>
  );
}

function LookAhead({ meta, who }){
  const { months, routes } = meta;
  const routeById = useMemo(() => Object.fromEntries((routes || []).map(r => [r.route_id, r])), [routes]);

  // current month + next month, clamped to the horizon
  const win = useMemo(() => {
    const now = new Date();
    const cur = (now.getFullYear() - months.start_year) * 12 + (now.getMonth() + 1);
    const from = Math.max(1, Math.min(cur, months.count));
    return { from, to: Math.min(months.count, from + 1), outside: cur < 1 || cur > months.count };
  }, [months]);

  const [payload, setPayload] = useState(null);
  const [err, setErr] = useState("");
  const [tick, setTick] = useState(0);
  const [busy, setBusy] = useState("");
  const [draft, setDraft] = useState({});                // cellKey -> unsaved input
  const [confirming, setConfirming] = useState(null);    // week whose flag dialog is open
  const [flags, setFlags] = useState({ weather: "", wetness: "", traffic: "", other: "" });
  const [calibrating, setCalibrating] = useState(null);  // {row, override}

  useEffect(() => {
    let live = true;
    setErr("");
    fetch(`${API}/forecast-weeks?from_month=${win.from}&to_month=${win.to}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setPayload(j); setDraft({}); } })
      .catch(e => { if(live) setErr(`Couldn't load the look-ahead (${e}).`); });
    return () => { live = false; };
  }, [win.from, win.to, tick]);

  const rows = (payload && payload.weeks) || [];
  const nextW = (payload && payload.next_week) || {};
  const isNext = (r) => r.month_index === nextW.month_index && r.week_index === nextW.week_index;

  const lines = useMemo(() => {
    const g = {};
    rows.forEach(r => {
      const k = lineKeyOf(r);
      (g[k] || (g[k] = { key: k, route_id: r.route_id, discipline: r.discipline || "",
                         section_id: r.section_id || "", month_index: r.month_index,
                         unit: r.unit, material_type: r.material_type,
                         vehicle_type: r.vehicle_type, parent_status: r.parent_status,
                         weeks: {} })).weeks[r.week_index] = r;
    });
    return Object.values(g).sort((a, b) => (a.month_index - b.month_index)
      || a.route_id.localeCompare(b.route_id) || a.discipline.localeCompare(b.discipline));
  }, [rows]);

  const send = (path, body, method) => {
    setBusy(path);
    return fetch(`${API}${path}`, { method: method || "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(async r => { if(!r.ok){ throw new Error((await r.text()).slice(0, 200)); } return r.json(); })
      .then(() => { setTick(t => t + 1); setErr(""); })
      .catch(e => setErr(String(e.message || e)))
      .finally(() => setBusy(""));
  };

  const savePlanned = (r) => {
    const v = draft[wkKey(r) + "|p"];
    if(v === undefined) return;
    send("/forecast-weeks", { ...wkBody(r), planned_qty: numOr(v, r.planned_qty), edited_by: who || null }, "PUT");
  };
  const saveActual = (r) => {
    const kq = wkKey(r) + "|a", kn = wkKey(r) + "|n";
    if(draft[kq] === undefined && draft[kn] === undefined) return;
    const v = draft[kq] !== undefined ? draft[kq] : (r.actual_qty ?? "");
    // an emptied box clears the actual back to "not reported", which is NOT zero
    send("/forecast-weeks/actual",
      { ...wkBody(r), actual_qty: (v === "" || v == null ? null : numOr(v, null)),
        actual_note: draft[kn] !== undefined ? draft[kn] : (r.actual_note ?? null),
        actual_by: who || null }, "PUT");
  };
  const doConfirm = () => {
    const r = confirming;
    setConfirming(null);
    send("/forecast-weeks/confirm", { ...wkBody(r), confirmed_by: who || null, ...flags });
  };
  const doCalibrate = () => {
    const { row, override } = calibrating;
    setCalibrating(null);
    send("/forecast-weeks/calibrate",
      { ...wkBody(row), override_qty: (override === "" ? null : numOr(override, null)), by: who || null });
  };

  // the week AFTER this one, so the calibrate button can say whether it is confirmed
  // BEFORE it is pressed rather than after the 400 comes back
  const weekAfter = (line, r) => {
    if(r.week_index < 4) return line.weeks[r.week_index + 1];
    const nxt = lines.find(l => l.route_id === line.route_id && l.discipline === line.discipline
      && l.section_id === line.section_id && l.month_index === line.month_index + 1);
    return nxt && nxt.weeks[1];
  };

  const fld = "w-full border border-slate-300 rounded px-1.5 py-1 text-xs text-right tabular-nums outline-none focus:ring-2 focus:ring-[color:var(--blue)]";

  return (
    <div className="max-w-[1400px] mx-auto p-5">
      <PageHeader title="Look-ahead"
        subtitle={`Four weeks on each approved month line: ${monthLabelAbs(win.from, months.start_year)} and ${monthLabelAbs(win.to, months.start_year)}. Weeks appear when a month is approved and start at a quarter of it. Typed only — there is no import.`} />

      {win.outside && (
        <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800 mb-3">
          Today is outside the forecast horizon, so this is showing the nearest month in range.
        </div>
      )}
      {err && <div className="rounded-lg border p-3 text-sm mb-3"
        style={{ borderColor: "var(--red)", color: "var(--red)", background: "rgba(191,46,85,.06)" }}>{err}</div>}

      {!payload ? <div className="p-8 text-center text-slate-400">Loading…</div>
        : lines.length === 0 ? (
        <div className="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500">
          No approved forecast lines in {monthLabelAbs(win.from, months.start_year)} or{" "}
          {monthLabelAbs(win.to, months.start_year)}. Weeks are created when a month line is approved —
          a Pending line has none by design.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="overflow-auto">
            <table className="text-sm" style={{ minWidth: "1180px" }}>
              <thead className="bg-slate-50 text-slate-500 text-xs">
                <tr>
                  <th rowSpan={2} className="px-3 py-2 text-left font-semibold border-r border-slate-200">Line</th>
                  <th rowSpan={2} className="px-3 py-2 text-left font-semibold border-r border-slate-200">Month</th>
                  {WEEK_NOS.map(w => (
                    <th key={w} colSpan={3} className="px-2 py-1.5 text-center font-semibold border-r border-slate-200">
                      Week {w} <span className="font-normal text-slate-400">· {WEEK_DAYS[w]}</span>
                    </th>
                  ))}
                </tr>
                <tr>
                  {WEEK_NOS.map(w => (
                    <React.Fragment key={w}>
                      <th className="px-2 py-1 text-right font-medium text-[10px] uppercase tracking-wide">Planned</th>
                      <th className="px-2 py-1 text-right font-medium text-[10px] uppercase tracking-wide">Actual</th>
                      <th className="px-2 py-1 text-right font-medium text-[10px] uppercase tracking-wide border-r border-slate-200">Var</th>
                    </React.Fragment>
                  ))}
                </tr>
              </thead>
              <tbody>
                {lines.map(line => {
                  const rt = routeById[line.route_id] || {};
                  return (
                    <tr key={line.key} className="border-t border-slate-100 align-top">
                      <td className="px-3 py-2 border-r border-slate-100 whitespace-nowrap">
                        <div className="font-medium text-slate-800">{line.route_id}</div>
                        <div className="text-[11px] text-slate-400">{rt.origin || "—"} → {rt.dest || "—"}</div>
                        <div className="text-[11px] text-slate-500">
                          {line.discipline || "unassigned"}{line.section_id ? ` · ${line.section_id}` : ""}
                        </div>
                        <div className="text-[10px] text-slate-400" title={line.vehicle_type}>{line.unit === "m3" ? "m³" : line.unit} · {line.vehicle_type ? vehLabel(line.vehicle_type) : "—"}</div>
                        {/* Reopening a month does NOT delete its weeks — a confirmed week
                            with an actual against it is a record of what happened. */}
                        {line.parent_status && line.parent_status !== "Approved" && (
                          <div className="text-[10px] mt-0.5" style={{ color: "var(--red)" }}
                            title="These weeks were created while the month was approved. Reopening it does not delete them.">
                            month is now {line.parent_status}
                          </div>
                        )}
                      </td>
                      <td className="px-3 py-2 border-r border-slate-100 whitespace-nowrap tabular-nums text-slate-600">
                        {monthLabelAbs(line.month_index, months.start_year)}
                      </td>
                      {WEEK_NOS.map(w => {
                        const r = line.weeks[w];
                        if(!r) return <td key={w} colSpan={3} className="px-2 py-2 text-center text-slate-300 border-r border-slate-100">—</td>;
                        const k = wkKey(r);
                        const next = isNext(r);
                        // ⭐ Editable only when it is the next-week cell, or when somebody
                        // has already edited this one. A confirmed week is never editable.
                        const canEdit = r.status !== "confirmed" && (next || r.status === "edited");
                        const after = weekAfter(line, r);
                        const canCal = r.actual_qty != null && !!after && after.status !== "confirmed";
                        return (
                          <React.Fragment key={w}>
                            <td className={"px-2 py-2 text-right " + (next ? "bg-blue-50/60" : "")}>
                              {canEdit ? (
                                <input className={fld} inputMode="decimal"
                                  value={draft[k + "|p"] ?? (r.planned_qty ?? "")}
                                  onChange={e => setDraft(d => ({ ...d, [k + "|p"]: e.target.value }))}
                                  onBlur={() => savePlanned(r)} />
                              ) : (
                                <span className="tabular-nums text-slate-600"
                                  title={r.status === "confirmed" ? "Confirmed — reopen it to change the plan"
                                                                  : "Only next week is editable"}>
                                  {fmt(r.planned_qty || 0, line.unit)}
                                </span>
                              )}
                              <div className="mt-1 flex flex-col items-end gap-1">
                                <StatusChip s={r.status} parentChanged={r.parent_changed} />
                                {/* A SEPARATE act from editing: adjusting a number and
                                    committing to it are different, and only the second
                                    one blocks calibration into this week. */}
                                {next && r.status !== "confirmed" && (
                                  <button onClick={() => { setConfirming(r); setFlags({ weather: r.weather || "", wetness: r.wetness || "", traffic: r.traffic || "", other: r.other || "" }); }}
                                    className="text-[10px] font-semibold px-1.5 py-0.5 rounded text-white"
                                    style={{ background: "var(--green)" }}>Confirm next week</button>
                                )}
                              </div>
                            </td>
                            <td className="px-2 py-2 text-right">
                              <input className={fld} inputMode="decimal" placeholder="—"
                                value={draft[k + "|a"] ?? (r.actual_qty ?? "")}
                                onChange={e => setDraft(d => ({ ...d, [k + "|a"]: e.target.value }))}
                                onBlur={() => saveActual(r)} />
                              <input className={fld + " mt-1 text-left"} placeholder="note"
                                value={draft[k + "|n"] ?? (r.actual_note ?? "")}
                                onChange={e => setDraft(d => ({ ...d, [k + "|n"]: e.target.value }))}
                                onBlur={() => saveActual(r)} />
                            </td>
                            <td className="px-2 py-2 text-right border-r border-slate-100">
                              <span className="tabular-nums font-medium"
                                style={{ color: r.variance == null ? "#cbd5e1"
                                  : r.variance > 0 ? "var(--red)" : "var(--green)" }}>
                                {r.variance == null ? "—" : fmt(r.variance, line.unit)}
                              </span>
                              {/* ⭐ NEVER fires on save of the actual. A separate press,
                                  writing next week and nothing else. */}
                              <div className="mt-1">
                                {r.actual_qty != null && (
                                  <button disabled={!canCal}
                                    onClick={() => setCalibrating({ row: r, unit: line.unit, override: "" })}
                                    title={!after ? "Next week is outside this window"
                                      : after.status === "confirmed" ? "Next week is already confirmed — reopen it first"
                                      : "Add this variance to next week's plan"}
                                    className="text-[10px] font-semibold px-1.5 py-0.5 rounded border disabled:opacity-40"
                                    style={{ borderColor: "var(--navy)", color: "var(--navy)" }}>
                                    → next week
                                  </button>
                                )}
                              </div>
                            </td>
                          </React.Fragment>
                        );
                      })}
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          <div className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100">
            Editable cell = <span className="px-1 bg-blue-50">next week</span> ({monthLabelAbs(nextW.month_index, months.start_year)},
            week {nextW.week_index}), chosen by the server. Variance = planned − actual. Typing an actual never
            moves next week; the → button does, and only next week.
            {busy && <span className="ml-2 text-slate-500">saving…</span>}
          </div>
        </div>
      )}

      {confirming && (
        <div className="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50" onClick={() => setConfirming(null)}>
          <div className="bg-white rounded-xl p-5 w-full max-w-md space-y-3" onClick={e => e.stopPropagation()}>
            <div className="font-semibold text-[color:var(--navy-deep)]">
              Confirm {confirming.route_id} · {monthLabelAbs(confirming.month_index, months.start_year)} week {confirming.week_index}
            </div>
            <p className="text-xs text-slate-500">
              All four notes are optional and may be left blank. Free text — no scores, no lookups, no colour
              used as logic.
            </p>

              <label key={f} className="block">
                <span className="text-[11px] uppercase tracking-wide text-slate-400">{f}</span>
                <input className={selCls} value={flags[f]}
                  onChange={e => setFlags(s => ({ ...s, [f]: e.target.value }))} />
              </label>
            ))}
            <div className="flex gap-2 justify-end pt-1">
              <button onClick={() => setConfirming(null)} className="px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
              <button onClick={doConfirm} className="px-4 py-2 text-sm font-semibold text-white rounded-lg" style={{ background: "var(--green)" }}>Confirm week</button>
            </div>

      {calibrating && (
        <div className="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50" onClick={() => setCalibrating(null)}>
          <div className="bg-white rounded-xl p-5 w-full max-w-md space-y-3" onClick={e => e.stopPropagation()}>
            <div className="font-semibold text-[color:var(--navy-deep)]">Apply variance to next week</div>
            <p className="text-xs text-slate-600">
              next.planned = next.planned + (planned − actual) ={" "}
              <span className="tabular-nums font-medium">{fmt(calibrating.row.variance || 0, calibrating.unit)}</span>.
              Only next week changes; weeks after it are untouched.
            </p>
            <label className="block">
              <span className="text-[11px] uppercase tracking-wide text-slate-400">Or type next week's figure instead</span>
              <input className={selCls} inputMode="decimal" placeholder="leave blank to use the formula"

      <Stockpiles meta={meta} who={who} from={win.from} to={win.to} tick={tick} />

}

// ---- Task D2: stock held on a location -----------------------------------------
// A READ MODEL. Nothing here is stored: inbound is the sum of typed week ACTUALS on
// routes whose destination is this location, so a week nobody has reported shows 0
// rather than a quarter of the month forecast. Over capacity is a FLAG, never a block.
function Stockpiles({ meta, who, from, to, tick }){
  const { months } = meta;
  const [data, setData] = useState(null);
  const [draft, setDraft] = useState({});
  const [own, setOwn] = useState(0);
  const [err, setErr] = useState("");

  useEffect(() => {
    let live = true;
    fetch(`${API}/stockpiles?from_month=${from}&to_month=${to}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setData(j); setDraft({}); } })
      .catch(e => { if(live) setErr(`Couldn't load stock (${e}).`); });
    return () => { live = false; };
  }, [from, to, tick, own]);

  const saveConsumed = (s, m, w) => {
    const k = `${s.location_id}|${m}|${w}`;
    const v = draft[k];
    if(v === undefined) return;
    fetch(`${API}/stockpiles/consume`, { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ location_id: s.location_id, month_index: m, week_index: w,
        consumed_qty: (v === "" ? null : +v), unit: s.capacity_unit, note: null,
        updated_by: who || null }) })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(() => setOwn(n => n + 1))
      .catch(e => setErr(`Couldn't save consumption (${e}).`));
  };

  const piles = (data && data.stockpiles) || [];
  const fldS = "w-full border border-slate-300 rounded px-1 py-0.5 text-[11px] text-right tabular-nums outline-none focus:ring-2 focus:ring-[color:var(--blue)]";

  return (
    <div className="mt-6">
      <div className="mb-2">
        <h3 className="text-sm font-bold text-[color:var(--navy-deep)]">Stock held</h3>
        <p className="text-xs text-slate-500">
          Type what came out of each pile. In = typed week actuals on routes delivering here — a week with no
          actual counts as nothing, not as a share of the forecast. Over capacity is flagged, never blocked.
        </p>
      </div>
      {err && <div className="text-xs mb-2" style={{ color: "var(--red)" }}>{err}</div>}
      {!data ? <div className="p-6 text-center text-slate-400 text-sm">Loading…</div>
        : piles.length === 0 ? (
        <div className="bg-white rounded-xl border border-slate-200 p-6 text-center text-slate-500 text-sm">
          No locations that hold stock yet. Set a type of Stockpile, Site, Compound or Railhead on the
          Locations page, and give it a capacity there.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="overflow-auto">
            <table className="text-xs" style={{ minWidth: "1000px" }}>
              <thead className="bg-slate-50 text-slate-500">
                <tr>
                  <th className="px-3 py-2 text-left font-semibold border-r border-slate-200">Location</th>
                  {[from, to].map(m => (
                    <th key={m} colSpan={4} className="px-2 py-1.5 text-center font-semibold border-r border-slate-200">
                      {monthLabelAbs(m, months.start_year)}
                    </th>
                  ))}
                </tr>
                <tr>
                  <th className="px-3 py-1 text-left font-medium text-[10px] uppercase tracking-wide border-r border-slate-200">max · opening</th>
                  {[from, to].map(m => WEEK_NOS.map(w => (
                    <th key={`${m}-${w}`} className={"px-2 py-1 text-center font-medium text-[10px] " + (w === 4 ? "border-r border-slate-200" : "")}>W{w}</th>
                  )))}
                </tr>
              </thead>
              <tbody>
                {piles.map(s => (
                  <tr key={s.location_id} className="border-t border-slate-100 align-top">
                    <td className="px-3 py-2 border-r border-slate-100 whitespace-nowrap">
                      <div className="font-medium text-slate-800">{s.name}</div>
                      <div className="text-[10px] text-slate-400">{s.loc_type} · {s.location_id}</div>
                      <div className="text-[11px] text-slate-600 tabular-nums">
                        {/* ⭐ '—', never 0. No capacity recorded is not zero capacity. */}
                        max {s.capacity_qty == null ? "—" : `${fmt(s.capacity_qty, s.capacity_unit)} ${s.capacity_unit === "m3" ? "m³" : s.capacity_unit}`}
                        {" · opening "}{fmt(s.opening_qty || 0, s.capacity_unit)}
                      </div>
                    </td>
                    {[from, to].map(m => WEEK_NOS.map(w => {
                      const cell = (s.weeks || []).find(x => x.month_index === m && x.week_index === w) || {};
                      const k = `${s.location_id}|${m}|${w}`;
                      return (
                        <td key={k} className={"px-2 py-2 " + (w === 4 ? "border-r border-slate-100 " : "")
                              + (cell.over ? "bg-[rgba(191,46,85,.07)]" : "")}>
                          <input className={fldS} inputMode="decimal" placeholder="out"
                            value={draft[k] ?? (cell.consumed || "")}
                            onChange={e => setDraft(d => ({ ...d, [k]: e.target.value }))}
                            onBlur={() => saveConsumed(s, m, w)} />
                          <div className="mt-1 text-[10px] tabular-nums text-slate-500 text-right leading-tight">
                            <div>in {fmt(cell.inbound || 0, s.capacity_unit)}</div>
                            <div>bal {fmt(cell.balance_end || 0, s.capacity_unit)}</div>
                            <div style={{ color: cell.over ? "var(--red)" : undefined }}>
                              rem {cell.remaining == null ? "—" : fmt(cell.remaining, s.capacity_unit)}
                            </div>
                          </div>
                        </td>
                      );
                    }))}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ================================================================= Data Management (Phase 1)
// This is the structural view of the network: every route is drawn the same neutral
// navy and the selected one is the only thing highlighted. Material colouring belongs
// on the forecasting dashboard and the public route map, not here.
const ROUTE_COLOR = "#003787";
// pairs HERE could not route — drawn dashed straight so 'impossible' reads differently
// from 'not baked yet', which used to look identical (both simply absent)
const FAILED_COLOR = "#BF2E55";
// the selected route's other options, drawn behind the chosen line
const ALT_COLOR = "#94A3B8";
const MAP_H = "62vh";     // map height — the right-hand column matches it and scrolls inside
// ⚠️ This is the ADMIN map's node legend, not the public map's palette — the public
// map draws nodes as DOM markers with their own colouring. #0F766E is the rail colour
// the build list reserves and is used here for the same concept. Stockpile's #78350F
// is MY choice, not a reserved value: it is clear of every reserved route, brand and
// IPT colour. Change it here and the legend follows, because both are generated from
// this object.
const NODE_COLORS = { "Quarry": "#C6841D", "Port": "#003787", "Compound": "#039E86",
                      "Site": "#6D28D9", "Railhead": "#0F766E", "Stockpile": "#78350F" };

// Phase 3 zones. The colour carries the only distinction that matters at a glance:
// red means the router is steered away from this area, grey means it is drawn for

const ZONE_ROUTING = "#BF2E55";
const ZONE_ADVISORY = "#64748B";
// Phase 4. A haul road is the one kind that is NOT an obstacle: every other kind with
// "affects routing" on goes to HERE as an area to avoid, and a haul road is a road to
// route through. It gets its own colour because red would read as "closed".
const ZONE_HAUL = "#C2790B";
const HAUL_KIND = "haul_road";
const ZONE_KINDS = [
  ["closure", "Road closure"],
  ["weight_limit", "Weight / height limit"],
  ["works", "Works area"],
  ["haul_road", "Temporary haul road"],
  ["other", "Other"],
];
// Which of the two ways of making a route use a haul road applies. This is a fact about
// HERE's map data, not a preference — see the backend's haul.py. Splice is the default
// because its failure mode (geometry only as good as the drawing) is visible, and via's
// (a confident wrong route through roads HERE does know) is not.
const HAUL_MODES = [
  ["splice", "Splice — HERE does not map this road (default, safe)"],
  ["via", "Via — HERE already maps this road"],
];

// The sub-tabs share one map, so instead of toggling layers we lean the styling towards
// whichever half is in focus. Applied on add and re-applied after a basemap swap.
// Zones borrow the Locations weighting: routes stay legible but recede, so the shape
// being drawn over them is what reads.
const EMPHASIS = {
  locations: { route: 2, routeOp: 0.45, casingOp: 0.30, node: 7, nodeStroke: 2 },
  routes:    { route: 3, routeOp: 1.00, casingOp: 0.85, node: 5, nodeStroke: 1.5 },
  zones:     { route: 2, routeOp: 0.55, casingOp: 0.35, node: 5, nodeStroke: 1.5 },
};

function nodeExpr(){
  const e = ["match", ["get", "loc_type"]];
  Object.entries(NODE_COLORS).forEach(([k, v]) => { e.push(k, v); });
  e.push("#64748B");

}

// Week 1: two new types.
//   Railhead  where material arrives by rail and leaves by road. An ORIGIN, like a
//              quarry or a port — map/index.html's filterByNode() and
//              network._role_for() carry the matching rule and all three must agree.
//   Stockpile  somewhere material is held. A DESTINATION by default.
const LOC_TYPES = ["Quarry", "Port", "Compound", "Site", "Railhead", "Stockpile", "Other"];
// 2026-09-02: 'Rail head' -> 'Railhead'. The backend rewrites old rows on boot and
// canonicalises on read, but this client can meet a row the backend has not touched yet
// (a stale /api/locations/geojson in the tab). Read either spelling; write only the new.
const locTypeOf = (t) => (t === "Rail head" ? "Railhead" : t);
// Types that can hold stock — the capacity fields appear for these. Mirrors
// stockpiles.STORAGE_TYPES on the backend.
const STORAGE_TYPES = ["Stockpile", "Site", "Compound", "Railhead"];
const ROLE_OPTIONS = [["origin", "Origin (supplier)"], ["destination", "Destination (site)"], ["both", "Both"]];
const ROLE_LABEL = { origin: "Origin", destination: "Destination", both: "Both" };
const asArray = (v) => Array.isArray(v) ? v : (() => { try { return JSON.parse(v || "[]"); } catch(e){ return []; } })();

// "Artic Tipper (44t)" -> "Tipper (44t)". Full name stays in the chip's tooltip.
// ---- 2026-09-02: one vehicle, three labels ------------------------------------
// VEH.lang is the toggle (en | eu | ee); VEH.labels comes off /api/meta. vehLabel()
// changes ONLY what is shown — the string a forecast line stores, the payload it
// converts on and the emissions factor are all keyed on the canonical id, which is
// the EU string for the four planning vehicles and the trade name for the six legacy
// ones. A missing label falls back to that id, never to an invented name.
const VEH = { lang: "eu", labels: {}, fallbacks: {} };
try { const l = localStorage.getItem("rbe_veh_lang"); if(["en","eu","ee"].includes(l)) VEH.lang = l; } catch(e){}
const VEH_LANGS = [["en", "English"], ["eu", "European"], ["ee", "Estonian"]];
const vehLabel = (v, lang) => ((VEH.labels[v] || {})[lang || VEH.lang]) || v || "";
const vehIsFallback = (v, lang) => ((VEH.fallbacks[v] || []).includes(lang || VEH.lang));
// short form for tables: the label, minus the leading 'Artic'/'Rigid' of the trade names
const vehShort = (v) => vehLabel(v).replace(/^(Artic|Rigid)\s+/, "");

// Which vehicle profiles a route is baked for, and how that went.
// A route is baked in two directions now, so a chip is only "fully baked" (solid) when
// both the laden run out and the empty run back are cached. Outbound-only shows hollow —
// enough to draw the map, not enough for a cycle time.
function VehChips({ profiles }){
  const keys = Object.keys(profiles || {}).sort();
  if(!keys.length) return <span className="text-xs text-slate-300">not baked</span>;
  return (
    <span className="flex flex-wrap gap-1">
      {keys.map(k => {
        const p = profiles[k] || {};
        const both = p.baked && p.return_baked;
        const [bg, fg] = both    ? ["rgba(3,158,134,.12)", "var(--green)"]
                       : p.baked ? ["rgba(255,193,1,.16)", "#8a6d00"]
                       : p.error ? ["rgba(191,46,85,.12)", "var(--red)"]
                                 : ["#f1f5f9", "#94a3b8"];
        const alts = p.alt_count > 1 ? ` · ${p.alt_count} options` : "";
        const tip = p.error ? `${k} — ${p.error}`
                  : !p.baked ? `${k} · not baked`
                  : `${k} · ${p.distance_km} km out` +
                    (p.return_baked ? ", return baked" : ", return NOT baked") + alts;
        return (
          <span key={k} title={tip}
            className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
            style={{ background: bg, color: fg }}>
            {vehShort(k)}{p.baked && !p.return_baked ? " ↦" : ""}
          </span>
        );
      })}
    </span>
  );
}

// Step C — haul-cycle figures for one route, fetched on demand when its row is opened.
// Everything here is derived from cached geometry plus factors.json, so opening a row
// costs one cheap request and never touches HERE.
// Phase 4 — haul roads on ONE route, edited on the route itself rather than in a separate
// drawing tool. That was the explicit requirement: a haul road belongs to the routes that
// use it, and attaching it here is what makes it do anything at all.
//
// Every write clears the route's baked legs and drives the same /api/admin/bake-routes
// loop the zone writes use. It is more HERE calls than it looks: a spliced haul road costs
// two calls per leg, not one, and the count is shown before it is spent.
function HaulRoads({ routeId, haulRoads, token, onChanged }){
  const [plan, setPlan] = useState(null);
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState("");
  const [pick, setPick] = useState("");

  const load = () => fetch(`${API}/routes/${encodeURIComponent(routeId)}/haul-roads`)
    .then(r => r.json()).then(j => { setPlan(j); return j; });

  useEffect(() => { let live = true; load().catch(() => { if(live) setPlan(null); });
                    return () => { live = false; }; }, [routeId]);

  const attached = (plan && plan.links || []).filter(l => l.route_id === routeId);
  const byId = {};
  (haulRoads || []).forEach(z => { byId[z.id] = z; });
  const available = (haulRoads || []).filter(z => !attached.some(l => l.zone_id === z.id));

  const qs = () => (token ? `?token=${encodeURIComponent(token)}` : "");

  const run = async (fn, label) => {
    setBusy(true); setMsg(label);
    try {
      const j = await fn();
      await load();
      const inv = j.invalidated || {};
      let m = label.replace(/…$/, " — done.");
      if(inv.leg_count){
        m += ` ${inv.leg_count} baked leg(s) cleared, ${inv.here_calls} HERE call(s) to re-route.`;
        setMsg(m);
        if(onChanged) m += await onChanged(inv);
      }
      setMsg(m);
    } catch(e){ setMsg("Failed: " + e.message); }
    setBusy(false);
  };

  const post = async (url, opts) => {
    const res = await fetch(url, opts);
    if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0, 160)}`); }
    return res.json();
  };

  const attach = () => {
    if(!pick) return;
    const z = byId[pick];
    run(() => post(`${API}/admin/routes/${encodeURIComponent(routeId)}/haul-roads${qs()}`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zone_id: pick, seq: null }),
    }), `Attaching ${(z && z.name) || pick}…`).then(() => setPick(""));
  };

  const detach = (zid) => {
    const z = byId[zid];
    if(!confirm(`Take ${(z && z.name) || zid} off ${routeId}?\n\nEvery baked leg of this route is cleared and re-routed.`)) return;
    run(() => post(`${API}/admin/routes/${encodeURIComponent(routeId)}/haul-roads/${encodeURIComponent(zid)}${qs()}`,
                   { method: "DELETE" }), `Detaching ${(z && z.name) || zid}…`);
  };

  const move = (i, d) => {
    const ids = attached.map(l => l.zone_id);
    const j = i + d;
    if(j < 0 || j >= ids.length) return;
    [ids[i], ids[j]] = [ids[j], ids[i]];
    run(() => post(`${API}/admin/routes/${encodeURIComponent(routeId)}/haul-roads/order${qs()}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ zone_ids: ids }),
    }), "Reordering…");
  };

  const loadedPlan = (plan && plan.plan && plan.plan.loaded) || [];
  const noSpeed = loadedPlan.filter(s => !s.speed_kph);

  return (
    <div className="rounded-lg border border-slate-200 bg-white p-2.5 mb-3">
      <div className="flex items-center justify-between gap-2 mb-1.5">
        <span className="text-[11px] uppercase tracking-wide" style={{ color: ZONE_HAUL }}>
          Temporary haul roads on this route
        </span>
        {plan && plan.here_calls_per_bake != null && !!attached.length && (
          <span className="text-[10px] text-slate-400">
            a full re-bake of this route is {plan.here_calls_per_bake} HERE call(s)
          </span>
        )}
      </div>

      {!attached.length && (
        <p className="text-[11px] text-slate-500">
          None. This route is routed by HERE end to end.
        </p>
      )}

      {!!attached.length && (
        <table className="text-[11px] w-full mb-2">
          <thead className="text-slate-400">
            <tr>
              <th className="px-1 py-0.5 text-left font-semibold">Order</th>
              <th className="px-1 py-0.5 text-left font-semibold">Road</th>
              <th className="px-1 py-0.5 text-right font-semibold">Drawn km</th>
              <th className="px-1 py-0.5 text-right font-semibold">Speed</th>
              <th className="px-1 py-0.5 text-right font-semibold">Adds</th>
              <th className="px-1 py-0.5 text-left font-semibold">Mode</th>
              <th className="px-1 py-0.5"></th>
            </tr>
          </thead>
          <tbody>
            {attached.map((l, i) => {
              const z = byId[l.zone_id] || {};
              const step = loadedPlan.find(s => s.zone_id === l.zone_id);
              const inPlan = !!step;
              return (
                <tr key={l.zone_id} className="border-t border-slate-100">
                  <td className="px-1 py-1 text-slate-400">
                    <button onClick={() => move(i, -1)} disabled={busy || i === 0}
                      title="Earlier on the outbound leg"
                      className="px-1 disabled:opacity-25 hover:text-slate-700">▲</button>
                    <button onClick={() => move(i, 1)} disabled={busy || i === attached.length - 1}
                      title="Later on the outbound leg"
                      className="px-1 disabled:opacity-25 hover:text-slate-700">▼</button>
                  </td>
                  <td className="px-1 py-1">
                    <span className="font-medium text-slate-700">{z.name || l.zone_id}</span>
                    <span className="text-slate-400"> {l.zone_id}</span>
                    {!inPlan && (
                      <span className="block text-[10px]" style={{ color: "var(--red)" }}>
                        not in force today — inactive, outside its dates, or not open to traffic,
                        so no route is threaded through it
                      </span>
                    )}
                  </td>
                  <td className="px-1 py-1 text-right tabular-nums">{z.length_km != null ? z.length_km.toFixed(2) : "—"}</td>
                  <td className="px-1 py-1 text-right tabular-nums">
                    {z.speed_kph ? `${z.speed_kph} km/h`
                                 : <span style={{ color: "var(--red)" }}>not set</span>}
                  </td>
                  <td className="px-1 py-1 text-right tabular-nums">
                    {step && step.assigned_duration_hr
                      ? `${Math.round(step.assigned_duration_hr * 60)} min`
                      : <span className="text-slate-300">—</span>}
                  </td>
                  <td className="px-1 py-1 text-slate-500">
                    {(z.haul_mode || "splice")}
                    {!z.haul_mode && <span className="text-slate-300"> (default)</span>}
                  </td>
                  <td className="px-1 py-1 text-right">
                    <button onClick={() => detach(l.zone_id)} disabled={busy}
                      className="text-[10px] font-semibold text-[color:var(--red)] hover:underline disabled:opacity-40">Detach</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}

      <div className="flex items-center gap-2">
        <select value={pick} onChange={e => setPick(e.target.value)} disabled={busy || !available.length}
          className="border border-slate-200 rounded-lg px-2 py-1 text-[11px] bg-white disabled:opacity-40">
          <option value="">{available.length ? "Add a haul road…" : "No other haul roads drawn"}</option>
          {available.map(z => (
            <option key={z.id} value={z.id}>
              {z.name} · {z.length_km != null ? `${z.length_km.toFixed(1)} km` : "—"}{z.speed_kph ? ` @ ${z.speed_kph} km/h` : " (no speed)"}
            </option>
          ))}
        </select>
        <button onClick={attach} disabled={busy || !pick}
          className="text-[11px] font-semibold px-2 py-1 rounded-md text-white disabled:opacity-40"
          style={{ background: ZONE_HAUL }}>Attach</button>
      </div>

      {!!attached.length && (
        <p className="text-[10px] text-slate-400 mt-1.5">
          Order is the outbound direction; the return leg meets them in reverse and enters each
          road from the other end. Which end is entry is worked out per leg from the geometry, so
          the order you drew a road in does not matter.
        </p>
      )}
      {!!noSpeed.length && (
        <p className="text-[10px] mt-1" style={{ color: "var(--red)" }}>
          {noSpeed.length} of these has no assigned speed, so its stretch adds distance but no time
          to the cycle. Set one on the Zones tab.
        </p>
      )}
      {!!attached.length && (
        <p className="text-[10px] text-amber-700 mt-1">
          A leg routed through a haul road comes back as a <strong>single option</strong> — there
          are no alternatives to promote on this route while a haul road is attached.
        </p>
      )}
      {msg && <p className="text-[11px] text-slate-600 mt-1.5">{msg}</p>}
    </div>
  );
}

// Phase 2.5a — Tark Tee restrictions on one route.
//
// Advisory, never a block: the router is not given this data. HERE has its own
// restriction model and returns its own notices, and two systems arguing about the same
// road is worse than one. This says "your route passes a weak bridge"; a human reads it.
//
// ⚠️ It deliberately makes NO tonnage judgement about a weak bridge. nominal_load comes
// back as a class like "N-13/NG-60", not tonnes, and the mapping has never been
// established here. The class and the vehicle's laden weight are shown side by side and
// the reader draws the conclusion — see backend/restrictions.check_route().
function RouteRestrictions({ routeId }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");
  const [open, setOpen] = useState(false);

  useEffect(() => {
    let live = true;
    setData(null); setErr("");
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/restrictions`)
      .then(r => r.json())
      .then(j => { if(!live) return; j.error ? setErr(j.error) : setData(j); })
      .catch(e => { if(live) setErr(e.message); });
    return () => { live = false; };
  }, [routeId]);

  if(err) return (
    <p className="text-[11px] text-slate-400 mb-3">
      Road restrictions unavailable — Tark Tee could not be reached ({err}).
    </p>
  );
  if(!data) return <p className="text-[11px] text-slate-400 mb-3">Checking road restrictions…</p>;
  if(!data.baked) return null;

  const hits = data.hits || [];
  const breaches = hits.filter(h => h.severity === "breach");
  const warns = hits.filter(h => h.severity === "warn");
  const fetchErr = data.fetch_errors && Object.keys(data.fetch_errors).length;
  const incomplete = fetchErr
    ? " ⚠️ Some layers could not be fetched, so this is not a complete check." : "";
  const expired = data.expired_or_future_excluded
    ? ` ${data.expired_or_future_excluded} record(s) outside their date window were excluded.` : "";

  if(!hits.length) return (
    <p className="text-[11px] text-slate-400 mb-3">
      No Tark Tee restrictions in force within {data.match_m} m of this route.{expired}{incomplete}
    </p>
  );

  // a breach is a statement of fact — two numbers in the same unit — and outranks
  // everything else in how loudly this reads
  const tone = breaches.length ? { border: "border-red-300 bg-red-50/70", head: "#B91C1C" }
             : warns.length    ? { border: "border-amber-300 bg-amber-50/60", head: "#92400E" }
                               : { border: "border-slate-200 bg-white", head: "var(--navy)" };

  return (
    <div className={"rounded-lg border p-2.5 mb-3 " + tone.border}>
      <button onClick={() => setOpen(o => !o)}
        className="w-full flex items-center justify-between gap-2 text-left">
        <span className="text-[11px] uppercase tracking-wide" style={{ color: tone.head }}>
          Road restrictions on this route
          {breaches.length ? ` · ${breaches.length} EXCEEDED` : ""}
          {warns.length ? ` · ${warns.length} to check` : ""}
          {!breaches.length && !warns.length ? ` · ${hits.length} note(s)` : ""}
        </span>
        <span className="text-[10px] text-slate-400">{open ? "hide" : "show"}</span>
      </button>

      {open && (
        <table className="text-[11px] w-full mt-2">
          <thead className="text-slate-400">
            <tr>
              <th className="px-1 py-0.5 text-left font-semibold">Restriction</th>
              <th className="px-1 py-0.5 text-right font-semibold">Limit</th>
              <th className="px-1 py-0.5 text-right font-semibold">Vehicle</th>
              <th className="px-1 py-0.5 text-left font-semibold">Verdict</th>
              <th className="px-1 py-0.5 text-right font-semibold">From route</th>
              <th className="px-1 py-0.5 text-left font-semibold">Leg</th>
            </tr>
          </thead>
          <tbody>
            {hits.map((h, i) => (
              <tr key={i} className="border-t border-slate-100 align-top">
                <td className="px-1 py-1">
                  <span className="font-medium" style={{ color: h.colour || "#334155" }}>
                    {h.severity === "breach" ? "■ " : h.severity === "warn" ? "▲ " : "· "}
                    {h.headline || h.what}
                  </span>
                  <span className="block text-[10px] text-slate-400">
                    {h.road_name || (h.road_nr ? `road ${h.road_nr}` : "")}
                    {h.from || h.to ? ` · ${h.from || "open"} → ${h.to || "open"}` : ""}
                  </span>
                  {h.extra_info && (
                    <span className="block text-[10px] text-slate-500 mt-0.5">{h.extra_info}</span>
                  )}
                </td>
                <td className="px-1 py-1 text-right tabular-nums whitespace-nowrap">
                  {h.limit != null
                    ? <b>{h.limit}{h.unit && h.unit !== "load class" ? ` ${h.unit}` : ""}</b>
                    : <span className="text-slate-300">—</span>}
                </td>
                <td className="px-1 py-1 text-right tabular-nums whitespace-nowrap">
                  {h.vehicle_value != null
                    ? `${h.vehicle_value} ${h.unit && h.unit !== "load class" ? h.unit : "t"}`
                    : <span className="text-slate-300">—</span>}
                </td>
                <td className="px-1 py-1 whitespace-nowrap">
                  {h.verdict === "exceeds"
                    ? <span className="font-semibold" style={{ color: "#B91C1C" }}>
                        EXCEEDS by {Math.abs(h.margin)}{h.unit ? ` ${h.unit}` : ""}
                      </span>
                    : h.verdict === "within"
                    ? <span style={{ color: "var(--green)" }}>within · {h.margin}{h.unit ? ` ${h.unit}` : ""} spare</span>
                    : <span className="text-slate-400" title={h.note || ""}>not comparable</span>}
                  {h.verdict === "unknown" && h.note && (
                    <span className="block text-[10px] text-slate-400 whitespace-normal">{h.note}</span>
                  )}
                </td>
                <td className="px-1 py-1 text-right tabular-nums">{h.distance_m} m</td>
                <td className="px-1 py-1 text-slate-500 whitespace-nowrap">
                  {h.leg === "loaded" ? "laden" : "return"} · {vehShort(h.vehicle_profile)}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <p className="text-[10px] text-slate-400 mt-1.5">
        Advisory only. The router is never given this data, and a match means the
        restriction sits within {data.match_m} m of the baked line — not that it is
        necessarily on your carriageway. Mass, height and width are compared for real;
        a weak bridge's load class is not a tonnage and is left for a human.
        Source: Estonian Transport Administration (Tark Tee).{expired}{incomplete}
      </p>
    </div>
  );
}

// Phase 5a — which gate this route uses at each end.
//
// Null means "no explicit choice", which resolves to the location's default gate for
// the direction being travelled, then to the legacy pair, then to the marker. That
// chain is why a route that has never been touched here keeps routing exactly where it
// did before 5a. Changing a selection invalidates the cached geometry, so the re-bake
// is offered rather than performed — the same contract as a zone or haul-road write.
function RouteGates({ routeId, originId, destId, token, blockers, onChanged }){
  const [gates, setGates] = useState(null);
  const [sel, setSel] = useState({ origin_gate_id: "", dest_gate_id: "" });
  const [msg, setMsg] = useState("");

  useEffect(() => {
    let live = true;
    Promise.all([
      fetch(`${API}/gates`).then(r => r.json()),
      fetch(`${API}/routes/status`).then(r => r.json()),
    ]).then(([g, st]) => {
      if(!live) return;
      setGates(g.gates || []);
      const row = (st || []).find(x => x.id === routeId) || {};
      setSel({ origin_gate_id: row.origin_gate_id || "", dest_gate_id: row.dest_gate_id || "" });
    }).catch(e => { if(live){ setGates([]); setMsg(e.message); } });
    return () => { live = false; };
  }, [routeId]);

  const write = async (key, value) => {
    setSel(s => ({ ...s, [key]: value }));
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setMsg("Saving…");
    try {
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(routeId)}/gates${qs}`,
        { method: "PUT", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ [key]: value || null }) });
      const j = await res.json();
      if(!res.ok || j.error) throw new Error(j.error || res.status);
      setMsg(j.rebake_needed
        ? "Saved — this route's cached geometry now points at the old gate. Re-bake it."
        : "Saved.");
      if(j.rebake_needed && onChanged) onChanged();
    } catch(e){ setMsg("Couldn't save: " + e.message); }
  };

  if(gates === null) return null;
  const forLoc = (lid) => (gates || []).filter(g => g.location_id === lid);
  if(!forLoc(originId).length && !forLoc(destId).length && !(blockers || []).length) return null;

  const pick = (label, lid, key) => (
    <label className="block">
      <span className="text-[11px] uppercase tracking-wide text-slate-400">{label}</span>
      <select value={sel[key] || ""} onChange={e => write(key, e.target.value)}
        className="mt-1 w-full border border-slate-300 rounded-lg px-2 py-1.5 text-xs bg-white">
        <option value="">Default for this site</option>
        {forLoc(lid).map(g => (
          <option key={g.id} value={g.id}>
            {g.name} · {g.direction === "access" ? "in only"
              : g.direction === "egress" ? "out only" : "in + out"}
            {g.active ? "" : " · DEACTIVATED"}
          </option>
        ))}
      </select>
    </label>
  );

  return (
    <div className="mb-3 rounded-lg border border-slate-200 bg-white p-2.5">
      <div className="text-[11px] uppercase tracking-wide text-slate-400 mb-1.5">Gates</div>
      {!!(blockers || []).length && (
        <p className="text-xs mb-2 font-semibold" style={{ color: "var(--red)" }}>
          This route will not bake: {(blockers || []).join("; ")}.
        </p>
      )}
      <div className="grid grid-cols-2 gap-2">
        {pick("Origin gate", originId, "origin_gate_id")}
        {pick("Destination gate", destId, "dest_gate_id")}
      </div>
      <p className="text-[11px] text-slate-400 mt-1.5">
        A one-way gate is used only for the direction it serves; the other direction falls
        back to the site&rsquo;s default. Changing a gate moves where HERE routes to, so the
        cached geometry has to be re-baked before the distances mean anything.
      </p>
      {msg && <p className="text-[11px] text-slate-500 mt-1">{msg}</p>}
    </div>
  );
}


function RouteAnalysis({ routeId, colSpan, active, onFocus, onPromote, promoting, leg,
                        haulRoads, token, onHaulChanged, originId, destId, gateBlockers }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    let live = true;
    setData(null); setErr("");
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/analysis`)
      .then(r => r.json())
      .then(j => { if(!live) return; j.error ? setErr(j.error) : setData(j); })
      .catch(e => { if(live) setErr(e.message); });
    return () => { live = false; };
  }, [routeId]);

  const cell = "px-2 py-1 text-right tabular-nums whitespace-nowrap";
  const head = "px-2 py-1 text-right font-semibold whitespace-nowrap";

  return (
    <tr className="bg-slate-50/70">
      <td colSpan={colSpan} className="px-4 py-3">
        <RouteGates routeId={routeId} originId={originId} destId={destId} token={token}
          blockers={gateBlockers} onChanged={onHaulChanged} />
        <HaulRoads routeId={routeId} haulRoads={haulRoads} token={token} onChanged={onHaulChanged} />
        <RouteRestrictions routeId={routeId} />
        {err && <p className="text-xs" style={{ color: "var(--red)" }}>Couldn't load analysis: {err}</p>}
        {!data && !err && <p className="text-xs text-slate-400">Loading analysis…</p>}
        {data && !data.rows.length && (
          <p className="text-xs text-slate-500">
            Nothing to analyse yet — this route has no cached geometry. Use the
            <span className="font-semibold"> Bake</span> action on this row to route it.
          </p>
        )}
        {data && !!data.rows.length && (
          <div className="overflow-x-auto">
            <table className="text-xs w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="px-2 py-1 text-left font-semibold">Vehicle</th>
                  <th className="px-2 py-1 text-left font-semibold">Option</th>
                  <th className={head}>Out km</th>
                  <th className={head}>Back km</th>
                  <th className={head}>Turn</th>
                  <th className={head}>Cycle</th>
                  <th className={head}>Trips/day</th>
                  <th className={head}>t/day</th>
                  <th className={head}>t/month</th>
                  <th className={head}>CO₂ kg/trip</th>
                  <th className="px-2 py-1"></th>
                </tr>
              </thead>
              <tbody>
                {data.rows.map((r, i) => {
                  const isActive = active && active.profile === r.profile
                    && active.alt_index === r.alt_index && active.leg === leg;
                  return (
                  <tr key={`${r.profile}-${r.alt_index}`}
                    onClick={() => onFocus && onFocus(r.profile, r.alt_index)}
                    title="Show this option on the map"
                    className={"border-t border-slate-200/70 cursor-pointer "
                      + (isActive ? "bg-white ring-1 ring-inset ring-[color:var(--red)]/40 "
                                  : "hover:bg-white ")
                      + (r.alt_index === 0 ? "" : "text-slate-500")}>
                    <td className="px-2 py-1 whitespace-nowrap">
                      {r.alt_index === 0 ? vehShort(r.profile) : ""}
                    </td>
                    <td className="px-2 py-1 whitespace-nowrap">
                      {isActive && <span style={{ color: "var(--red)" }} title="Shown on the map">● </span>}
                      {r.alt_index === 0
                        ? <span className="font-semibold" style={{ color: "var(--navy)" }}>Primary</span>
                        : `Alt ${r.alt_index}`}
                    </td>
                    <td className={cell}>{r.loaded_km}</td>
                    <td className={cell} title={r.return_estimated ? "Return leg not baked — assumed same as outbound" : undefined}>
                      {r.return_km}{r.return_estimated ? "*" : ""}
                    </td>
                    <td className={cell} title={(() => {
                      // B4: the total is the backend's, and the tooltip explains it from
                      // the backend's own parts. Nothing here re-adds them — the dashboard
                      // computing its own version of this number is how it once disagreed
                      // with the backend by 125% on an Artic Flatbed.
                      const tp = r.turnaround_parts || {};
                      const bits = [`${r.load_minutes} min load + ${r.unload_minutes} min unload`];
                      if(tp.safety_minutes) bits.push(`${tp.safety_minutes} min induction at the gates`);
                      if(tp.internal_travel_minutes) bits.push(`${tp.internal_travel_minutes} min gate to face`);
                      if(tp.internal_travel_source === "drawn_road")
                        bits.push(`internal travel comes from the drawn haul road, not a flat allowance` +
                                  (tp.internal_travel_flat_available
                                    ? ` (the ${tp.internal_travel_flat_available} min flat figure is deliberately not added on top)` : ""));
                      return bits.join(" · ");
                    })()}>
                      {Math.round((r.turnaround_hr || 0) * 60)}m
                      {(r.turnaround_parts && (r.turnaround_parts.safety_minutes
                        || r.turnaround_parts.internal_travel_minutes)) ? "‡" : ""}
                    </td>
                    <td className={cell}
                      title={r.haul_speed_applied
                        ? `Includes an assigned haul speed over ${r.haul_km} km (${(r.haul_zones || []).join(", ")}). On HERE's own timing this cycle would be ${r.cycle_hr_here} h.`
                        : undefined}>
                      {r.cycle_hr} h{r.haul_speed_applied ? <span style={{ color: ZONE_HAUL }}>†</span> : null}
                    </td>
                    <td className={cell}>{r.trips_per_day || <span className="text-slate-300">0</span>}</td>
                    <td className={cell}>{r.tonnes_per_day}</td>
                    <td className={cell}>{r.tonnes_per_month}</td>
                    <td className={cell}>{r.co2_kg_per_trip}</td>
                    <td className="px-2 py-1 text-right whitespace-nowrap">
                      {r.alt_index !== 0 && onPromote && (
                        <button
                          onClick={(e) => { e.stopPropagation(); onPromote(r.profile, r.alt_index); }}
                          disabled={promoting === `${r.profile}|${r.alt_index}`}
                          title="Use this option as the primary route for this vehicle"
                          className="text-[10px] font-semibold px-1.5 py-0.5 rounded border border-slate-300 hover:bg-white disabled:opacity-40">
                          {promoting === `${r.profile}|${r.alt_index}` ? "…" : "Make primary"}
                        </button>
                      )}
                    </td>
                  </tr>
                  );
                })}
              </tbody>
            </table>
            <p className="text-[11px] text-slate-400 mt-2">
              Cycle = out + back + turnaround. Turnaround is the vehicle's own load and unload
              time from factors.json, plus — where gates record them — induction at each gate
              and gate-to-face travel (‡). Trips/day assumes a {data.planning.shift_hours_per_day} h
              shift; t/month assumes {data.planning.working_days_per_month} working days.
              {data.rows.some(r => r.return_estimated) && " * return leg not baked — assumed to mirror the outbound."}
            </p>
            {data.rows.some(r => r.haul_speed_applied) && (
              <p className="text-[11px] mt-1" style={{ color: ZONE_HAUL }}>
                † part of this cycle runs on a temporary haul road at an <strong>assigned</strong> speed,
                not a speed HERE measured. HERE will not accept a custom speed, so the haul stretch is
                timed at <em>drawn length ÷ assigned speed</em> and substituted in. Hover the cycle for
                what the figure would be on HERE&rsquo;s own timing. It is a planning assumption, and it
                is only as good as the line somebody drew.
              </p>
            )}
            <p className="text-[11px] text-slate-400 mt-1">
              Click a row to draw that option on the map — it turns red, the vehicle's other
              options stay grey. “Make primary” swaps an alternative into first place so it
              becomes the route the network is planned around; re-baking restores HERE's ranking.
            </p>
          </div>
        )}
      </td>
    </tr>
  );
}

// Material categories a location supplies (out) or receives (in).
function CatChips({ list, dir }){
  const arr = asArray(list);
  if(!arr.length) return <span className="text-slate-300">—</span>;
  const bg = dir === "in" ? "rgba(3,158,134,.10)" : "rgba(0,55,135,.08)";
  const fg = dir === "in" ? "var(--green)" : "var(--navy)";
  return (
    <span className="flex flex-wrap gap-1">
      {arr.map(c => (
        <span key={c} className="text-[10px] px-1.5 py-0.5 rounded-full whitespace-nowrap"
          style={{ background: bg, color: fg }}>{c}</span>
      ))}
    </span>
  );
}

// Why the analysis table can look like it ignores the vehicle. Three different faults
// present identically — a profile whose name no longer matches factors.json, a deployed
// factors.json that isn't the one you think, and vehicles that genuinely share a figure.
// This shows the resolved numbers so they can be told apart, and can put a real question
// to HERE about one route.
function Diagnostics({ token, routeId }){
  const [fx, setFx] = useState(null);
  const [cmp, setCmp] = useState(null);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const qs = () => (token ? `?token=${encodeURIComponent(token)}` : "");

  const loadFactors = async () => {
    setBusy("factors"); setErr("");
    try {
      const r = await fetch(`${API}/admin/diagnostics/factors${qs()}`);
      if(!r.ok) throw new Error(`${r.status} — ${r.status === 403 ? "admin token rejected" : await r.text()}`);
      setFx(await r.json());
    } catch(e){ setErr(e.message); }
    setBusy("");
  };

  const probeHere = async () => {
    if(!routeId){ setErr("Pick a route on the Routes tab first."); return; }
    setBusy("probe"); setErr("");
    try {
      const p = new URLSearchParams({ probe: "true" });
      if(token) p.set("token", token);
      const r = await fetch(`${API}/admin/diagnostics/compare/${encodeURIComponent(routeId)}?${p}`);
      if(!r.ok) throw new Error(`${r.status} — ${r.status === 403 ? "admin token rejected" : await r.text()}`);
      setCmp(await r.json());
    } catch(e){ setErr(e.message); }
    setBusy("");
  };

  return (
    <div className="card p-4">
      <div className="text-sm font-semibold text-slate-700 mb-1">Diagnostics</div>
      <p className="text-[11px] text-slate-400 mb-2">
        Use these when vehicles look interchangeable — identical distances, cycle times or CO₂.
      </p>
      <div className="flex flex-wrap gap-2">
        <button onClick={loadFactors} disabled={!!busy}
          className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-40">
          {busy === "factors" ? "Checking…" : "Check factors.json"}
        </button>
        <button onClick={probeHere} disabled={!!busy || !routeId} title={routeId ? `Ask HERE about ${routeId}` : "Select a route first"}
          className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-40">
          {busy === "probe" ? "Asking HERE…" : `Probe HERE${routeId ? ` · ${routeId}` : ""}`}
        </button>
      </div>
      {err && <p className="text-xs mt-2" style={{ color: "var(--red)" }}>{err}</p>}

      {fx && (
        <div className="mt-3">
          {fx.warnings.map((w, i) => (
            <p key={i} className="text-[11px] rounded-md px-2 py-1.5 mb-1"
              style={{ background: "rgba(255,193,1,.14)", color: "#8a6d00" }}>⚠ {w}</p>
          ))}
          {!fx.warnings.length && (
            <p className="text-[11px] rounded-md px-2 py-1.5 mb-1"
              style={{ background: "rgba(3,158,134,.10)", color: "var(--green)" }}>
              Every profile resolves to a distinct entry in factors.json.
            </p>
          )}
          <div className="overflow-x-auto">
            <table className="text-[11px] w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="text-left font-semibold py-1">Vehicle</th>
                  <th className="text-right font-semibold px-1">Payload</th>
                  <th className="text-right font-semibold px-1">CO₂/km</th>
                  <th className="text-right font-semibold px-1">Laden</th>
                  <th className="text-right font-semibold px-1">Tare</th>
                  {/* the UNLOADING half only. A vehicle has no route, so it has no gates
                      and therefore no induction or gate-to-face time — this figure and a
                      route's turnaround are different quantities from Phase 5a onward,
                      and the header says so rather than inviting the comparison. */}
                  <th className="text-right font-semibold px-1" title="Load + unload for this vehicle. A route's turnaround also includes gate induction and gate-to-face travel.">Load/unload</th>
                </tr>
              </thead>
              <tbody>
                {fx.vehicles.map(v => (
                  <tr key={v.profile} className="border-t border-slate-100">
                    <td className="py-1 whitespace-nowrap">
                      {!v.in_factors && <span style={{ color: "var(--red)" }} title="Not a key in factors.json — falls back to _default">⚠ </span>}
                      {vehShort(v.profile)}
                      {v.in_database && <span className="text-slate-300" title="Present in cached geometry"> ●</span>}
                    </td>
                    <td className="text-right tabular-nums px-1">{v.payload_t}t</td>
                    <td className="text-right tabular-nums px-1">{v.emissions_kg_co2e_per_km}</td>
                    <td className="text-right tabular-nums px-1">{v.gross_weight_kg ? (v.gross_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{v.tare_weight_kg ? (v.tare_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{Math.round((v.unloading_hr||0)*60)}m</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
