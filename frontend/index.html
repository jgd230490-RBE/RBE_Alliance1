<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RBE Alliance 1 Logistics</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003787; --navy-deep:#0A1446; --blue:#3398DB;
    --red:#BF2E55; --green:#039E86; --gold:#FFC101; --grey:#E5E5E5;
    --ink:#1f2937; --muted:#6b7280; --line:#e8eaed; --bg:#fbfbfc;
  }
  html,body,#root{height:100%;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .brand-bar{background:var(--navy-deep);}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;}
  .kpi-num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  ::-webkit-scrollbar{height:9px;width:9px;} ::-webkit-scrollbar-thumb{background:#d5d8dd;border-radius:6px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const API = "/api";
const MAP_URL = "/map/?v=" + Date.now();  // per-load cache-buster so the iframe never serves a stale map
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// ---- 2026-09-02, Task F: access codes are resolved by the SERVER --------------
// The client-side LOGINS dict with plaintext codes in view-source is gone. The code is
// POSTed to /api/auth, which says what it grants (role, IPT scope, can_approve), and is
// then sent on EVERY /api request as the X-Access-Code header — the server filters on
// it. The code lives in sessionStorage for the tab only.
//
// ⚠️ Still not authentication in the Phase 6 sense: a shared code per role, no rate
// limit, no per-person identity beyond the name you type. Do not call this secure.
const ACCESS = { code: "", info: null };
try { ACCESS.code = sessionStorage.getItem("rbe_access_code") || ""; } catch(e){}
// one place adds the header, so no fetch() call site can forget it
const _rawFetch = window.fetch.bind(window);
window.fetch = (url, opts) => {
  const u = typeof url === "string" ? url : (url && url.url) || "";
  if(u.startsWith(API) && ACCESS.code){
    const o = { ...(opts || {}) };
    o.headers = { ...(o.headers || {}), "X-Access-Code": ACCESS.code };
    return _rawFetch(url, o);
  }
  return _rawFetch(url, opts);
};

// ---- client-side conversion preview (mirrors backend factors.json) ----
const density = (f, m) => (f.material_density_t_per_m3[m] ?? f.material_density_t_per_m3._default);
const payload = (f, v) => (f.vehicle_payload_t[v] ?? f.vehicle_payload_t._default);
function toTonnes(q, unit, m, v, f){ q = +q || 0; if(unit==="t") return q; if(unit==="m3") return q*density(f,m); return q*payload(f,v); }
function fromTonnes(t, unit, m, v, f){ if(unit==="t") return t; if(unit==="m3") return t/density(f,m); return t/payload(f,v); }
const fmt = (n, unit) => unit==="vehicles" ? Math.round(n).toLocaleString() : (Math.round(n*10)/10).toLocaleString();

// ---- dashboard helpers ----
const emisFactor = (f,v) => (f.vehicle_emissions_kg_co2e_per_km?.[v] ?? f.vehicle_emissions_kg_co2e_per_km?._default ?? 0.9);
const planningOf = (f) => (f.planning || {avg_haul_speed_kmh:45, load_minutes:12, unload_minutes:8, working_days_per_month:22, shift_hours_per_day:10});
const monthLabelAbs = (idx, startYear) => MONTHS[(idx-1)%12] + " " + String(startYear + Math.floor((idx-1)/12)).slice(2);
const PALETTE = ["#003787","#039E86","#BF2E55","#C6841D","#6D28D9","#0E7490","#3398DB","#9AA7B4","#DB6D33","#1B7F5E"];
const colorOf = (i) => PALETTE[i % PALETTE.length];

// Chart.js wrapper — recreates the chart when its serialised config changes.
function ChartCanvas({ config, height=260 }){
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if(!ref.current || !window.Chart) return;
    if(inst.current) inst.current.destroy();
    inst.current = new window.Chart(ref.current, config);
    return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
  }, [JSON.stringify(config)]);
  return <div style={{height}}><canvas ref={ref}></canvas></div>;
}

function Kpi({ label, value, sub, small }){
  return (
    <div className="card p-3.5">
      <div className={"kpi-num font-bold text-[color:var(--navy-deep)] " + (small ? "text-base" : "text-2xl")}>{value}</div>
      <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400 mt-0.5">{label}</div>
      {sub && <div className="text-[11px] text-slate-400">{sub}</div>}
    </div>
  );
}

// ================================================================= Dashboard
function Dashboard({ meta }){
  const { routes, materials, vehicles, units, months, factors } = meta;
  const routesById = useMemo(() => Object.fromEntries(routes.map(r => [r.route_id, r])), [routes]);

  const [rows, setRows] = useState(null);
  const [analysis, setAnalysis] = useState(null);   // /api/routes/analysis-batch
  const [err, setErr] = useState(false);
  const [status, setStatus] = useState("Approved");
  const [unit, setUnit] = useState("t");
  const [material, setMaterial] = useState("All");
  const [vehicle, setVehicle] = useState("All");
  const [fromM, setFromM] = useState(1);
  const [toM, setToM] = useState(months.count);
  const [sortKey, setSortKey] = useState("t");
  const [sortDir, setSortDir] = useState("desc");

  useEffect(() => {
    let live = true;
    fetch(`${API}/forecasts`).then(r => r.json()).then(rs => {
      if(!live) return;
      setRows(rs);
      const idx = rs.map(x => x.month_index);
      if(idx.length){ setFromM(Math.min(...idx)); setToM(Math.max(...idx)); }
    }).catch(() => setErr(true));
    return () => { live = false; };
  }, []);

  // Haul-cycle figures come from the BACKEND now.
  //
  // This screen used to work its own out — round trip over a flat 45 km/h plus one
  // global 12+8 minute turnaround for every vehicle — while the route analysis panel
  // used HERE's real routed durations and each vehicle's own turnaround. The same route
  // therefore had two different cycle times depending on which screen you opened. On a
  // 70 km/h trunk road the local formula overstated the cycle by about a third, and it
  // understated an Artic Flatbed's 45-minute turnaround by more than half.
  //
  // One request covers every route, so this costs one fetch rather than one per row.
  useEffect(() => {
    let live = true;
    fetch(`${API}/routes/analysis-batch`).then(r => r.json()).then(j => {
      if(live) setAnalysis(j);
    }).catch(() => { if(live) setAnalysis({ analysis: {}, not_baked: [], error: true }); });
    return () => { live = false; };
  }, []);

  const unitLabel = unit === "t" ? "tonnes" : unit === "m3" ? "m³" : "vehicles";

  const D = useMemo(() => {
    if(!rows) return null;
    const lo = Math.min(fromM,toM), hi = Math.max(fromM,toM);
    const P = planningOf(factors);
    const filtered = rows.filter(r =>
      (status==="All" || r.status===status) &&
      (material==="All" || r.material_type===material) &&
      (vehicle==="All" || r.vehicle_type===vehicle) &&
      r.month_index>=lo && r.month_index<=hi
    );
    const n = hi - lo + 1;
    const labels = []; for(let i=lo;i<=hi;i++) labels.push(monthLabelAbs(i, months.start_year));
    const mats = [...new Set(filtered.map(r => r.material_type))];
    const demand = {}; mats.forEach(m => demand[m] = new Array(n).fill(0));
    const tripsM = new Array(n).fill(0);
    const co2M = new Array(n).fill(0);
    const tonnesM = new Array(n).fill(0);
    const split = {}; mats.forEach(m => split[m] = 0);
    const rAgg = {};
    const AN = (analysis && analysis.analysis) || {};
    let totT=0, totTrips=0, totKm=0, totCo2=0;
    filtered.forEach(r => {
      const route = routesById[r.route_id] || {};
      // the backend's routed distance for the vehicle on this line, falling back to the
      // route's headline distance when that vehicle has not been baked
      const an = (AN[r.route_id] || {})[r.vehicle_type];
      const dist = an ? an.loaded_km : (route.distance_km ?? null);
      const round = an ? (an.total_km || 0) : ((dist || 0) * 2);
      const t = toTonnes(r.quantity, r.unit, r.material_type, r.vehicle_type, factors);
      const trips = t / payload(factors, r.vehicle_type);
      const km = trips * round;
      const co2 = km * emisFactor(factors, r.vehicle_type);     // kg
      const disp = fromTonnes(t, unit, r.material_type, r.vehicle_type, factors);
      const k = r.month_index - lo;
      demand[r.material_type][k] += disp;
      tripsM[k] += trips; co2M[k] += co2/1000; tonnesM[k] += t;
      split[r.material_type] += disp;
      totT += t; totTrips += trips; totKm += km; totCo2 += co2/1000;
      // keyed per LINE — a route carrying two disciplines is two rows, not one row with
      // both disciplines' traffic silently added together
      const key = `${r.route_id}|${r.discipline||""}|${r.section_id||""}`;
      const a = rAgg[key] || (rAgg[key] = {
        key, route_id:r.route_id, discipline:r.discipline||"", section_id:r.section_id||"",
        ipt:route.ipt||"—", dist, vehicle:r.vehicle_type,
        cycleH:(an ? an.cycle_hr : null), capacityPerDay:(an ? an.trips_per_day : null),
        baked:!!an, t:0, trips:0, km:0, co2:0, monthly:{},
      });
      a.t += t; a.trips += trips; a.km += km; a.co2 += co2/1000;
      a.monthly[r.month_index] = (a.monthly[r.month_index]||0) + trips;
    });
    const routeRows = Object.values(rAgg).map(a => {
      const mv = Object.values(a.monthly);
      const peakMonthTrips = mv.length ? Math.max(...mv) : 0;
      // DEMAND per day — how many loads the tonnage needs. Distinct from the backend's
      // capacityPerDay, which is how many one truck can physically do in a shift.
      // Trucks needed = demand / capacity; showing only one of the two, as this screen
      // used to, cannot answer a fleet-size question.
      const peakPerDay = P.working_days_per_month>0 ? peakMonthTrips/P.working_days_per_month : 0;
      const trucks = (a.capacityPerDay > 0) ? Math.ceil(peakPerDay / a.capacityPerDay) : null;
      const intensity = a.t>0 ? (a.co2*1000/a.t) : 0;
      return { ...a, peakPerDay, trucks, intensity };
    });
    let peakIdx = 0; for(let i=1;i<n;i++) if(tonnesM[i]>tonnesM[peakIdx]) peakIdx = i;
    const peakMonth = tonnesM.some(x=>x>0) ? labels[peakIdx] : "—";
    return {
      lo, hi, labels, mats, demand, tripsM, co2M, split, routeRows,
      kpis: { totT, totTrips, totKm, totCo2, intensity: totT>0 ? totCo2*1000/totT : 0, peakMonth },
      empty: filtered.length===0,
      unbaked: routeRows.filter(r => !r.baked).length,
    };
  }, [rows, analysis, status, material, vehicle, fromM, toM, unit, factors, months, routesById]);

  if(err) return <div className="p-8 text-center text-slate-500">Couldn't load forecast data.</div>;
  if(!rows || !D) return <div className="p-8 text-center text-slate-400">Loading dashboard…</div>;
  if(!analysis) return <div className="p-8 text-center text-slate-400">Loading haul-cycle figures…</div>;

  const sortedRoutes = [...D.routeRows].sort((a,b) => {
    const dir = sortDir==="asc" ? 1 : -1;
    return (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * dir;
  });
  const setSort = (k) => { if(sortKey===k) setSortDir(d => d==="asc"?"desc":"asc"); else { setSortKey(k); setSortDir("desc"); } };
  const arrow = (k) => sortKey===k ? (sortDir==="asc" ? " ▲" : " ▼") : "";

  const commonOpts = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } };
  const barScales = { scales:{ x:{ grid:{ display:false } }, y:{ ticks:{ font:{ size:11 } } } } };
  const stackedOpts = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, font:{ size:11 } } } }, scales:{ x:{ stacked:true, grid:{ display:false } }, y:{ stacked:true, ticks:{ font:{ size:11 } } } } };

  const demandCfg = { type:"bar", data:{ labels:D.labels, datasets:D.mats.map((m,i)=>({ label:m, data:D.demand[m], backgroundColor:colorOf(i), stack:"s", borderWidth:0 })) }, options:stackedOpts };
  const tripsCfg  = { type:"bar", data:{ labels:D.labels, datasets:[{ label:"Trips", data:D.tripsM, backgroundColor:"#003787", borderWidth:0 }] }, options:{ ...commonOpts, ...barScales } };
  const co2Cfg    = { type:"line", data:{ labels:D.labels, datasets:[{ label:"tCO₂e", data:D.co2M, borderColor:"#039E86", backgroundColor:"rgba(3,158,134,.12)", fill:true, tension:.3, pointRadius:2 }] }, options:{ ...commonOpts, ...barScales } };
  const splitCfg  = { type:"doughnut", data:{ labels:D.mats, datasets:[{ data:D.mats.map(m=>D.split[m]), backgroundColor:D.mats.map((m,i)=>colorOf(i)), borderWidth:2, borderColor:"#fff" }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:"62%", plugins:{ legend:{ position:"right", labels:{ boxWidth:10, font:{ size:11 } } } } } };
  const topN = [...D.routeRows].sort((a,b)=>b.t-a.t).slice(0,10);
  const topCfg = { type:"bar", data:{ labels:topN.map(r=>r.route_id), datasets:[{ label:"tonnes", data:topN.map(r=>r.t), backgroundColor:"#3398DB", borderWidth:0 }] }, options:{ indexAxis:"y", ...commonOpts, scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } }, y:{ ticks:{ font:{ size:9 } } } } } };

  const sel = "border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm bg-white";
  const numTd = "px-3 py-2 text-right tabular-nums";

  return (
    <div className="max-w-7xl mx-auto p-5 space-y-5">
      <PageHeader title="Dashboard"
        subtitle={`Strategic planning view · ${D.lo===D.hi ? D.labels[0] : (monthLabelAbs(D.lo,months.start_year)+" – "+monthLabelAbs(D.hi,months.start_year))} · ${status==="All" ? "all forecasts" : status.toLowerCase()+" only"}`}
        actions={<div className="flex flex-wrap gap-2">
          <select className={sel} value={status} onChange={e=>setStatus(e.target.value)}>{["Approved","Pending","All"].map(s=><option key={s}>{s}</option>)}</select>
          <select className={sel} value={unit} onChange={e=>setUnit(e.target.value)}>{units.map(u=><option key={u} value={u}>{u==="t"?"tonnes":u==="m3"?"m³":"vehicles"}</option>)}</select>
          <select className={sel} value={material} onChange={e=>setMaterial(e.target.value)}><option>All</option>{materials.map(m=><option key={m}>{m}</option>)}</select>
          <select className={sel} value={vehicle} onChange={e=>setVehicle(e.target.value)}><option>All</option>{vehicles.map(v=><option key={v} value={v}>{vehLabel(v)}</option>)}</select>
          <select className={sel} value={fromM} onChange={e=>setFromM(+e.target.value)}>{Array.from({length:months.count},(_,i)=>i+1).map(i=><option key={i} value={i}>{monthLabelAbs(i,months.start_year)}</option>)}</select>
          <span className="self-center text-slate-400 text-sm">→</span>
          <select className={sel} value={toM} onChange={e=>setToM(+e.target.value)}>{Array.from({length:months.count},(_,i)=>i+1).map(i=><option key={i} value={i}>{monthLabelAbs(i,months.start_year)}</option>)}</select>
        </div>} />

      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
        <Kpi label="Total material" value={Math.round(D.kpis.totT).toLocaleString()} sub="tonnes" />
        <Kpi label="Total trips" value={Math.round(D.kpis.totTrips).toLocaleString()} sub="loaded runs" />
        <Kpi label="Truck-km" value={Math.round(D.kpis.totKm).toLocaleString()} sub="round trips" />
        <Kpi label="CO₂e" value={D.kpis.totCo2.toFixed(1)} sub="tonnes" />
        <Kpi label="Intensity" value={D.kpis.intensity.toFixed(1)} sub="kg / tonne" />
        <Kpi label="Peak month" value={D.kpis.peakMonth} sub="by tonnage" small />
      </div>

      {D.empty && <div className="card p-6 text-center text-slate-500 text-sm">No forecasts match these filters.</div>}

      <div className="grid lg:grid-cols-3 gap-4">
        <div className="card p-4 lg:col-span-3">
          <div className="text-sm font-semibold text-slate-700 mb-1">Material demand over time <span className="text-slate-400 font-normal">({unitLabel})</span></div>
          <ChartCanvas config={demandCfg} height={260} />
        </div>
        <div className="card p-4">
          <div className="text-sm font-semibold text-slate-700 mb-1">Vehicle trips over time</div>
          <ChartCanvas config={tripsCfg} height={240} />
        </div>
        <div className="card p-4">
          <div className="text-sm font-semibold text-slate-700 mb-1">Carbon over time <span className="text-slate-400 font-normal">(tCO₂e)</span></div>
          <ChartCanvas config={co2Cfg} height={240} />
        </div>
        <div className="card p-4">
          <div className="text-sm font-semibold text-slate-700 mb-1">Material split <span className="text-slate-400 font-normal">({unitLabel})</span></div>
          <ChartCanvas config={splitCfg} height={240} />
        </div>
        <div className="card p-4 lg:col-span-3">
          <div className="text-sm font-semibold text-slate-700 mb-1">Top routes by tonnage</div>
          <ChartCanvas config={topCfg} height={300} />
        </div>
      </div>

      <div className="card overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 text-sm font-semibold text-slate-700">Route planning detail <span className="text-slate-400 font-normal">· click a column to sort</span></div>
        <div className="overflow-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="px-3 py-2 text-left font-semibold cursor-pointer select-none" onClick={()=>setSort("route_id")}>Route{arrow("route_id")}</th>
                <th className="px-3 py-2 text-left font-semibold cursor-pointer select-none" onClick={()=>setSort("discipline")}>Discipline{arrow("discipline")}</th>
                <th className="px-3 py-2 text-left font-semibold">IPT</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("dist")}>Dist km{arrow("dist")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("cycleH")}>Cycle h{arrow("cycleH")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("t")}>Tonnes{arrow("t")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("trips")}>Trips{arrow("trips")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("km")}>Truck-km{arrow("km")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("co2")}>tCO₂e{arrow("co2")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("intensity")}>kg/t{arrow("intensity")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("peakPerDay")}>Peak/day{arrow("peakPerDay")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("trucks")} title="Peak demand per day divided by what one truck can physically do in a shift">Trucks{arrow("trucks")}</th>
              </tr>
            </thead>
            <tbody>
              {sortedRoutes.map(r => (
                <tr key={r.key} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">{r.route_id}</td>
                  <td className="px-3 py-2 text-slate-500 whitespace-nowrap">
                    {r.discipline
                      ? <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
                          style={{ background:"rgba(0,55,135,.08)", color:"var(--navy)" }}
                          title={r.section_id ? `Section ${r.section_id}` : "No section set"}>
                          {r.discipline}
                        </span>
                      : <span className="text-slate-300" title="No discipline set on this forecast line">—</span>}
                  </td>
                  <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{r.ipt}</td>
                  {/* an unbaked route has NO distance, which is not the same as zero — a
                      zero would sum silently into every total above */}
                  <td className={numTd}>{r.dist == null ? <span className="text-slate-300" title="No cached geometry — bake this route">—</span> : r.dist.toFixed(1)}</td>
                  <td className={numTd}>
                    {r.cycleH == null
                      ? <span className="text-slate-300" title="Cycle time needs baked geometry for this vehicle">not baked</span>
                      : r.cycleH.toFixed(2)}
                  </td>
                  <td className={numTd}>{Math.round(r.t).toLocaleString()}</td>
                  <td className={numTd}>{Math.round(r.trips).toLocaleString()}</td>
                  <td className={numTd}>{Math.round(r.km).toLocaleString()}</td>
                  <td className={numTd}>{r.co2.toFixed(1)}</td>
                  <td className={numTd}>{r.intensity.toFixed(1)}</td>
                  <td className={numTd}>{r.peakPerDay.toFixed(1)}</td>
                  <td className={numTd} title={r.capacityPerDay ? `${r.capacityPerDay} trips/day per truck` : undefined}>
                    {r.trucks == null ? <span className="text-slate-300">—</span> : r.trucks}
                  </td>
                </tr>
              ))}
              {sortedRoutes.length===0 && <tr><td colSpan="12" className="px-3 py-6 text-center text-slate-400">No routes in range.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      {D.unbaked > 0 && (
        <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">
          {D.unbaked} forecast line(s) reference a route with no cached geometry for their
          vehicle, so cycle time, fleet size and truck-km are blank rather than estimated.
          Bake those routes on the Routes page.
        </div>
      )}

      <p className="text-xs text-slate-400 px-1">Planning estimates only — no live deliveries or tracking. Distances and durations come from the routed HERE geometry via <code>/api/routes/analysis-batch</code>, the same source as the route analysis panel — this screen no longer estimates its own. Carbon from DEFRA-2025-based factors in backend/factors.json (round trip: loaded out, empty return). Cycle = laden out + empty back + that vehicle's own load and unload time. Trucks = peak demand per day ÷ what one truck can do in a shift.</p>
    </div>
  );
}

// ================================================================= App
function App(){
  const [view, setView] = useState("public");   // public | login | portal
  const [role, setRole] = useState(null);
  const [who, setWho] = useState(() => { try { return localStorage.getItem("rbe_who") || ""; } catch(e){ return ""; } });
  const [meta, setMeta] = useState(null);
  const [metaErr, setMetaErr] = useState(false);
  // the label language. Held in App so the header control and every table re-render
  // together; mirrored into the module-level VEH so plain helpers can read it.
  const [vehLang, setVehLangState] = useState(VEH.lang);
  const setVehLang = (l) => { VEH.lang = l; try { localStorage.setItem("rbe_veh_lang", l); } catch(e){} setVehLangState(l); };

  useEffect(() => {
    fetch(`${API}/meta`).then(r => r.json()).then(m => {
      const vl = m && m.vehicle_labels;
      if(vl){ VEH.labels = vl.labels || {}; VEH.fallbacks = vl.fallbacks || {}; }
      setMeta(m);
    }).catch(() => setMetaErr(true));
  }, []);

  // `role` is now the /api/auth payload: {role, label, ipt, can_approve, ipt_locked,
  // ipt_required, demo, ipts}. Every permission the UI shows comes from it, not from a
  // client-side table.
  const signIn = (info, name, code) => {
    const n = (name || "").trim();
    ACCESS.code = code; ACCESS.info = info;
    try { sessionStorage.setItem("rbe_access_code", code); } catch(e){}
    setRole(info); setWho(n);
    try { localStorage.setItem("rbe_who", n); } catch(e){}
    setView("portal");
  };
  const signOut = () => {
    ACCESS.code = ""; ACCESS.info = null;
    try { sessionStorage.removeItem("rbe_access_code"); } catch(e){}
    setRole(null); setView("public");
  };

  return (
    <div className="h-full flex flex-col">
      <Header view={view} role={role} setView={setView} signOut={signOut} vehLang={vehLang} setVehLang={setVehLang} />
      <main className="flex-1 min-h-0 flex flex-col">
        {view === "public" && <PublicMap onLogin={() => setView("login")} />}
        {view === "login" && <Login onSignIn={signIn} onBack={() => setView("public")} savedName={who} />}
        {view === "portal" && (
          <Portal role={role} who={who} meta={meta} metaErr={metaErr} vehLang={vehLang} />
        )}
      </main>
    </div>
  );
}

// ================================================================= Login
function Login({ onSignIn, onBack, savedName }){
  const [pw, setPw] = useState("");
  const [name, setName] = useState(savedName || "");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const submit = () => {
    if(!name.trim()){ setErr("Please enter your name."); return; }
    const code = pw.trim();
    if(!code){ setErr("Enter your access code."); return; }
    setBusy(true); setErr("");
    fetch(`${API}/auth`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code }) })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(info => onSignIn(info, name, code))
      .catch(e => setErr(e === 401 ? "That access code isn't recognised." : `Couldn't sign in (${e}).`))
      .finally(() => setBusy(false));
  };
  return (
    <div className="flex-1 grid place-items-center px-5">
      <div className="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-7">
        <h1 className="text-xl font-bold text-[color:var(--navy-deep)]">Staff sign in</h1>
        <p className="text-sm text-slate-500 mt-1 mb-5">Enter your name and access code to submit or approve forecasts.</p>
        <input
          type="text" value={name} autoFocus
          onChange={e => setName(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Your name"
          className="w-full border border-slate-300 rounded-lg px-3 py-2.5 mb-2.5 outline-none focus:ring-2 focus:ring-[color:var(--blue)]"
        />
        <input
          type="password" value={pw}
          onChange={e => setPw(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Access code"
          className="w-full border border-slate-300 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-[color:var(--blue)]"
        />
        {err && <p className="text-sm mt-2" style={{color:"var(--red)"}}>{err}</p>}
        <button onClick={submit} disabled={busy}
          className="w-full mt-4 py-2.5 rounded-lg text-white font-semibold transition disabled:opacity-50"
          style={{background:"var(--navy)"}}>
          {busy ? "Checking…" : "Sign in"}
        </button>
        <button onClick={onBack} className="w-full mt-2 py-2 text-sm text-slate-500 hover:text-slate-700">
          Back to public map
        </button>
        <p className="text-[11px] text-slate-400 mt-5 leading-relaxed">
          Your IPT's code shows only your IPT's forecast lines. The planner code sees every IPT and can
          approve. Codes are checked by the server; with none configured, the three demo codes
          (<code>submitter123</code> / <code>planner123</code> / <code>admin123</code>) still work.
        </p>
      </div>
    </div>
  );
}

  // {routeId, year, toYear, discipline, sectionId} handed to the Matrix. `year` is the
