  const receivesOf = (id) => asArray(locById[id] && locById[id].receives);
  const matsFor = (oId, dId) => {
    const s = suppliesOf(oId), r = receivesOf(dId);
    return s.filter(x => r.includes(x));
  };
  const destValid = (dId) => rOrigin && dId !== rOrigin && matsFor(rOrigin, dId).length > 0;
  const validMats = useMemo(() => (rOrigin && rDest) ? matsFor(rOrigin, rDest) : [], [rOrigin, rDest, locs]);

  const nextRouteId = (rows) => {
    let max = 0;
    (rows || []).forEach(r => { const m = /^R(\d+)$/.exec(r.id || ""); if(m) max = Math.max(max, +m[1]); });
    return "R" + String(max + 1).padStart(3, "0");
  };
  // keep the (editable) id field prefilled with the next free R00n until the user edits it
  useEffect(() => { if(!rIdTouched) setRId(nextRouteId(status)); }, [status, rIdTouched]);
  // if the origin changes and the chosen destination no longer shares a material, drop it
  useEffect(() => { if(rDest && !destValid(rDest)) setRDest(""); }, [rOrigin]);

  const toggleRVehicle = (v) =>
    setRVehicles(vs => vs.includes(v) ? vs.filter(x => x !== v) : [...vs, v]);
  const toggleEVehicle = (v) =>
    setEVehicles(vs => vs.includes(v) ? vs.filter(x => x !== v) : [...vs, v]);
  // What the route being edited is baked for RIGHT NOW, so each tick-box can say whether
  // leaving it as it is costs nothing, spends HERE calls, or deletes geometry. Read from
  // `status` rather than remembered at startEditRoute, so a bake finishing underneath the
  // open form does not leave the labels describing a state that has gone.
  const editHad = React.useMemo(() => {
    if(!editingRoute) return [];
    const r = (status || []).find(x => x.id === editingRoute);
    return Object.keys((r && r.profiles) || {});
  }, [editingRoute, status]);

  // how many routes touch each location — for the Locations table's "Routes" column
  const routeCounts = useMemo(() => {
    const c = {};
    (status || []).forEach(r => {
      if(r.origin_id) c[r.origin_id] = (c[r.origin_id] || 0) + 1;
      if(r.dest_id) c[r.dest_id] = (c[r.dest_id] || 0) + 1;
    });
    return c;
  }, [status]);

  const createRoute = async () => {
    if(!rOrigin || !rDest){ setRouteMsg("Pick an origin and a destination."); return; }
    if(!destValid(rDest)){ setRouteMsg("That origin and destination share no material."); return; }
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setRouteBusy(true); setRouteMsg("Creating route…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/routes${qs}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin_id: rOrigin, dest_id: rDest,
          route_id: (rId || "").trim() || null, ipt: (rIpt || "").trim() || null }),
      });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      const newId = j.id;
      // bake the new route for the vehicles picked on this panel
      const failed = [];
      if(rVehicles.length){
        for(let i = 0; i < rVehicles.length; i++){
          const prof = rVehicles[i];
          setRouteMsg(`Created ${newId} — baking ${prof} (${i + 1}/${rVehicles.length})…`);
          const bqs = new URLSearchParams({ route_id: newId, profile: prof });
          if(tokenRef.current) bqs.set("token", tokenRef.current);
          try {
            const br = await fetch(`${API}/admin/bake-route?${bqs.toString()}`, { method: "POST" });
            const bj = await br.json();
            if(bj.error) failed.push(`${vehShort(prof)}: ${bj.error}`);
          } catch(e){ failed.push(`${vehShort(prof)}: ${e.message}`); }
        }
      }
      await reloadNetwork();
      setSubTab("routes");
      setRouteMsg(
        failed.length ? `Route ${newId} created — ${rVehicles.length - failed.length}/${rVehicles.length} baked. ${failed.join(" · ")}`
        : rVehicles.length ? `Route ${newId} created and baked for ${rVehicles.length} vehicle(s).`
        : `Route ${newId} created — no vehicles ticked, so it has no geometry yet.`
      );
      setRDest(""); setRIpt(""); setRIdTouched(false);   // next id repopulates
    } catch(e){ setRouteMsg("Couldn't create route: " + e.message); }
    setRouteBusy(false);
  };

  // 2.5b — edit a route in place. Delete-and-recreate threw away its forecasts, its
  // weeks and its gate selections and minted a new id; this keeps all of them. Moving an
  // endpoint clears the baked geometry (re-baked here for the profiles it had) and that
  // end's gate. The impact is shown BEFORE the write, because the route id survives and
  // every forecast line on it silently starts meaning a different haul.
  const startEditRoute = (r) => {
    setEditingRoute(r.id);
    setROrigin(r.origin_id || ""); setRDest(r.dest_id || "");
    setRId(r.id); setRIdTouched(true); setRIpt(r.ipt || ""); setRMaterial(r.material_category || "");
    // A route has no vehicle FIELD: its vehicles are whichever profiles have a
    // route_geometry row, which is what r.profiles is. So the tick-boxes open showing
    // what is actually cached -- including a profile whose bake errored, because that
    // row exists and dropping it is a legitimate thing to want to do here.
    setEVehicles(Object.keys(r.profiles || {}).sort());
    setSubTab("routes"); setRouteMsg("");
  };
  const cancelEditRoute = () => {
    setEditingRoute(null); setRDest(""); setRIpt(""); setRMaterial(""); setRIdTouched(false);
    setEVehicles([]); setRouteMsg("");
  };
  const saveRouteEdit = async () => {
    if(!editingRoute) return;
    if(!rOrigin || !rDest){ setRouteMsg("Pick an origin and a destination."); return; }
    if(!destValid(rDest)){ setRouteMsg("That origin and destination share no material."); return; }
    const cur = (status || []).find(r => r.id === editingRoute) || {};
    const moved = cur.origin_id !== rOrigin || cur.dest_id !== rDest;
    // The vehicle diff. `had` is what has a route_geometry row today; `eVehicles` is what
    // the tick-boxes now say. Neither is a field on the route, so this is the whole of
    // "change the vehicles on a route" -- there is nothing else to write.
    const had = Object.keys(cur.profiles || {}).sort();
    const add = eVehicles.filter(v => !had.includes(v));
    const drop = had.filter(v => !eVehicles.includes(v));
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setRouteBusy(true);
    try {
      // Say what the edit touches before touching it. Asked for whenever something is
      // DESTROYED -- an endpoint move (which clears every profile) or a dropped profile.
      // Adding a profile only spends HERE calls, so it is reported afterwards, not gated.
      if(moved || drop.length){
        const ir = await fetch(`${API}/admin/routes/${encodeURIComponent(editingRoute)}/impact${qs}`);
        const imp = ir.ok ? await ir.json() : {};
        const fv = imp.forecast_vehicles || {};
        const bits = [];
        if(moved){
          if(imp.forecast_lines) bits.push(`${imp.forecast_lines} forecast line(s) (${imp.forecast_rows} month rows) stay on this id and will now describe the NEW haul`);
          if(imp.week_rows) bits.push(`${imp.week_rows} look-ahead week row(s) likewise`);
          if((imp.baked_profiles || []).length) bits.push(`baked geometry for ${imp.baked_profiles.map(vehShort).join(", ")} is cleared and re-baked (HERE calls)`);
          if((imp.haul_roads || []).length) bits.push(`${imp.haul_roads.length} haul road link(s) stay attached — check they still lie on the new route`);
          bits.push("the gate selection at the moved end is cleared");
        }
        // Dropping a profile is only free if nothing reads it. forecasts.vehicle_type is
        // the key the Forecasts page looks route analysis up by, so a line naming a
        // vehicle with no geometry left reads "not baked" where its km and cycle were.
        drop.forEach(v => {
          const use = fv[v];
          const who = use ? ` — ${use.lines} forecast line(s) on this route name it${use.approved ? `, ${use.approved} of them Approved` : ""}, and will read “not baked”` : "";
          bits.push(`${vehShort(v)}: both legs and every alternative are deleted${who}`);
        });
        if(drop.length && !eVehicles.length)
          bits.push("this route will have NO baked vehicle at all — its km, cycle time and vehicle count read “not baked” everywhere, including on the map");
        if(!confirm(`${moved ? `Move ${editingRoute}'s endpoints` : `Change ${editingRoute}'s vehicles`}?\n\n• ${bits.join("\n• ")}\n\nContinue?`)){ setRouteBusy(false); return; }
      }
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(editingRoute)}${qs}`, {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin_id: rOrigin, dest_id: rDest,
          material_category: rMaterial || null, ipt: (rIpt || "").trim() || null }) });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      await res.json();
      await reloadNetwork();

      // ⚠️ A move has ALREADY cleared every profile server-side, so there is nothing to
      // drop and the re-bake must use the NEW ticked set, not the old one. Restoring
      // `affected.profiles` here -- which is what this did before the vehicle diff
      // existed -- would silently bring back a profile the user had just unticked.
      const notes = [];
      const toBake = moved ? eVehicles : add;
      if(!moved && drop.length){
        for(const prof of drop){
          const p = new URLSearchParams({ route_id: editingRoute, profile: prof });
          if(tokenRef.current) p.set("token", tokenRef.current);
          const dr = await fetch(`${API}/admin/clear-geometry?${p}`, { method: "POST" });
          if(!dr.ok) notes.push(`${vehShort(prof)} not removed (${dr.status})`);
        }
        if(drop.length) notes.push(`removed ${drop.length} vehicle(s)`);
      }
      if(toBake.length){
        let n = 0;
        for(const prof of toBake){
          setRouteMsg(`${editingRoute} — routing ${vehShort(prof)} (${++n}/${toBake.length})…`);
          const failed = await bakeOneRoute(editingRoute, [prof]);
          if(failed.length) notes.push(failed.join(" · "));
        }
        notes.push(`${moved ? "re-baked" : "baked"} ${toBake.length} vehicle(s)`);
      } else if(moved){
        notes.push("no vehicles ticked — geometry left cleared");
      }
      await reloadNetwork();
      setRouteMsg(`Saved ${editingRoute}${notes.length ? " — " + notes.join("; ") : "."}`);
      setEditingRoute(null); setRDest(""); setRIpt(""); setRMaterial(""); setRIdTouched(false);
      setEVehicles([]);
    } catch(e){ setRouteMsg("Couldn't save: " + e.message); }
    setRouteBusy(false);
  };

  const deleteRoute = async (id) => {
    if(!confirm(`Delete route ${id}? (Its cached geometry goes too.)`)) return;
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(id)}${qs}`, { method: "DELETE" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,120)}`); }
      if(selected === id) setSelected(null);
      await reloadNetwork();
      setRouteMsg(`Deleted ${id}.`);
    } catch(e){ setRouteMsg("Delete failed: " + e.message); }
  };

  // Bulk bake. The backend endpoint /api/admin/bake-routes never went away — only its
  // UI did, when the bake panel was rehomed. That was fine while the network was already
  // baked, but a cold network needs 107 routes x 2 legs per vehicle, and the per-route
  // Bake button only uses the "Show" selector's vehicle on a route that has no geometry
  // yet. So a manual sweep is 107 clicks AND silently does one profile.
  //
  // The endpoint works in batches of legs and reports what is left, so this loops until
  // 'remaining' hits 0 rather than trying to do it in one request that would time out.
  const bulkBake = async () => {
    const profs = rVehicles.length ? rVehicles : [showProfile];
    const legLabel = bakeLegs === "loaded" ? "laden leg only" : "both legs";
    if(!confirm(
      `Bake ${profs.length} vehicle profile(s) across the whole network, ${legLabel}?\n\n` +
      `${profs.map(vehShort).join(", ")}\n\n` +
      `This calls HERE once per route per leg and can take several minutes. Routes that ` +
      `already have geometry are re-routed, so a promoted alternative will be reset to ` +
      `HERE's own ranking.`)) return;

    setRouteBusy(true);
    try {
      for(const prof of profs){
        let guard = 0;                 // the endpoint is the authority on 'remaining';
        while(guard++ < 200){          // this only stops a bug becoming an infinite loop
          const q = new URLSearchParams({ profile: prof, limit: "30" });
          if(bakeLegs === "loaded") q.set("legs", "loaded");
          if(tokenRef.current) q.set("token", tokenRef.current);
          const res = await fetch(`${API}/admin/bake-routes?${q}`, { method: "POST" });
          if(!res.ok){
            const t = await res.text();
            throw new Error(res.status === 403 ? "admin token rejected" : `${res.status} ${t.slice(0,120)}`);
          }
          const j = await res.json();
          const left = j.remaining ?? 0;
          setRouteMsg(`Baking ${vehShort(prof)} — ${left} leg(s) remaining…`);
          await reloadNetwork();
          if(left <= 0) break;
        }
      }
      await reloadNetwork();
      setRouteMsg(`Bulk bake finished for ${profs.map(vehShort).join(", ")}. Check the Vehicles column for anything still amber or red.`);
    } catch(e){
      setRouteMsg("Bulk bake stopped: " + e.message + " — already-baked routes are kept, so you can run it again.");
    }
    setRouteBusy(false);
  };

  const clearRoutes = async () => {
    if(!confirm("Clear ALL routes and their geometry? Locations are kept. This is for retiring the V2 seed and can't be undone.")) return;
    if(!confirm("Really clear every route? Type-check: this removes all of them.")) return;
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setRouteBusy(true); setRouteMsg("Clearing all routes…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/clear-routes${qs}`, { method: "POST" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,120)}`); }
      const j = await res.json();
      setSelected(null);
      await reloadNetwork();
      setRouteMsg(`Cleared ${j.cleared ?? 0} route(s). Locations kept.`);
    } catch(e){ setRouteMsg("Clear failed: " + e.message); }
    setRouteBusy(false);
  };

  // ================================================================ zones (Phase 3)
  // Drawing is hand-rolled rather than mapbox-gl-draw: clicks append vertices, Save
  // closes the ring. That keeps the "one Mapbox instance, no build step, no extra CDN"
  // architecture intact and avoids coupling to a plugin version. The cost is no
  // vertex-level editing — to change a shape you redraw it. If nudging single corners
  // becomes necessary, mapbox-gl-draw is the upgrade and it drops into this same source.
  const reloadZones = () =>
    fetch(`${API}/zones`).then(r => r.json()).then(j => {
      setZoneList(j.zones || []);
      // Phase 4: zone_id -> number of routes attached. A haul road on no route is the
      // commonest reason one "does nothing", and the table has to say so rather than
      // leaving it to be discovered after a bake that changed nothing.
      setHaulUse(j.haul_links || {});
      return j;
    });

  useEffect(() => { reloadZones().catch(() => setZoneList([])); }, []);

  const todayISO = () => new Date().toISOString().slice(0, 10);

  // a zone is in force if it is active and today falls inside its (open-ended) window
  const zoneInForce = (z) => {
    if(!z || !z.active) return false;
    const t = todayISO();
    if(z.starts_on && t < z.starts_on) return false;
    if(z.ends_on && t > z.ends_on) return false;
    return true;
  };

  const ringOf = (pts) => {
    const r = pts.map(p => [p[0], p[1]]);
    if(r.length && (r[0][0] !== r[r.length-1][0] || r[0][1] !== r[r.length-1][1])) r.push([r[0][0], r[0][1]]);
    return r;
  };

  const addVertex = (lng, lat) => setDrawPts(p => p.concat([[lng, lat]]));
  const undoVertex = () => setDrawPts(p => p.slice(0, -1));
  cbRef.current.addVertex = addVertex;

  // Phase 4: a haul road is drawn as an open line, everything else as a closed ring.
  // The difference is one condition rather than a second drawing tool, which is why the
  // hand-rolled vertex collector was worth keeping: the same clicks mean both things.
  const isHaul = (f) => !!f && f.kind === HAUL_KIND;
  const minPts = (f) => isHaul(f) ? 2 : 3;

  const blankZone = () => ({
    id: null, name: "", kind: "closure", affects_routing: true,
    starts_on: "", ends_on: "", note: "", active: true,
    speed_kph: "", haul_mode: "",
  });

  const startNewZone = () => {
    setZoneForm(blankZone()); setDrawPts([]); setZoneDraw(true);
    setZoneSel(null); setZoneMsg("Click the map to place corners — at least three. Save closes the shape.");
  };

  const startNewHaul = () => {
    setZoneForm({ ...blankZone(), kind: HAUL_KIND }); setDrawPts([]); setZoneDraw(true);
    setZoneSel(null);
    setZoneMsg("Click the map along the haul road — at least two points. It is saved as an open line, not a closed shape.");
  };

  const editZone = (z) => {
    setZoneForm({ id: z.id, name: z.name || "", kind: z.kind || "other",
                  affects_routing: !!z.affects_routing, starts_on: z.starts_on || "",
                  ends_on: z.ends_on || "", note: z.note || "", active: !!z.active,
                  speed_kph: (z.speed_kph == null ? "" : String(z.speed_kph)),
                  haul_mode: z.haul_mode || "" });
    setZoneSel(z.id);
    // load the existing shape as editable vertices. A polygon's repeated closing point is
    // dropped; a haul road has none to drop, and popping its last point would shorten the
    // road by one vertex every time it was opened.
    const c = (z.geometry && z.geometry.coordinates) || [];
    const ring = (z.geometry && z.geometry.type === "Polygon") ? (c[0] || []) : c;
    const pts = ring.slice();
    if(z.geometry && z.geometry.type === "Polygon"
       && pts.length > 1 && pts[0][0] === pts[pts.length-1][0] && pts[0][1] === pts[pts.length-1][1]) pts.pop();
    setDrawPts(pts);
    setZoneDraw(false);
    setZoneMsg("");
    const m = mapObj.current;
    if(m && pts.length) { try { m.fitBounds(boundsOf(pts), { padding: 80, maxZoom: 13, duration: 600 }); } catch(e){} }
  };

  const cancelZone = () => { setZoneForm(null); setDrawPts([]); setZoneDraw(false); setZoneMsg(""); };

  const setZField = (k, v) => setZoneForm(f => ({ ...f, [k]: v }));

  // After a zone write the backend has already CLEARED the geometry it invalidated; it
  // does not call HERE. Re-baking is this loop, which is the same /api/admin/bake-routes
  // batch loop the bulk-bake button uses — after invalidation the only legs missing
  // geometry are exactly the ones that were cleared, so it re-routes those and nothing
  // else. Doing it server-side inside the write request would block one HTTP call on
  // dozens of HERE round trips and time out on Render.
  const rebakeAfterZone = async (inval) => {
    const legs = (inval && inval.legs) || [];
    if(!legs.length) return "";
    const profs = Array.from(new Set(legs.map(l => l.vehicle_profile)));
    let done = 0;
    for(const prof of profs){
      let guard = 0;
      while(guard++ < 200){
        const q = new URLSearchParams({ profile: prof, limit: "30" });
        if(tokenRef.current) q.set("token", tokenRef.current);
        const res = await fetch(`${API}/admin/bake-routes?${q}`, { method: "POST" });
        if(!res.ok){
          const t = await res.text();
          throw new Error(res.status === 403 ? "admin token rejected" : `${res.status} ${t.slice(0,120)}`);
        }
        const j = await res.json();
        done += j.baked || 0;
        setZoneMsg(`Re-routing ${vehShort(prof)} — ${j.remaining ?? 0} leg(s) left…`);
        if((j.remaining ?? 0) <= 0) break;
      }
    }
    await reloadNetwork();
    // Phase 4: the zone list carries the haul-road link counts and the derived lengths,
    // so a re-bake driven by an attach has to refresh it too or the "used by" column
    // keeps showing the state before the change.
    await reloadZones().catch(() => {});
    return ` Re-routed ${done} leg(s) across ${profs.length} vehicle profile(s).`;
  };

  const saveZone = async () => {
    if(!zoneForm) return;
    const haulNow = isHaul(zoneForm);
    if(!zoneForm.name.trim()){ setZoneMsg("Give the zone a name."); return; }
    if(drawPts.length < minPts(zoneForm)){
      setZoneMsg(haulNow ? "A haul road needs at least two points — it is travelled along."
                         : "A zone needs at least three corners."); return; }
    const body = {
      name: zoneForm.name.trim(),
      geometry: haulNow
        ? { type: "LineString", coordinates: drawPts.map(p => [p[0], p[1]]) }
        : { type: "Polygon", coordinates: [ringOf(drawPts)] },
      kind: zoneForm.kind, affects_routing: !!zoneForm.affects_routing,
      starts_on: zoneForm.starts_on || null, ends_on: zoneForm.ends_on || null,
      note: zoneForm.note || null, active: !!zoneForm.active,
      // sent for every kind, ignored by the backend for the others. Blank stays null:
      // "no assigned speed" is not "0 km/h", and a haul road with no speed keeps HERE's
      // own timing rather than contributing an infinite one.
      speed_kph: (haulNow && String(zoneForm.speed_kph).trim() !== ""
                  ? Number(zoneForm.speed_kph) : null),
      haul_mode: (haulNow && zoneForm.haul_mode ? zoneForm.haul_mode : null),
    };
    setZoneBusy(true); setZoneMsg("Saving…");
    try {
      const qs = tokenRef.current ? `?token=${encodeURIComponent(tokenRef.current)}` : "";
      const url = zoneForm.id ? `${API}/admin/zones/${encodeURIComponent(zoneForm.id)}${qs}`
                              : `${API}/admin/zones${qs}`;
      const res = await fetch(url, {
        method: zoneForm.id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,160)}`); }
      const j = await res.json();
      await reloadZones();
      const inv = j.invalidated || {};
      let msg = `Saved ${(j.zone && j.zone.id) || ""}.`;
      if(inv.leg_count) msg += ` ${inv.leg_count} baked leg(s) invalidated — re-routing now.`;
      setZoneMsg(msg);
      if(inv.leg_count) msg += await rebakeAfterZone(inv);
      if(inv.approximate) msg += ` ${inv.approximate} of those were matched approximately (baked before zones existed, so there is no record of what they avoided).`;
      setZoneMsg(msg);
      setZoneForm(null); setDrawPts([]); setZoneDraw(false);
    } catch(e){ setZoneMsg("Save failed: " + e.message); }
    setZoneBusy(false);
  };

  const removeZone = async (z) => {
    // show the HERE bill before spending it — /impact is a dry run
    let impact = null;
    try {
      const qs = tokenRef.current ? `?token=${encodeURIComponent(tokenRef.current)}` : "";
      const r = await fetch(`${API}/admin/zones/${encodeURIComponent(z.id)}/impact${qs}`);
      if(r.ok) impact = (await r.json()).would_invalidate;
    } catch(e){}
    const calls = impact ? impact.here_calls : null;
    if(!confirm(
      `Delete zone ${z.id} "${z.name}"?\n\n` +
      (calls === null ? "Could not check what this invalidates — the re-bake may be large.\n\n"
                      : `${calls} baked leg(s) will be cleared and re-routed — that is ${calls} HERE call(s).\n\n`) +
      "Deactivating instead (untick Active) stops it steering the router but keeps the record of why past bakes went the way they did.")) return;
    setZoneBusy(true); setZoneMsg("Deleting…");
    try {
      const qs = tokenRef.current ? `?token=${encodeURIComponent(tokenRef.current)}` : "";
      const res = await fetch(`${API}/admin/zones/${encodeURIComponent(z.id)}${qs}`, { method: "DELETE" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,160)}`); }
      const j = await res.json();
      await reloadZones();
      const inv = j.invalidated || {};
      let msg = `Deleted ${z.id}.`;
      if(inv.leg_count) msg += ` ${inv.leg_count} leg(s) invalidated — re-routing now.`;
      setZoneMsg(msg);
      if(inv.leg_count) msg += await rebakeAfterZone(inv);
      setZoneMsg(msg);
      if(zoneSel === z.id) setZoneSel(null);
      if(zoneForm && zoneForm.id === z.id) cancelZone();
    } catch(e){ setZoneMsg("Delete failed: " + e.message); }
    setZoneBusy(false);
  };

  // push saved zones to the map
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const s = m.getSource("zones"); if(!s) return;
    zonesFC.current = {
      type: "FeatureCollection",
      features: (zoneList || []).filter(z => z.geometry).map(z => ({
        type: "Feature",
        properties: { id: z.id, name: z.name, kind: z.kind,
                      affects_routing: !!z.affects_routing,
                      is_haul: z.kind === HAUL_KIND,
                      in_force: zoneInForce(z), selected: z.id === zoneSel },
        geometry: z.geometry,
      })),
    };
    s.setData(zonesFC.current);
  }, [zoneList, zoneSel, mapReady]);

  // push the in-progress shape to the map: the outline plus a dot per corner
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const s = m.getSource("draw"); if(!s) return;
    const feats = drawPts.map(p => ({ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: p } }));
    if(drawPts.length >= 2){
      // drawn as a closed ring from three corners on, so what you see while placing is
      // the shape that will be saved rather than an open chain that jumps shut on Save.
      // A haul road is never closed — it is a road, and showing it shut would be showing
      // a shape that Save is not going to produce.
      const haulNow = isHaul(zoneForm);
      const line = (!haulNow && drawPts.length >= 3) ? ringOf(drawPts) : drawPts;
      feats.push({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: line } });
    }
    drawFC.current = { type: "FeatureCollection", features: feats };
    s.setData(drawFC.current);
  }, [drawPts, mapReady, zoneForm && zoneForm.kind]);

  // leaving Zones abandons a half-drawn shape, so map clicks stop dropping corners
  useEffect(() => {
    if(subTab !== "zones" && (zoneDraw || zoneForm)) cancelZone();
  }, [subTab]);

  // cursor reflects add mode
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    try { m.getCanvas().style.cursor = (mode === "add" || zoneDraw || gatePlace) ? "crosshair" : ""; } catch(e){}
  }, [mode, zoneDraw, gatePlace, mapReady]);

  // sub-tab switch: re-lean the shared map
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    applyEmphasis(m);
  }, [subTab, mapReady]);

  // leaving Locations abandons any half-finished add/edit, so add mode can't linger
  // (crosshair cursor, map clicks dropping pins) while its panel isn't on screen
  useEffect(() => {
    if(subTab !== "locations" && mode !== "view"){ setForm(null); setMode("view"); setLocMsg(""); }
  }, [subTab]);

  // provisional add marker follows the form coords
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const s = m.getSource("newnode"); if(!s) return;
    const lat = form ? parseFloat(form.lat) : NaN, lon = form ? parseFloat(form.lon) : NaN;
    const show = mode === "add" && isFinite(lat) && isFinite(lon);
    newFC.current = show
      ? { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [lon, lat] } }] }
      : { type: "FeatureCollection", features: [] };
    s.setData(newFC.current);
  }, [mode, form && form.lat, form && form.lon, mapReady]);

  // highlight ring around the node being edited
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const s = m.getSource("selnode"); if(!s) return;
    const lat = form ? parseFloat(form.lat) : NaN, lon = form ? parseFloat(form.lon) : NaN;
    if(mode === "edit" && form && form.id && isFinite(lat) && isFinite(lon)){
      s.setData({ type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [lon, lat] } }] });
    } else {
      s.setData({ type: "FeatureCollection", features: [] });
    }
  }, [mode, form && form.id, form && form.lat, form && form.lon, mapReady]);

  const sel = "border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm bg-white";
  const bakedCount = (summary && summary.profiles && summary.profiles[showProfile]) ? summary.profiles[showProfile].baked : 0;
  const totalRoutes = summary ? summary.routes : 0;
  // Phase 4: the haul roads a route can be given. Derived from the zone list rather than
  // fetched separately — they are zones, and two lists that can disagree is exactly the
  // failure the merged zones table was built to avoid.
  const haulRoadList = (zoneList || []).filter(z => z.kind === HAUL_KIND);

  const onLoc = subTab === "locations";
  const onZones = subTab === "zones";
  // three sub-tabs now, so "not locations" no longer means "routes"
  const onRoutes = subTab === "routes";
  // side by side, the panel column matches the map and scrolls inside itself, so the
  // map never slides out from under whatever you're editing
  const panelStyle = isWide ? { height: MAP_H, overflowY: "auto" } : undefined;
  const th = "px-3 py-2 text-left font-semibold";

  return (
    <div className="max-w-7xl mx-auto p-5 space-y-4">
      {/* 2.5b: the tab bar that used to sit here is the rail's Data group now. One
          header per page, with the map controls as its actions — they belong to the
          shared map, so they stay put across all three pages. */}
      <PageHeader
        title={onLoc ? "Locations" : onRoutes ? "Routes" : "Zones"}
        subtitle={onLoc
          ? "Every site the network hauls from and to. Click the map to place one, drag a marker to move it; a site that a route uses cannot be deleted."
          : onRoutes
          ? "Origin → destination pairs, baked against HERE for real truck geometry in both directions. Editing a route keeps its forecasts; moving an end clears the geometry until it is re-baked."
          : "Haul roads, restricted areas and the other polygons routing is aware of. A haul road is a zone a route can be told to use."}
        actions={<>
          <span className="text-xs text-slate-400">Basemap</span>
          <select value={basemap} onChange={e => changeStyle(e.target.value)} className={sel}>
            {BASEMAPS.map(([label, val]) => <option key={val} value={val}>{label}</option>)}
          </select>
          <span className="text-xs text-slate-400 ml-1">Show</span>
          <select value={showProfile} onChange={e => setShowProfile(e.target.value)} className={sel}>
            {vehicles.map(v => <option key={v}>{v}</option>)}
          </select>
          {/* the map can only draw one of the baked geometries at a time */}
          <select value={showLeg} onChange={e => setShowLeg(e.target.value)} className={sel} title="Which direction to draw">
            <option value="loaded">Laden out</option>
            <option value="return">Empty back</option>
          </select>
          <select value={showAlt} onChange={e => setShowAlt(+e.target.value)} className={sel} title="Which HERE option to draw">
            <option value={0}>Primary route</option>
            <option value={1}>Alt 1</option>
            <option value={2}>Alt 2</option>
          </select>
          {/* every admin action reads this one field — routes are baked per route now,
              so there is no bulk-bake panel to hold it */}
          <input value={token} onChange={e => setToken(e.target.value)} placeholder="Admin token"
            title="Only needed if ADMIN_TOKEN is set on the server. Remembered in this browser."
            className="border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm w-36" />
        </>}>
        <div className="text-xs text-slate-500 mt-1.5 flex flex-wrap gap-x-3 gap-y-1">
          <span>{locs.length} locations</span><span className="text-slate-300">·</span>
          <span>{(status || []).length} routes</span><span className="text-slate-300">·</span>
          <span>{zoneList.length} zones</span><span className="text-slate-300">·</span>
          <span>{bakedCount}/{totalRoutes || 0} baked for {showProfile}</span>
        </div>
      </PageHeader>

      {summary && !summary.here_configured && (
        <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">
          HERE_API_KEY isn't set on the server yet — add it in Render → Environment, then bake.
        </div>
      )}

      {mode === "add" && (
        <div className="rounded-lg border border-blue-300 bg-blue-50 p-3 text-sm text-blue-800 flex items-center justify-between gap-3">
          <span><strong>Add location:</strong> click the map to drop the marker, then fill in the panel and Create. Or type coordinates directly.</span>
          <button onClick={cancelForm} className="text-blue-700 hover:underline whitespace-nowrap">Cancel</button>
        </div>
      )}

      <div className="grid lg:grid-cols-3 gap-4">
        {/* ONE map instance, shared by both sub-tabs — this div is never unmounted */}
        <div className="lg:col-span-2 card overflow-hidden">
          <div ref={mapDiv} style={{ height: MAP_H, width: "100%" }} />
        </div>

        <div className="space-y-4" style={panelStyle}>
          {onLoc && (
          <div className="card p-4">
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm font-semibold text-slate-700">Locations</div>
              {mode === "view" && (
                <button onClick={startAdd} className="text-xs font-semibold px-2.5 py-1 rounded-md text-white" style={{ background: "var(--navy)" }}>+ Add location</button>

            </div>

            {mode === "view" && (
              <p className="text-[11px] text-slate-400">Click a node to edit it, or drag it to move — routes it touches re-bake automatically for the profiles ticked below. Deleting a location also removes routes that use it.</p>

            {form && (
              <div className="space-y-3">
                <div className="text-[11px] uppercase tracking-wide text-slate-400">{form.id ? `Editing ${form.id}` : "New location"}</div>
                <label className="block">
                  <span className="text-[11px] uppercase tracking-wide text-slate-400">Name</span>

                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Type</span>
                    <select value={form.loc_type} onChange={e => setField("loc_type", e.target.value)} className={"mt-1 w-full " + sel}>

                    </select>
                  </label>

                {form.role !== "destination" && (

                      {materials.map(cat => (
                        <label key={cat} className="flex items-center gap-2 text-xs text-slate-700">

                          {cat}

                    </div>
                  </div>

                {form.role !== "origin" && (

                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Receives · materials it accepts</span>

                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Longitude</span>

                  </label>
                </div>

                {/* Week 1, Task D2 — storage ON this location. NOT the haul/gate

                {showCapacity && (
                <div className="rounded-lg border border-slate-200 bg-slate-50/60 p-2.5">

                    <label className="block">
                      <span className="text-[10px] text-slate-400">Max capacity</span>
                      <input value={form.capacity_qty} onChange={e => setField("capacity_qty", e.target.value)}

                    <label className="block">
                      <span className="text-[10px] text-slate-400">Unit</span>
                      <select value={form.capacity_unit} onChange={e => setField("capacity_unit", e.target.value)}

                    <label className="block">

                        className="mt-0.5 w-full border border-slate-300 rounded-lg px-2 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />

                    start of the horizon. Over capacity is flagged on the Look-ahead, never blocked.
                  </p>
                </div>

                {/* Operator and free-text detail. Salvaged out of a1_data.js before that
                    file was retired — the quarry operator existed nowhere else in the
                    system — and editable here so it stays current. */}
                <div className="grid grid-cols-1 gap-2">
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Operator / company</span>
                    <input value={form.vendor} onChange={e => setField("vendor", e.target.value)}

                      className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                  </label>
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Detail / notes</span>
                    <input value={form.detail} onChange={e => setField("detail", e.target.value)}
                      placeholder="e.g. Limestone - rockfill"
                      className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                  </label>
                </div>

                {/* Access gate — where trucks actually join the road, which for a big
                    site is nowhere near the marker in the middle of it. Optional: left
                    blank, routing uses the coordinates above. */}
                <div className="rounded-lg border border-slate-200 bg-slate-50/60 p-2.5">
                  <div className="flex items-baseline justify-between gap-2">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Access gate (optional)</span>
                    {(form.gate_lat !== "" || form.gate_lon !== "") && (
                      <button onClick={() => setForm(f => ({ ...f, gate_lat: "", gate_lon: "" }))}
                        className="text-[11px] text-slate-500 hover:underline">Clear</button>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-1">
                    <input value={form.gate_lat} onChange={e => setField("gate_lat", e.target.value)}
                      inputMode="decimal" placeholder="Gate lat"
                      className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                    <input value={form.gate_lon} onChange={e => setField("gate_lon", e.target.value)}
                      inputMode="decimal" placeholder="Gate lon"
                      className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                  </div>
                  <p className="text-[11px] text-slate-400 mt-1.5">
                    Where vehicles join the public road. Leave blank to route to the marker itself.
                    Changing it re-routes everything touching this location.
                  </p>
                </div>

                {/* ---------------------------------------------------------------
                    Phase 5a — gates. A site may have several, each one-way or both.
                    The single pair above is the pre-5a model and stays as the
                    fallback: with no gates recorded, routing uses it exactly as
                    before. Once a gate exists here, it wins.
                    ------------------------------------------------------------ */}
                {form.id && (
                <div className="rounded-lg border border-slate-200 p-2.5">
                  <div className="flex items-baseline justify-between gap-2">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Gates</span>
                    {!gateForm && (
                      <button onClick={newGate}
                        className="text-[11px] font-semibold text-[color:var(--blue)] hover:underline">
                        + Add gate
                      </button>
                    )}
                  </div>

                  {!gateList.length && !gateForm && (
                    <p className="text-[11px] text-slate-400 mt-1.5">
                      No gates recorded. Routing falls back to the access gate above, then to the
                      marker — the same behaviour as before gates existed.
                    </p>
                  )}

                  {gateList.length > 0 && (
                    <ul className="mt-1.5 space-y-1">
                      {gateList.map(g => (
                        <li key={g.id}
                          className={"flex items-center gap-2 text-xs rounded px-1.5 py-1 " +
                                     (g.active ? "hover:bg-slate-50" : "opacity-60 bg-slate-50")}>
                          <span className="font-medium text-slate-700">{g.name}</span>
                          <span className="text-slate-400">{g.id}</span>
                          <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full"
                            style={{ background: "rgba(31,86,168,.1)", color: "var(--blue)" }}>
                            {g.direction === "access" ? "in only"
                              : g.direction === "egress" ? "out only" : "in + out"}
                          </span>
                          {g.is_default && <span className="text-[10px] text-slate-500">default</span>}
                          {!g.active && <span className="text-[10px]" style={{ color: "var(--red)" }}>deactivated</span>}
                          {g.safety_minutes ? <span className="text-[10px] text-slate-500"
                            title="Induction time, applied to whatever arrives at this gate">
                            {g.safety_minutes}m induction</span> : null}
                          {g.internal_travel_minutes ? <span className="text-[10px] text-slate-500"
                            title="Flat gate-to-face travel. Ignored on a route that has a drawn haul road — that road already carries these minutes.">
                            {g.internal_travel_minutes}m internal</span> : null}
                          <span className="ml-auto flex gap-2">
                            <button onClick={() => editGate(g)}
                              className="text-[11px] text-slate-500 hover:underline">Edit</button>
                            <button onClick={() => deleteGate(g.id)}
                              className="text-[11px] text-slate-400 hover:underline">Delete</button>
                          </span>
                        </li>
                      ))}
                    </ul>
                  )}

                  {gateForm && (
                    <div className="mt-2 border-t border-slate-200 pt-2 space-y-2">
                      <div className="grid grid-cols-2 gap-2">
                        <input value={gateForm.name}
                          onChange={e => setGateForm(g => ({ ...g, name: e.target.value }))}
                          placeholder="Gate name, e.g. Weighbridge in"
                          className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                        <select value={gateForm.direction}
                          onChange={e => setGateForm(g => ({ ...g, direction: e.target.value }))}
                          className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm bg-white">
                          <option value="both">In and out</option>
                          <option value="access">Entry only</option>
                          <option value="egress">Exit only</option>
                        </select>
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                        <input value={gateForm.lat}
                          onChange={e => setGateForm(g => ({ ...g, lat: e.target.value }))}
                          inputMode="decimal" placeholder="Lat"
                          className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm" />
                        <input value={gateForm.lon}
                          onChange={e => setGateForm(g => ({ ...g, lon: e.target.value }))}
                          inputMode="decimal" placeholder="Lon"
                          className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm" />
                        <button onClick={() => setGatePlace(v => !v)}

                      : <span className="text-slate-300" title="Routes to the marker itself">—</span>}
                  </td>
                  <td className="px-3 py-2 text-right tabular-nums">
                    {routeCounts[l.id]
                      ? routeCounts[l.id]
                      : <span className="text-slate-300">0</span>}
                  </td>
                </tr>
              ))}
              {!locs.length && <tr><td colSpan="8" className="px-3 py-6 text-center text-slate-400">No locations yet — add one with “+ Add location”.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      ) : onRoutes ? (
      <div className="card overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
          <span className="text-sm font-semibold text-slate-700">Routes <span className="text-slate-400 font-normal">· click a row to locate it on the map</span></span>
          <span className="flex items-center gap-2">
            {/* Bulk bake. Vehicles come from the tick-boxes on the Create route panel so
                there is one vehicle list on the tab rather than two that can disagree. */}
            <select value={bakeLegs} onChange={e => setBakeLegs(e.target.value)} className={sel}
              title="Both legs gives a cycle time. Laden only halves the HERE calls but leaves the return unbaked.">
              <option value="both">Both legs</option>
              <option value="loaded">Laden leg only</option>
            </select>
            <button onClick={bulkBake} disabled={routeBusy || !(status && status.length)}
              title={rVehicles.length
                ? `Bake the whole network for ${rVehicles.map(vehShort).join(", ")} — ticked on the Create route panel`
                : `No vehicles ticked on the Create route panel — will use ${vehShort(showProfile)}`}
              className="text-xs font-semibold px-2.5 py-1 rounded-md text-white disabled:opacity-40"
              style={{ background: "var(--navy)" }}>
              {routeBusy ? "Baking…" : `Bake all · ${(rVehicles.length || 1)} vehicle(s)`}
            </button>
            <button onClick={clearRoutes} disabled={routeBusy || !(status && status.length)}
              className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 text-[color:var(--red)] hover:bg-red-50 disabled:opacity-40">
              Clear all routes
            </button>
          </span>
        </div>
        {routeMsg && (
          <div className="px-4 py-2 border-b border-slate-100 text-xs text-slate-600 bg-slate-50">{routeMsg}</div>
        )}
        <div className="overflow-auto" style={{ maxHeight: "40vh" }}>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs sticky top-0">
              <tr>
                <th className="px-2 py-2 w-6"></th>
                <th className={th}>Route</th>
                <th className={th}>From → to</th>
                <th className={th}>IPT</th>
                <th className="px-3 py-2 text-right font-semibold">km ({vehShort(showProfile)})</th>
                <th className={th}>Vehicles</th>
                <th className="px-3 py-2 text-right font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody>
              {(status || []).map(r => {
                const pinfo = r.profiles[showProfile];
                const open = openRow === r.id;
                return (
                  <React.Fragment key={r.id}>
                  <tr onClick={() => selectRoute(r.id)}
                    className={"border-t border-slate-100 cursor-pointer " + (selected === r.id ? "bg-blue-50" : "hover:bg-slate-50")}>
                    <td className="px-2 py-2">
                      <button
                        onClick={(e) => { e.stopPropagation(); setOpenRow(open ? null : r.id); }}
                        title={open ? "Hide analysis" : "Show haul-cycle analysis"}
                        aria-label={open ? "Hide analysis" : "Show analysis"}
                        aria-expanded={open}
                        className="w-5 h-5 rounded flex items-center justify-center text-slate-400 hover:bg-slate-200 hover:text-slate-700 transition">
                        <span style={{ display: "inline-block", transition: "transform .15s",
                          transform: open ? "rotate(90deg)" : "none", fontSize: 10 }}>▶</span>
                      </button>
                    </td>
                    <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">
                      {r.id}
                      {!!(r.gate_blockers || []).length && (
                        <span title={(r.gate_blockers || []).join("; ")}
                          className="ml-1.5 text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
                          style={{ background: "rgba(197,48,48,.12)", color: "var(--red)" }}>
                          gate blocked
                        </span>
                      )}
                      {!!(r.haul_roads || []).length && (
                        <span title={`Routed through ${(r.haul_roads || []).length} temporary haul road(s): ${(r.haul_roads || []).join(", ")}. Expand the row to edit.`}
                          className="ml-1.5 text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
                          style={{ background: "rgba(194,121,11,.12)", color: ZONE_HAUL }}>
                          haul ×{(r.haul_roads || []).length}
                        </span>
                      )}
                    </td>
                    <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{r.origin} → {r.dest}</td>
                    <td className="px-3 py-2 text-slate-500">{r.ipt || "—"}</td>
                    <td className="px-3 py-2 text-right tabular-nums">{pinfo && pinfo.distance_km != null ? pinfo.distance_km : "—"}</td>
                    <td className="px-3 py-2"><VehChips profiles={r.profiles} /></td>
                    <td className="px-3 py-2 text-right whitespace-nowrap">
                      <button onClick={(e) => { e.stopPropagation(); rebakeRoute(r.id, Object.keys(r.profiles || {})); }}
                        disabled={bakeBusy === r.id}
                        title={Object.keys(r.profiles || {}).length
                          ? `Re-route via HERE for ${Object.keys(r.profiles).map(vehShort).join(", ")}`
                          : `Not baked yet — will route for ${vehShort(showProfile)}`}
                        className="text-[color:var(--navy)] hover:underline text-xs font-semibold disabled:opacity-40 mr-3">
                        {bakeBusy === r.id ? "Baking…" : "Bake"}
                      </button>
                      <button onClick={(e) => { e.stopPropagation(); startEditRoute(r); }}
                        className="text-[color:var(--navy)] hover:underline text-xs font-semibold mr-3">Edit</button>
                      <button onClick={(e) => { e.stopPropagation(); deleteRoute(r.id); }}
                        className="text-[color:var(--red)] hover:underline text-xs font-semibold">Delete</button>
                    </td>
                  </tr>
                  {open && <RouteAnalysis routeId={r.id} colSpan={7}
                    originId={r.origin_id} destId={r.dest_id}
                    gateBlockers={r.gate_blockers}
                    active={selected === r.id ? activeGeom : null}
                    leg={showLeg}
                    onFocus={selected === r.id ? focusGeom : (p, a) => { selectRoute(r.id); focusGeom(p, a); }}
                    onPromote={selected === r.id ? promoteAlt : null}
                    promoting={promoting}
                    haulRoads={haulRoadList}
                    token={tokenRef.current}
                    onHaulChanged={rebakeAfterZone} />}
                  </React.Fragment>
                );
              })}
              {status && status.length === 0 && <tr><td colSpan="7" className="px-3 py-6 text-center text-slate-400">No routes yet — author one with “Create route”.</td></tr>}
              {!status && <tr><td colSpan="7" className="px-3 py-6 text-center text-slate-400">Loading…</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      ) : (
      <div className="card overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
          <span className="text-sm font-semibold text-slate-700">Zones <span className="text-slate-400 font-normal">· click a row to edit the zone and frame it on the map</span></span>
          <span className="flex items-center gap-2">
            <button onClick={startNewZone} disabled={zoneBusy}
              className="text-xs font-semibold px-2.5 py-1 rounded-md text-white disabled:opacity-40" style={{ background: "var(--navy)" }}>
              + Draw zone
            </button>
            <button onClick={startNewHaul} disabled={zoneBusy}
              className="text-xs font-semibold px-2.5 py-1 rounded-md text-white disabled:opacity-40" style={{ background: ZONE_HAUL }}>
              + Haul road
            </button>
          </span>
        </div>
        <div className="overflow-auto" style={{ maxHeight: "40vh" }}>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs sticky top-0">
              <tr>
                <th className={th}>ID</th><th className={th}>Name</th><th className={th}>Kind</th>
                <th className={th}>Routing</th><th className={th}>From</th><th className={th}>To</th>
                <th className={th}>State</th><th className={th}>Used by</th><th className={th}></th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-100">
              {(zoneList || []).map(z => {
                const force = zoneInForce(z);
                return (
                  <tr key={z.id} onClick={() => editZone(z)}
                      className={"cursor-pointer hover:bg-slate-50 " + (zoneSel === z.id ? "bg-slate-50" : "")}>
                    <td className="px-3 py-2 font-mono text-xs text-slate-500">{z.id}</td>
                    <td className="px-3 py-2 font-medium">{z.name}</td>
                    <td className="px-3 py-2 text-slate-500">{(ZONE_KINDS.find(k => k[0] === z.kind) || [null, z.kind])[1]}</td>
                    <td className="px-3 py-2">
                      {z.kind === HAUL_KIND
                        ? (z.affects_routing
                           ? <span className="text-xs font-semibold px-2 py-0.5 rounded whitespace-nowrap"
                               style={{ background: "rgba(194,121,11,.12)", color: ZONE_HAUL }}
                               title="Routes attached to this road are sent through it — it is never in HERE's avoid list">
                               Routed through{z.speed_kph ? ` @ ${z.speed_kph}` : ""}
                             </span>
                           : <span className="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-500" title="Drawn but not open to traffic">Not open</span>)
                        : z.affects_routing
                        ? <span className="text-xs font-semibold px-2 py-0.5 rounded" style={{ background: "#FDE8EE", color: ZONE_ROUTING }}>Avoided</span>
                        : <span className="text-xs px-2 py-0.5 rounded bg-slate-100 text-slate-500">Advisory</span>}
                    </td>
                    <td className="px-3 py-2 text-slate-500">{z.starts_on || "—"}</td>
                    <td className="px-3 py-2 text-slate-500">{z.ends_on || "—"}</td>
                    <td className="px-3 py-2 text-xs">
                      {!z.active ? <span className="text-slate-400">Inactive</span>
                        : force ? <span className="text-emerald-600 font-semibold">In force</span>
                        : <span className="text-slate-400">Out of window</span>}
                    </td>
                    <td className="px-3 py-2 text-xs">
                      {z.kind !== HAUL_KIND ? <span className="text-slate-300">—</span>
                        : haulUse[z.id]
                        ? <span className="text-slate-600">{haulUse[z.id]} route(s)</span>
                        : <span style={{ color: ZONE_HAUL }}
                            title="Drawn, but on no route — so it changes nothing. Attach it by expanding a route on the Routes tab.">
                            no routes
                          </span>}
                    </td>
                    <td className="px-3 py-2 text-right">
                      <button onClick={e => { e.stopPropagation(); removeZone(z); }} disabled={zoneBusy}
                        className="text-xs text-[color:var(--red)] hover:underline disabled:opacity-40">Delete</button>
                    </td>
                  </tr>
                );
              })}
              {!zoneList.length && <tr><td colSpan="9" className="px-3 py-6 text-center text-slate-400">
                No zones yet. Draw one to steer HERE around a closure, to mark a works area for planners without changing routing, or draw a temporary haul road for routes to run through.
              </td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      )}
    </div>
  );
}

// ---- little presentational helpers ----
const selCls = "w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white outline-none focus:ring-2 focus:ring-[color:var(--blue)]";
function Field({ label, children }){
  return <label className="block"><span className="text-[11px] uppercase tracking-wide text-slate-400">{label}</span><div className="mt-1">{children}</div></label>;
}
function Stat({ label, value, tone }){
  return <span className="flex flex-col"><span className="text-[11px] uppercase tracking-wide text-slate-400">{label}</span><span className="font-bold text-base" style={{color: tone || "var(--navy-deep)"}}>{value}</span></span>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
