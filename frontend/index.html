<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RBE Alliance 1 Logistics</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#003787; --navy-deep:#0A1446; --blue:#3398DB;
    --red:#BF2E55; --green:#039E86; --gold:#FFC101; --grey:#E5E5E5;
    --ink:#1f2937; --muted:#6b7280; --line:#e8eaed; --bg:#fbfbfc;
  }
  html,body,#root{height:100%;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
  .brand-bar{background:var(--navy-deep);}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;}
  .kpi-num{font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  input[type=number]{-moz-appearance:textfield;}
  ::-webkit-scrollbar{height:9px;width:9px;} ::-webkit-scrollbar-thumb{background:#d5d8dd;border-radius:6px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

const API = "/api";
const MAP_URL = "/map/?v=" + Date.now();  // per-load cache-buster so the iframe never serves a stale map
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Demo login. NOTE: these are client-side only and NOT secure — replace with
// real authentication before any production/public use.
const LOGINS = { submitter123: "Submitter", planner123: "Planner", admin123: "Admin" };
const CAN_APPROVE = { Planner: true, Admin: true, Submitter: false };

// ---- client-side conversion preview (mirrors backend factors.json) ----
const density = (f, m) => (f.material_density_t_per_m3[m] ?? f.material_density_t_per_m3._default);
const payload = (f, v) => (f.vehicle_payload_t[v] ?? f.vehicle_payload_t._default);
function toTonnes(q, unit, m, v, f){ q = +q || 0; if(unit==="t") return q; if(unit==="m3") return q*density(f,m); return q*payload(f,v); }
function fromTonnes(t, unit, m, v, f){ if(unit==="t") return t; if(unit==="m3") return t/density(f,m); return t/payload(f,v); }
const fmt = (n, unit) => unit==="vehicles" ? Math.round(n).toLocaleString() : (Math.round(n*10)/10).toLocaleString();

// ---- dashboard helpers ----
const emisFactor = (f,v) => (f.vehicle_emissions_kg_co2e_per_km?.[v] ?? f.vehicle_emissions_kg_co2e_per_km?._default ?? 0.9);
const planningOf = (f) => (f.planning || {avg_haul_speed_kmh:45, load_minutes:12, unload_minutes:8, working_days_per_month:22, shift_hours_per_day:10});
const monthLabelAbs = (idx, startYear) => MONTHS[(idx-1)%12] + " " + String(startYear + Math.floor((idx-1)/12)).slice(2);
const PALETTE = ["#003787","#039E86","#BF2E55","#C6841D","#6D28D9","#0E7490","#3398DB","#9AA7B4","#DB6D33","#1B7F5E"];
const colorOf = (i) => PALETTE[i % PALETTE.length];

// Chart.js wrapper — recreates the chart when its serialised config changes.
function ChartCanvas({ config, height=260 }){
  const ref = useRef(null);
  const inst = useRef(null);
  useEffect(() => {
    if(!ref.current || !window.Chart) return;
    if(inst.current) inst.current.destroy();
    inst.current = new window.Chart(ref.current, config);
    return () => { if(inst.current){ inst.current.destroy(); inst.current = null; } };
  }, [JSON.stringify(config)]);
  return <div style={{height}}><canvas ref={ref}></canvas></div>;
}

function Kpi({ label, value, sub, small }){
  return (
    <div className="card p-3.5">
      <div className={"kpi-num font-bold text-[color:var(--navy-deep)] " + (small ? "text-base" : "text-2xl")}>{value}</div>
      <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-400 mt-0.5">{label}</div>
      {sub && <div className="text-[11px] text-slate-400">{sub}</div>}
    </div>
  );
}

// ================================================================= Dashboard
function Dashboard({ meta }){
  const { routes, materials, vehicles, units, months, factors } = meta;
  const routesById = useMemo(() => Object.fromEntries(routes.map(r => [r.route_id, r])), [routes]);

  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(false);
  const [status, setStatus] = useState("Approved");
  const [unit, setUnit] = useState("t");
  const [material, setMaterial] = useState("All");
  const [vehicle, setVehicle] = useState("All");
  const [fromM, setFromM] = useState(1);
  const [toM, setToM] = useState(months.count);
  const [sortKey, setSortKey] = useState("t");
  const [sortDir, setSortDir] = useState("desc");

  useEffect(() => {
    let live = true;
    fetch(`${API}/forecasts`).then(r => r.json()).then(rs => {
      if(!live) return;
      setRows(rs);
      const idx = rs.map(x => x.month_index);
      if(idx.length){ setFromM(Math.min(...idx)); setToM(Math.max(...idx)); }
    }).catch(() => setErr(true));
    return () => { live = false; };
  }, []);

  const unitLabel = unit === "t" ? "tonnes" : unit === "m3" ? "m³" : "vehicles";

  const D = useMemo(() => {
    if(!rows) return null;
    const lo = Math.min(fromM,toM), hi = Math.max(fromM,toM);
    const P = planningOf(factors);
    const filtered = rows.filter(r =>
      (status==="All" || r.status===status) &&
      (material==="All" || r.material_type===material) &&
      (vehicle==="All" || r.vehicle_type===vehicle) &&
      r.month_index>=lo && r.month_index<=hi
    );
    const n = hi - lo + 1;
    const labels = []; for(let i=lo;i<=hi;i++) labels.push(monthLabelAbs(i, months.start_year));
    const mats = [...new Set(filtered.map(r => r.material_type))];
    const demand = {}; mats.forEach(m => demand[m] = new Array(n).fill(0));
    const tripsM = new Array(n).fill(0);
    const co2M = new Array(n).fill(0);
    const tonnesM = new Array(n).fill(0);
    const split = {}; mats.forEach(m => split[m] = 0);
    const rAgg = {};
    let totT=0, totTrips=0, totKm=0, totCo2=0;
    filtered.forEach(r => {
      const route = routesById[r.route_id] || {};
      const dist = route.distance_km || 0, round = dist*2;
      const t = toTonnes(r.quantity, r.unit, r.material_type, r.vehicle_type, factors);
      const trips = t / payload(factors, r.vehicle_type);
      const km = trips * round;
      const co2 = km * emisFactor(factors, r.vehicle_type);     // kg
      const disp = fromTonnes(t, unit, r.material_type, r.vehicle_type, factors);
      const k = r.month_index - lo;
      demand[r.material_type][k] += disp;
      tripsM[k] += trips; co2M[k] += co2/1000; tonnesM[k] += t;
      split[r.material_type] += disp;
      totT += t; totTrips += trips; totKm += km; totCo2 += co2/1000;
      const a = rAgg[r.route_id] || (rAgg[r.route_id] = { route_id:r.route_id, ipt:route.ipt||"—", dist, t:0, trips:0, km:0, co2:0, monthly:{} });
      a.t += t; a.trips += trips; a.km += km; a.co2 += co2/1000;
      a.monthly[r.month_index] = (a.monthly[r.month_index]||0) + trips;
    });
    const routeRows = Object.values(rAgg).map(a => {
      const round = a.dist*2;
      const cycleH = P.avg_haul_speed_kmh>0 ? (round/P.avg_haul_speed_kmh + (P.load_minutes+P.unload_minutes)/60) : 0;
      const mv = Object.values(a.monthly);
      const peakMonthTrips = mv.length ? Math.max(...mv) : 0;
      const peakPerDay = P.working_days_per_month>0 ? peakMonthTrips/P.working_days_per_month : 0;
      const intensity = a.t>0 ? (a.co2*1000/a.t) : 0;
      return { ...a, cycleH, peakPerDay, intensity };
    });
    let peakIdx = 0; for(let i=1;i<n;i++) if(tonnesM[i]>tonnesM[peakIdx]) peakIdx = i;
    const peakMonth = tonnesM.some(x=>x>0) ? labels[peakIdx] : "—";
    return {
      lo, hi, labels, mats, demand, tripsM, co2M, split, routeRows,
      kpis: { totT, totTrips, totKm, totCo2, intensity: totT>0 ? totCo2*1000/totT : 0, peakMonth },
      empty: filtered.length===0
    };
  }, [rows, status, material, vehicle, fromM, toM, unit, factors, months, routesById]);

  if(err) return <div className="p-8 text-center text-slate-500">Couldn't load forecast data.</div>;
  if(!rows || !D) return <div className="p-8 text-center text-slate-400">Loading dashboard…</div>;

  const sortedRoutes = [...D.routeRows].sort((a,b) => {
    const dir = sortDir==="asc" ? 1 : -1;
    return (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * dir;
  });
  const setSort = (k) => { if(sortKey===k) setSortDir(d => d==="asc"?"desc":"asc"); else { setSortKey(k); setSortDir("desc"); } };
  const arrow = (k) => sortKey===k ? (sortDir==="asc" ? " ▲" : " ▼") : "";

  const commonOpts = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ display:false } } };
  const barScales = { scales:{ x:{ grid:{ display:false } }, y:{ ticks:{ font:{ size:11 } } } } };
  const stackedOpts = { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:"bottom", labels:{ boxWidth:10, font:{ size:11 } } } }, scales:{ x:{ stacked:true, grid:{ display:false } }, y:{ stacked:true, ticks:{ font:{ size:11 } } } } };

  const demandCfg = { type:"bar", data:{ labels:D.labels, datasets:D.mats.map((m,i)=>({ label:m, data:D.demand[m], backgroundColor:colorOf(i), stack:"s", borderWidth:0 })) }, options:stackedOpts };
  const tripsCfg  = { type:"bar", data:{ labels:D.labels, datasets:[{ label:"Trips", data:D.tripsM, backgroundColor:"#003787", borderWidth:0 }] }, options:{ ...commonOpts, ...barScales } };
  const co2Cfg    = { type:"line", data:{ labels:D.labels, datasets:[{ label:"tCO₂e", data:D.co2M, borderColor:"#039E86", backgroundColor:"rgba(3,158,134,.12)", fill:true, tension:.3, pointRadius:2 }] }, options:{ ...commonOpts, ...barScales } };
  const splitCfg  = { type:"doughnut", data:{ labels:D.mats, datasets:[{ data:D.mats.map(m=>D.split[m]), backgroundColor:D.mats.map((m,i)=>colorOf(i)), borderWidth:2, borderColor:"#fff" }] }, options:{ responsive:true, maintainAspectRatio:false, cutout:"62%", plugins:{ legend:{ position:"right", labels:{ boxWidth:10, font:{ size:11 } } } } } };
  const topN = [...D.routeRows].sort((a,b)=>b.t-a.t).slice(0,10);
  const topCfg = { type:"bar", data:{ labels:topN.map(r=>r.route_id), datasets:[{ label:"tonnes", data:topN.map(r=>r.t), backgroundColor:"#3398DB", borderWidth:0 }] }, options:{ indexAxis:"y", ...commonOpts, scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:10 } } }, y:{ ticks:{ font:{ size:9 } } } } } };

  const sel = "border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm bg-white";
  const numTd = "px-3 py-2 text-right tabular-nums";

  return (
    <div className="max-w-7xl mx-auto p-5 space-y-5">
      <div className="flex items-end justify-between flex-wrap gap-3">
        <div>
          <h1 className="text-lg font-bold text-[color:var(--navy-deep)]">Forecast Dashboard</h1>
          <p className="text-sm text-slate-500">Strategic planning view · {D.lo===D.hi ? D.labels[0] : (monthLabelAbs(D.lo,months.start_year)+" – "+monthLabelAbs(D.hi,months.start_year))} · {status==="All" ? "all forecasts" : status.toLowerCase()+" only"}</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <select className={sel} value={status} onChange={e=>setStatus(e.target.value)}>{["Approved","Pending","All"].map(s=><option key={s}>{s}</option>)}</select>
          <select className={sel} value={unit} onChange={e=>setUnit(e.target.value)}>{units.map(u=><option key={u} value={u}>{u==="t"?"tonnes":u==="m3"?"m³":"vehicles"}</option>)}</select>
          <select className={sel} value={material} onChange={e=>setMaterial(e.target.value)}><option>All</option>{materials.map(m=><option key={m}>{m}</option>)}</select>
          <select className={sel} value={vehicle} onChange={e=>setVehicle(e.target.value)}><option>All</option>{vehicles.map(v=><option key={v}>{v}</option>)}</select>
          <select className={sel} value={fromM} onChange={e=>setFromM(+e.target.value)}>{Array.from({length:months.count},(_,i)=>i+1).map(i=><option key={i} value={i}>{monthLabelAbs(i,months.start_year)}</option>)}</select>
          <span className="self-center text-slate-400 text-sm">→</span>
          <select className={sel} value={toM} onChange={e=>setToM(+e.target.value)}>{Array.from({length:months.count},(_,i)=>i+1).map(i=><option key={i} value={i}>{monthLabelAbs(i,months.start_year)}</option>)}</select>
        </div>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
        <Kpi label="Total material" value={Math.round(D.kpis.totT).toLocaleString()} sub="tonnes" />
        <Kpi label="Total trips" value={Math.round(D.kpis.totTrips).toLocaleString()} sub="loaded runs" />
        <Kpi label="Truck-km" value={Math.round(D.kpis.totKm).toLocaleString()} sub="round trips" />
        <Kpi label="CO₂e" value={D.kpis.totCo2.toFixed(1)} sub="tonnes" />
        <Kpi label="Intensity" value={D.kpis.intensity.toFixed(1)} sub="kg / tonne" />
        <Kpi label="Peak month" value={D.kpis.peakMonth} sub="by tonnage" small />
      </div>

      {D.empty && <div className="card p-6 text-center text-slate-500 text-sm">No forecasts match these filters.</div>}

      <div className="grid lg:grid-cols-3 gap-4">
        <div className="card p-4 lg:col-span-3">
          <div className="text-sm font-semibold text-slate-700 mb-1">Material demand over time <span className="text-slate-400 font-normal">({unitLabel})</span></div>
          <ChartCanvas config={demandCfg} height={260} />
        </div>
        <div className="card p-4">
          <div className="text-sm font-semibold text-slate-700 mb-1">Vehicle trips over time</div>
          <ChartCanvas config={tripsCfg} height={240} />
        </div>
        <div className="card p-4">
          <div className="text-sm font-semibold text-slate-700 mb-1">Carbon over time <span className="text-slate-400 font-normal">(tCO₂e)</span></div>
          <ChartCanvas config={co2Cfg} height={240} />
        </div>
        <div className="card p-4">
          <div className="text-sm font-semibold text-slate-700 mb-1">Material split <span className="text-slate-400 font-normal">({unitLabel})</span></div>
          <ChartCanvas config={splitCfg} height={240} />
        </div>
        <div className="card p-4 lg:col-span-3">
          <div className="text-sm font-semibold text-slate-700 mb-1">Top routes by tonnage</div>
          <ChartCanvas config={topCfg} height={300} />
        </div>
      </div>

      <div className="card overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 text-sm font-semibold text-slate-700">Route planning detail <span className="text-slate-400 font-normal">· click a column to sort</span></div>
        <div className="overflow-auto">
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs">
              <tr>
                <th className="px-3 py-2 text-left font-semibold cursor-pointer select-none" onClick={()=>setSort("route_id")}>Route{arrow("route_id")}</th>
                <th className="px-3 py-2 text-left font-semibold">IPT</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("dist")}>Dist km{arrow("dist")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("cycleH")}>Cycle h{arrow("cycleH")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("t")}>Tonnes{arrow("t")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("trips")}>Trips{arrow("trips")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("km")}>Truck-km{arrow("km")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("co2")}>tCO₂e{arrow("co2")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("intensity")}>kg/t{arrow("intensity")}</th>
                <th className="px-3 py-2 text-right font-semibold cursor-pointer select-none" onClick={()=>setSort("peakPerDay")}>Peak/day{arrow("peakPerDay")}</th>
              </tr>
            </thead>
            <tbody>
              {sortedRoutes.map(r => (
                <tr key={r.route_id} className="border-t border-slate-100 hover:bg-slate-50">
                  <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">{r.route_id}</td>
                  <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{r.ipt}</td>
                  <td className={numTd}>{r.dist.toFixed(1)}</td>
                  <td className={numTd}>{r.cycleH.toFixed(2)}</td>
                  <td className={numTd}>{Math.round(r.t).toLocaleString()}</td>
                  <td className={numTd}>{Math.round(r.trips).toLocaleString()}</td>
                  <td className={numTd}>{Math.round(r.km).toLocaleString()}</td>
                  <td className={numTd}>{r.co2.toFixed(1)}</td>
                  <td className={numTd}>{r.intensity.toFixed(1)}</td>
                  <td className={numTd}>{r.peakPerDay.toFixed(1)}</td>
                </tr>
              ))}
              {sortedRoutes.length===0 && <tr><td colSpan="10" className="px-3 py-6 text-center text-slate-400">No routes in range.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>

      <p className="text-xs text-slate-400 px-1">Planning estimates only — no live deliveries or tracking. Distances from routed road geometry; carbon from DEFRA-2025-based factors in backend/factors.json (round trip: loaded out, empty return). Cycle time = drive + load/unload handling.</p>
    </div>
  );
}

// ================================================================= App
function App(){
  const [view, setView] = useState("public");   // public | login | portal
  const [role, setRole] = useState(null);
  const [who, setWho] = useState(() => { try { return localStorage.getItem("rbe_who") || ""; } catch(e){ return ""; } });
  const [meta, setMeta] = useState(null);
  const [metaErr, setMetaErr] = useState(false);

  useEffect(() => {
    fetch(`${API}/meta`).then(r => r.json()).then(setMeta).catch(() => setMetaErr(true));
  }, []);

  const signIn = (r, name) => {
    const n = (name || "").trim();
    setRole(r); setWho(n);
    try { localStorage.setItem("rbe_who", n); } catch(e){}
    setView("portal");
  };
  const signOut = () => { setRole(null); setView("public"); };

  return (
    <div className="h-full flex flex-col">
      <Header view={view} role={role} setView={setView} signOut={signOut} />
      <main className="flex-1 min-h-0 flex flex-col">
        {view === "public" && <PublicMap onLogin={() => setView("login")} />}
        {view === "login" && <Login onSignIn={signIn} onBack={() => setView("public")} savedName={who} />}
        {view === "portal" && (
          <Portal role={role} who={who} meta={meta} metaErr={metaErr} />
        )}
      </main>
    </div>
  );
}

// ================================================================= Header
function Header({ view, role, setView, signOut }){
  return (
    <header className="brand-bar text-white shrink-0">
      <div className="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
        <button onClick={() => setView(role ? "portal" : "public")} className="flex items-center gap-3 text-left">
          <span className="inline-block w-2.5 h-7 rounded-sm" style={{background:"var(--gold)"}}></span>
          <span>
            <span className="block font-extrabold tracking-tight leading-none text-[17px]">RBE Alliance 1 Logistics</span>
            <span className="block text-[11px] uppercase tracking-[0.18em] text-white/60">Rail Baltica · Forecasting &amp; Route Map</span>
          </span>
        </button>
        <div className="flex items-center gap-2 text-sm">
          {view === "public" && (
            <button onClick={() => setView("login")}
              className="px-4 py-2 rounded-md bg-white/10 hover:bg-white/20 font-medium transition">
              Staff sign in
            </button>
          )}
          {role && (
            <>
              <span className="hidden sm:inline text-white/70 mr-1">{role}</span>
              <button onClick={signOut}
                className="px-4 py-2 rounded-md bg-white/10 hover:bg-white/20 font-medium transition">
                Sign out
              </button>
            </>
          )}
        </div>
      </div>
    </header>
  );
}

// ================================================================= Public map
function PublicMap({ onLogin }){
  return (
    <div className="flex-1 min-h-0 flex flex-col">
      <div className="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center justify-between">
        <p className="text-sm text-slate-600">
          <span className="font-semibold text-[color:var(--navy)]">Public Route Map</span>
          <span className="mx-2 text-slate-300">·</span>
          Approved haul-route forecasts. Toggle <span className="font-medium">Show Forecast Routes</span> in the map panel.
        </p>
        <button onClick={onLogin} className="text-sm text-[color:var(--blue)] hover:underline font-medium">
          Submit a forecast →
        </button>
      </div>
      <iframe src={MAP_URL} title="Public Route Map" className="flex-1 w-full border-0" />
    </div>
  );
}

// ================================================================= Login
function Login({ onSignIn, onBack, savedName }){
  const [pw, setPw] = useState("");
  const [name, setName] = useState(savedName || "");
  const [err, setErr] = useState("");
  const submit = () => {
    const r = LOGINS[pw.trim()];
    if(!r){ setErr("That access code isn't recognised."); return; }
    if(!name.trim()){ setErr("Please enter your name."); return; }
    setErr(""); onSignIn(r, name);
  };
  return (
    <div className="flex-1 grid place-items-center px-5">
      <div className="w-full max-w-sm bg-white rounded-xl shadow-sm border border-slate-200 p-7">
        <h1 className="text-xl font-bold text-[color:var(--navy-deep)]">Staff sign in</h1>
        <p className="text-sm text-slate-500 mt-1 mb-5">Enter your name and access code to submit or approve forecasts.</p>
        <input
          type="text" value={name} autoFocus
          onChange={e => setName(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Your name"
          className="w-full border border-slate-300 rounded-lg px-3 py-2.5 mb-2.5 outline-none focus:ring-2 focus:ring-[color:var(--blue)]"
        />
        <input
          type="password" value={pw}
          onChange={e => setPw(e.target.value)}
          onKeyDown={e => e.key === "Enter" && submit()}
          placeholder="Access code"
          className="w-full border border-slate-300 rounded-lg px-3 py-2.5 outline-none focus:ring-2 focus:ring-[color:var(--blue)]"
        />
        {err && <p className="text-sm mt-2" style={{color:"var(--red)"}}>{err}</p>}
        <button onClick={submit}
          className="w-full mt-4 py-2.5 rounded-lg text-white font-semibold transition"
          style={{background:"var(--navy)"}}>
          Sign in
        </button>
        <button onClick={onBack} className="w-full mt-2 py-2 text-sm text-slate-500 hover:text-slate-700">
          Back to public map
        </button>
        <p className="text-[11px] text-slate-400 mt-5 leading-relaxed">
          Demo codes — Submitter: <code>submitter123</code>, Planner: <code>planner123</code>, Admin: <code>admin123</code>.
          Replace with real authentication before production use.
        </p>
      </div>
    </div>
  );
}

// ================================================================= Portal (tabbed)
function Portal({ role, who, meta, metaErr }){
  const canApprove = CAN_APPROVE[role];
  const tabs = ["Dashboard", "Forecast Matrix", "My submissions", ...(canApprove ? ["Approvals", "Data Management"] : []), "Public Route Map"];
  const [tab, setTab] = useState("Dashboard");
  const [editTarget, setEditTarget] = useState(null);   // {routeId, year} handed to the Matrix

  if(metaErr){
    return <div className="p-8 text-center text-slate-600">
      Couldn't reach the forecasting service. Refresh the page; if it persists the server may still be starting.
    </div>;
  }
  if(!meta) return <div className="p-8 text-center text-slate-400">Loading…</div>;

  const editInMatrix = (target) => { setEditTarget(target); setTab("Forecast Matrix"); };

  return (
    <div className="flex-1 min-h-0 flex flex-col">
      <nav className="bg-white border-b border-slate-200 px-5">
        <div className="max-w-7xl mx-auto flex gap-1">
          {tabs.map(t => (
            <button key={t} onClick={() => setTab(t)}
              className={"px-4 py-3 text-sm font-medium border-b-2 -mb-px transition " +
                (tab === t
                  ? "border-[color:var(--navy)] text-[color:var(--navy)]"
                  : "border-transparent text-slate-500 hover:text-slate-800")}>
              {t}
            </button>
          ))}
        </div>
      </nav>
      <div className="flex-1 min-h-0 overflow-auto">
        {tab === "Dashboard" && <Dashboard meta={meta} />}
        {tab === "Forecast Matrix" && <Matrix meta={meta} who={who} editTarget={editTarget} />}
        {tab === "My submissions" && <MySubmissions meta={meta} who={who} onEdit={editInMatrix} />}
        {tab === "Approvals" && canApprove && <Approvals />}
        {tab === "Data Management" && canApprove && <DataManagement meta={meta} who={who} />}
        {tab === "Public Route Map" && (
          <iframe src={MAP_URL} title="Public Route Map" className="w-full h-full border-0" />
        )}
      </div>
    </div>
  );
}

// ================================================================= Matrix
function Matrix({ meta, who, editTarget }){
  const { routes, materials, vehicles, units, months, factors,
          material_categories = {}, seasonal_restrictions = [] } = meta;

  const GUESS_TO_CAT = { "soil":"Earthworks / soil", "sand":"Small aggregate", "gravel":"Small aggregate",
    "limestone - rockfill":"Large aggregate / ballast", "limestone (shale aggregate)":"Small aggregate",
    "imported goods":"General / imported" };

  // ---- origin -> destination -> route reference ----
  const origins = useMemo(() => [...new Set(routes.map(r => r.origin).filter(Boolean))].sort(), [routes]);
  const [origin, setOrigin] = useState(origins[0] || "");
  const destsForOrigin = useMemo(
    () => [...new Set(routes.filter(r => r.origin === origin).map(r => r.dest).filter(Boolean))].sort(),
    [routes, origin]);
  const [dest, setDest] = useState("");
  useEffect(() => { if(!destsForOrigin.includes(dest)) setDest(destsForOrigin[0] || ""); }, [origin]);
  const matchingRoutes = useMemo(
    () => routes.filter(r => r.origin === origin && r.dest === dest), [routes, origin, dest]);
  const [routeId, setRouteId] = useState("");
  useEffect(() => { if(!matchingRoutes.some(r => r.route_id === routeId)) setRouteId(matchingRoutes[0]?.route_id || ""); }, [origin, dest]);
  const route = routes.find(r => r.route_id === routeId);

  // apply an "edit this submission" request from the My submissions page
  useEffect(() => {
    if(!editTarget || !editTarget.routeId) return;
    const r = routes.find(x => x.route_id === editTarget.routeId);
    if(!r) return;
    setOrigin(r.origin || "");
    setDest(r.dest || "");
    setRouteId(editTarget.routeId);
    if(editTarget.year) setYear(editTarget.year);
  }, [editTarget]);

  // ---- material category + free-text detail ----
  const [material, setMaterial] = useState(materials[0] || "");
  const [description, setDescription] = useState("");
  const cat = material_categories[material] || {};
  const suggestedVehicles = (cat.vehicles && cat.vehicles.length) ? cat.vehicles : vehicles;
  const volumeOk = cat.volume_convertible !== false;

  // ---- vehicles (with optional second vehicle + split) ----
  const [vehicle, setVehicle] = useState(vehicles[0] || "");
  const [useTwo, setUseTwo] = useState(false);
  const [vehicle2, setVehicle2] = useState("");
  const [split, setSplit] = useState(70);
  const [unit, setUnit] = useState(units[0] || "m3");
  const [year, setYear] = useState(months.years[0]);
  const [vals, setVals] = useState({});
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  // default the category from the route's material guess when the route resolves
  useEffect(() => {
    if(!route) return;
    const c = GUESS_TO_CAT[(route.material_guess || "").trim().toLowerCase()];
    if(c && materials.includes(c)) setMaterial(c);
  }, [routeId]);

  // category change -> sensible default unit + primary vehicle
  useEffect(() => {
    setUnit(u => (u === "m3" && !volumeOk) ? (cat.default_unit || "t") : u);
    setVehicle(v => suggestedVehicles.includes(v) ? v : (suggestedVehicles[0] || v));
  }, [material]);

  // dual-vehicle forces a mass/volume unit (a 'vehicles' input is ambiguous with a mix)
  useEffect(() => {
    if(useTwo){
      if(!vehicle2) setVehicle2(suggestedVehicles.find(v => v !== vehicle) || vehicles.find(v => v !== vehicle) || "");
      if(unit === "vehicles") setUnit(volumeOk ? (cat.default_unit || "t") : "t");
    }
  }, [useTwo]);

  // load saved cells for route+year
  useEffect(() => {
    let live = true;
    if(!routeId){ setVals({}); return; }
    fetch(`${API}/forecasts`).then(r => r.json()).then(rows => {
      if(!live) return;
      const base = (year - months.start_year) * 12;
      const mine = rows.filter(x => x.route_id === routeId && x.month_index > base && x.month_index <= base + 12);
      const next = {};
      mine.forEach(x => { next[x.month_index - base] = String(x.quantity); });
      setVals(next);
      const first = mine[0];
      if(first){
        if(first.unit) setUnit(first.unit);
        if(first.material_type && materials.includes(first.material_type)) setMaterial(first.material_type);
        if(first.vehicle_type) setVehicle(first.vehicle_type);
        setDescription(first.material_description || "");
        if(first.vehicle_type_2){ setUseTwo(true); setVehicle2(first.vehicle_type_2); setSplit(first.split_pct ?? 70); }
        else setUseTwo(false);
      }
    }).catch(() => {});
    return () => { live = false; };
  }, [routeId, year]);

  const setMonth = (m, v) => setVals(s => ({ ...s, [m]: v }));

  const p1 = payload(factors, vehicle);
  const p2 = payload(factors, vehicle2);
  const s = Math.max(0, Math.min(100, split)) / 100;
  const effPayload = (useTwo && vehicle2) ? (1 / (s / p1 + (1 - s) / p2)) : p1;
  const allowedUnits = units.filter(u => (u !== "m3" || volumeOk) && (u !== "vehicles" || !(useTwo && vehicle2)));

  const totalUnit = Object.values(vals).reduce((a, b) => a + (+b || 0), 0);
  const totalT = Object.entries(vals).reduce((a, [, q]) => a + toTonnes(q, unit, material, vehicle, factors), 0);
  const totalVeh = totalT / (effPayload || 1);

  const warnings = useMemo(() => {
    const entered = new Set(Object.keys(vals).filter(m => +vals[m] > 0).map(Number));
    return (seasonal_restrictions || [])
      .filter(w => (w.months || []).some(m => entered.has(m)))
      .map(w => {
        const rv = w.restricted_vehicles || [];
        const hit = rv.length === 0 || rv.includes(vehicle) || (useTwo && rv.includes(vehicle2));
        return hit ? w.message : null;
      })
      .filter(Boolean);
  }, [vals, vehicle, vehicle2, useTwo, seasonal_restrictions]);

  const save = () => {
    if(!routeId){ setMsg({ ok: false, text: "Pick an origin and destination that map to a route first." }); return; }
    setBusy(true); setMsg(null);
    const base = (year - months.start_year) * 12;
    const cells = [];
    for(let m = 1; m <= 12; m++) cells.push({ month_index: base + m, quantity: +vals[m] || 0 });
    fetch(`${API}/forecasts/bulk`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        route_id: routeId, material_type: material, material_description: description || null,
        vehicle_type: vehicle, vehicle_type_2: (useTwo && vehicle2) ? vehicle2 : null,
        split_pct: (useTwo && vehicle2) ? split : 100, submitted_by: who || null,
        unit, cells, status: "Pending",
      }),
    })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(() => setMsg({ ok: true, text: `Saved ${year} forecast for ${routeId}. Sent for approval.` }))
      .catch(e => setMsg({ ok: false, text: `Couldn't save (${e}). Try again.` }))
      .finally(() => setBusy(false));
  };
  const clearYear = () => setVals({});

  return (
    <div className="max-w-7xl mx-auto p-5">
      <div className="mb-4">
        <h2 className="text-lg font-bold text-[color:var(--navy-deep)]">Forecast matrix</h2>
        <p className="text-sm text-slate-500">Choose where the material moves from and to — the route reference fills in automatically.</p>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label="Origin">
            <select value={origin} onChange={e => setOrigin(e.target.value)} className={selCls}>
              {origins.map(o => <option key={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Destination">
            <select value={dest} onChange={e => setDest(e.target.value)} className={selCls}>
              {destsForOrigin.map(d => <option key={d}>{d}</option>)}
            </select>
          </Field>
          <Field label="Route reference">
            {matchingRoutes.length > 1 ? (
              <select value={routeId} onChange={e => setRouteId(e.target.value)} className={selCls}>
                {matchingRoutes.map(r => <option key={r.route_id} value={r.route_id}>{r.route_id}{r.ipt ? ` · ${r.ipt}` : ""}</option>)}
              </select>
            ) : (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm font-medium text-slate-700 truncate">
                {routeId || <span className="text-slate-400">No route for this pair</span>}
              </div>
            )}
          </Field>
        </div>
        {route && route.distance_km ? (
          <p className="text-xs text-slate-400 -mt-1">{route.ipt || "—"} · {route.distance_km} km one-way</p>
        ) : null}

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Material category">
            <select value={material} onChange={e => setMaterial(e.target.value)} className={selCls}>
              {materials.map(m => <option key={m}>{m}</option>)}
            </select>
          </Field>
          <Field label="Material description (optional)">
            <input value={description} onChange={e => setDescription(e.target.value)}
              placeholder="e.g. MOT Type 1 sub-base" className={selCls} />
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label={useTwo ? "Vehicle 1" : "Vehicle"}>
            <select value={vehicle} onChange={e => setVehicle(e.target.value)} className={selCls}>
              {vehicles.map(v => <option key={v}>{v}</option>)}
            </select>
          </Field>
          <Field label="Input unit">
            <select value={unit} onChange={e => setUnit(e.target.value)} className={selCls}>
              {allowedUnits.map(u => <option key={u} value={u}>{u === "m3" ? "m³" : u === "t" ? "tonnes" : "vehicles"}</option>)}
            </select>
          </Field>
        </div>

        <div className="rounded-lg border border-slate-200 p-3">
          <label className="flex items-center gap-2 text-sm font-medium text-slate-700">
            <input type="checkbox" checked={useTwo} onChange={e => setUseTwo(e.target.checked)} style={{accentColor:"#003787"}} />
            Split the load across a second vehicle
          </label>
          {useTwo && (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-3">
              <Field label="Vehicle 2">
                <select value={vehicle2} onChange={e => setVehicle2(e.target.value)} className={selCls}>
                  {vehicles.filter(v => v !== vehicle).map(v => <option key={v}>{v}</option>)}
                </select>
              </Field>
              <div>
                <span className="text-[11px] uppercase tracking-wide text-slate-400">Split · {split}% {vehicle} / {100 - split}% {vehicle2}</span>
                <input type="range" min="0" max="100" step="5" value={split} onChange={e => setSplit(+e.target.value)}
                  className="w-full mt-2" style={{accentColor:"#003787"}} />
              </div>
            </div>
          )}
        </div>

        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <Field label="Year">
            <select value={year} onChange={e => setYear(+e.target.value)} className={selCls}>
              {months.years.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </Field>
        </div>

        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
          {MONTHS.map((mn, i) => (
            <label key={mn} className="block">
              <span className="text-[11px] uppercase tracking-wide text-slate-400">{mn}</span>
              <input type="number" min="0" inputMode="decimal"
                value={vals[i + 1] ?? ""} onChange={e => setMonth(i + 1, e.target.value)} placeholder="0"
                className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
            </label>
          ))}
        </div>

        {warnings.length > 0 && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800 space-y-1">
            {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
          </div>
        )}

        <div className="rounded-lg bg-slate-50 border border-slate-200 p-4 flex flex-wrap gap-x-8 gap-y-2 text-sm">
          <Stat label={`Year total (${unit === "m3" ? "m³" : unit})`} value={fmt(totalUnit, unit)} />
          <Stat label="≈ tonnes" value={fmt(totalT, "t")} />
          <Stat label="≈ vehicle loads" value={fmt(totalVeh, "vehicles")} tone="var(--navy)" />
          <span className="text-xs text-slate-400 self-center">
            {volumeOk ? `${density(factors, material)} t/m³ · ` : ""}
            {useTwo && vehicle2 ? `blended ${effPayload.toFixed(1)} t/load` : `${payload(factors, vehicle)} t/load`}
          </span>
        </div>

        <div className="flex items-center gap-3">
          <button onClick={save} disabled={busy || !routeId}
            className="px-5 py-2.5 rounded-lg text-white font-semibold disabled:opacity-50 transition"
            style={{background:"var(--navy)"}}>
            {busy ? "Saving…" : "Save & send for approval"}
          </button>
          <button onClick={clearYear} className="px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm">
            Clear year
          </button>
          {msg && <span className="text-sm font-medium" style={{color: msg.ok ? "var(--green)" : "var(--red)"}}>{msg.text}</span>}
        </div>
      </div>
    </div>
  );
}

// ================================================================= My submissions
function MySubmissions({ meta, who, onEdit }){
  const { routes, months } = meta;
  const routeById = useMemo(() => Object.fromEntries(routes.map(r => [r.route_id, r])), [routes]);
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(false);
  const [tick, setTick] = useState(0);

  useEffect(() => {
    if(!who){ setRows([]); return; }
    let live = true;
    fetch(`${API}/forecasts?submitted_by=${encodeURIComponent(who)}`)
      .then(r => r.json()).then(rs => { if(live) setRows(rs); })
      .catch(() => setErr(true));
    return () => { live = false; };
  }, [who, tick]);

  const groups = useMemo(() => {
    if(!rows) return [];
    const g = {};
    rows.forEach(r => {
      const year = months.start_year + Math.floor((r.month_index - 1) / 12);
      const key = r.route_id + "|" + year;
      const e = g[key] || (g[key] = {
        routeId: r.route_id, year, statuses: new Set(), material: r.material_type,
        material_description: r.material_description, vehicle: r.vehicle_type,
        vehicle2: r.vehicle_type_2, unit: r.unit, months: 0,
      });
      e.statuses.add(r.status); e.months += 1;
    });
    return Object.values(g)
      .map(e => ({ ...e, status: e.statuses.size === 1 ? [...e.statuses][0] : "Mixed" }))
      .sort((a, b) => (a.year - b.year) || a.routeId.localeCompare(b.routeId));
  }, [rows, months]);

  const withdraw = (routeId, year) => {
    if(!confirm(`Withdraw your ${year} forecast for ${routeId}?`)) return;
    const base = (year - months.start_year) * 12;
    const qs = `submitted_by=${encodeURIComponent(who)}&from=${base + 1}&to=${base + 12}`;
    fetch(`${API}/forecasts/${encodeURIComponent(routeId)}?${qs}`, { method: "DELETE" })
      .then(() => setTick(t => t + 1)).catch(() => {});
  };

  const badge = (s) => {
    const map = {
      Approved: ["var(--green)", "rgba(3,158,134,.12)"], Rejected: ["var(--red)", "rgba(191,46,85,.12)"],
      Pending: ["#B45309", "rgba(217,119,6,.12)"], Mixed: ["#475569", "rgba(71,85,105,.12)"],
    };
    const [c, bg] = map[s] || map.Mixed;
    return <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ color: c, background: bg }}>{s}</span>;
  };

  if(!who) return <div className="max-w-3xl mx-auto p-8 text-center text-slate-500">Sign in with your name to see and edit your submissions.</div>;
  if(err) return <div className="p-8 text-center text-slate-500">Couldn't load your submissions.</div>;
  if(!rows) return <div className="p-8 text-center text-slate-400">Loading your submissions…</div>;

  return (
    <div className="max-w-7xl mx-auto p-5">
      <div className="mb-4">
        <h2 className="text-lg font-bold text-[color:var(--navy-deep)]">My submissions</h2>
        <p className="text-sm text-slate-500">Forecasts submitted as <span className="font-medium text-slate-700">{who}</span>. Edit re-opens a route in the matrix; a revised forecast is re-sent for approval.</p>
      </div>

      {groups.length === 0 ? (
        <div className="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500">
          You haven't submitted any forecasts yet. Head to the <span className="font-medium">Forecast Matrix</span> to add one.
        </div>
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="overflow-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-slate-500 text-xs">
                <tr>
                  <th className="px-3 py-2 text-left font-semibold">Route</th>
                  <th className="px-3 py-2 text-left font-semibold">From → to</th>
                  <th className="px-3 py-2 text-left font-semibold">Year</th>
                  <th className="px-3 py-2 text-left font-semibold">Material</th>
                  <th className="px-3 py-2 text-left font-semibold">Vehicle(s)</th>
                  <th className="px-3 py-2 text-center font-semibold">Months</th>
                  <th className="px-3 py-2 text-left font-semibold">Status</th>
                  <th className="px-3 py-2 text-right font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody>
                {groups.map(g => {
                  const r = routeById[g.routeId] || {};
                  return (
                    <tr key={g.routeId + g.year} className="border-t border-slate-100 hover:bg-slate-50">
                      <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">{g.routeId}</td>
                      <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{r.origin || "—"} → {r.dest || "—"}</td>
                      <td className="px-3 py-2 tabular-nums">{g.year}</td>
                      <td className="px-3 py-2 text-slate-600">{g.material}{g.material_description ? <span className="text-slate-400"> · {g.material_description}</span> : null}</td>
                      <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{g.vehicle}{g.vehicle2 ? ` + ${g.vehicle2}` : ""}</td>
                      <td className="px-3 py-2 text-center tabular-nums">{g.months}</td>
                      <td className="px-3 py-2">{badge(g.status)}</td>
                      <td className="px-3 py-2 text-right whitespace-nowrap">
                        <button onClick={() => onEdit({ routeId: g.routeId, year: g.year })}
                          className="text-[color:var(--navy)] font-semibold hover:underline mr-3">Edit</button>
                        <button onClick={() => withdraw(g.routeId, g.year)}
                          className="text-[color:var(--red)] hover:underline">Withdraw</button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ================================================================= Data Management (Phase 1)
// This is the structural view of the network: every route is drawn the same neutral
// navy and the selected one is the only thing highlighted. Material colouring belongs
// on the forecasting dashboard and the public route map, not here.
const ROUTE_COLOR = "#003787";
// pairs HERE could not route — drawn dashed straight so 'impossible' reads differently
// from 'not baked yet', which used to look identical (both simply absent)
const FAILED_COLOR = "#BF2E55";
const MAP_H = "62vh";     // map height — the right-hand column matches it and scrolls inside
const NODE_COLORS = { "Quarry": "#C6841D", "Port": "#003787", "Compound": "#039E86", "Site": "#6D28D9" };

// The two sub-tabs share one map, so instead of toggling layers we lean the styling
// towards whichever half is in focus. Applied on add and re-applied after a basemap swap.
const EMPHASIS = {
  locations: { route: 2, routeOp: 0.45, casingOp: 0.30, node: 7, nodeStroke: 2 },
  routes:    { route: 3, routeOp: 1.00, casingOp: 0.85, node: 5, nodeStroke: 1.5 },
};

function nodeExpr(){
  const e = ["match", ["get", "loc_type"]];
  Object.entries(NODE_COLORS).forEach(([k, v]) => { e.push(k, v); });
  e.push("#64748B");
  return e;
}

  ["Streets", "mapbox://styles/mapbox/streets-v12"],
  ["Outdoors", "mapbox://styles/mapbox/outdoors-v12"],
  ["Dark", "mapbox://styles/mapbox/dark-v11"],
