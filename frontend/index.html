// One vehicle <option>. Pulled out of Matrix so the planning group and the legacy
// group render identically — two copies of this markup would drift, and the disabled
// rule is the part that must not.
//
// Anything outside the material category's own list stays VISIBLE but disabled rather
// than vanishing, so a wrong saved value is obvious instead of silently swapped. The
// currently-selected vehicle is never disabled, or a line saved before a category's
// vehicle list changed could not be re-saved.
function vehOption(v, suggested, current){
  const fits = suggested.includes(v);
  // value = the canonical id, ALWAYS. Only the text follows the language toggle, and a
  // slot that fell back to the id is marked so a fallback is not mistaken for a
  // translation.
  return <option key={v} value={v} disabled={!fits && v !== current}
    style={{ color: fits ? undefined : "#cbd5e1" }}>
    {vehLabel(v)}{vehIsFallback(v) && VEH.lang !== "eu" ? " *" : ""}{fits ? "" : " · not used for this material"}
  </option>;
}

// ================================================================= Matrix
function Matrix({ meta, who, editTarget, vehLang, access }){
  const { routes, materials, vehicles, units, months, factors,
          material_categories = {}, seasonal_restrictions = [],
          disciplines = [], work_sections = [], planning_vehicles = [] } = meta;

  // The four EU-named planning vehicles lead every picker; the six older entries stay
  // below them as legacy. Kept as two lists rather than a re-ordered `vehicles`,
  // because every saved forecast and every baked route names a vehicle by string and
  // the full set has to remain complete. Defaults to empty, so an older /api/meta that
  // does not send planning_vehicles renders exactly the pre-2026-09-01 single list.
  const legacyVehicles = useMemo(
    () => vehicles.filter(v => !planning_vehicles.includes(v)), [vehicles, planning_vehicles]);

  const GUESS_TO_CAT = { "soil":"Earthworks / soil", "sand":"Small aggregate", "gravel":"Small aggregate",
    "limestone - rockfill":"Large aggregate / ballast", "limestone (shale aggregate)":"Small aggregate",
    "imported goods":"General / imported" };

  // ---- origin -> destination -> route reference ----
  const origins = useMemo(() => [...new Set(routes.map(r => r.origin).filter(Boolean))].sort(), [routes]);
  const [origin, setOrigin] = useState(origins[0] || "");
  const destsForOrigin = useMemo(
    () => [...new Set(routes.filter(r => r.origin === origin).map(r => r.dest).filter(Boolean))].sort(),
    [routes, origin]);
  const [dest, setDest] = useState("");
  useEffect(() => { if(!destsForOrigin.includes(dest)) setDest(destsForOrigin[0] || ""); }, [origin]);
  const matchingRoutes = useMemo(
    () => routes.filter(r => r.origin === origin && r.dest === dest), [routes, origin, dest]);
  const [routeId, setRouteId] = useState("");
  useEffect(() => { if(!matchingRoutes.some(r => r.route_id === routeId)) setRouteId(matchingRoutes[0]?.route_id || ""); }, [origin, dest]);
  const route = routes.find(r => r.route_id === routeId);

  // apply an "edit this submission" request from the Forecasts page
  useEffect(() => {
    if(!editTarget || !editTarget.routeId) return;
    const r = routes.find(x => x.route_id === editTarget.routeId);
    if(!r) return;
    setOrigin(r.origin || "");
    setDest(r.dest || "");
    setRouteId(editTarget.routeId);
    // Forecasts groups a line across every year it covers, so it hands back a
    // span. `year` is the first year and `toYear` the last; an older caller that sends
    // only `year` still opens that one year, which is what it used to do.
    if(editTarget.year){ setFromYear(editTarget.year); setToYear(editTarget.toYear || editTarget.year); }
    // carry the line keys across, or "Edit" would reopen the route on a different
    // discipline and the month cells would load from the wrong line
    if(editTarget.discipline !== undefined) setDiscipline(editTarget.discipline || "");
    if(editTarget.sectionId !== undefined) setSectionId(editTarget.sectionId || "");
  }, [editTarget]);

  // ---- material category + free-text detail ----
  const [material, setMaterial] = useState(materials[0] || "");
  const [description, setDescription] = useState("");
  const cat = material_categories[material] || {};
  const suggestedVehicles = (cat.vehicles && cat.vehicles.length) ? cat.vehicles : vehicles;
  const volumeOk = cat.volume_convertible !== false;

  // ---- discipline + work section ----
  // Both belong on the LINE, not on the route or the location. A lorry of track ballast
  // delivering into a substructure section is still superstructure traffic; and sections
  // overlap, so Tootsi Station sits in WS 12, WS 1 and WS 7.3 at once and no single
  // section can be inferred from the destination.
  const [discipline, setDiscipline] = useState("");
  const [sectionId, setSectionId] = useState("");
  // Task F: which IPT this line belongs to. Locked to the caller's IPT for an IPT code;
  // a planner must pick one — empty until they do, NEVER silently IPT 1. Written on the
  // line and it is what decides who can see it afterwards.
  const iptLocked = !!(access && access.ipt_locked);
  const iptRequired = !!(access && access.ipt_required && !access.demo);
  const [ipt, setIpt] = useState((access && access.ipt) || "");
  const [siblings, setSiblings] = useState([]);   // other lines already on this route
  const [caution, setCaution] = useState(null);   // returned by the save

  // ---- vehicle (exactly one per line) ----
  const [vehicle, setVehicle] = useState(vehicles[0] || "");
  const [unit, setUnit] = useState(units[0] || "m3");

  // ---- year RANGE, not a single year ----------------------------------------
  // One save now covers From year..To year. Nothing about the stored shape changed:
  // the UNIQUE key is still (tenant_id, route_id, month_index, discipline, section_id),
  // there is no `year` column, and MONTH_COUNT is still 60. month_index has always been
  // absolute — 1 = Jan of start_year — and /api/forecasts?route_id= has always returned
  // every month of it. Only the form was ever limited to twelve cells.
  //
  // Default is the CURRENT calendar year alone, falling back to the first year the
  // backend offers if today is outside the horizon (which it will be from 2031).
  const yearsAvail = months.years || [];
  const defaultYear = useMemo(() => {
    const now = new Date().getFullYear();
    return yearsAvail.includes(now) ? now : (yearsAvail[0] || months.start_year);
  }, [yearsAvail, months.start_year]);
  const [fromYear, setFromYear] = useState(defaultYear);
  const [toYear, setToYear] = useState(defaultYear);
  // to >= from, always. Enforced here as well as by the To dropdown only offering
  // years at or after From, because editTarget can set either one directly.
  useEffect(() => { setToYear(t => (t < fromYear ? fromYear : t)); }, [fromYear]);

  const yearsInRange = useMemo(() => {
    const out = [];
    for(let y = fromYear; y <= Math.max(fromYear, toYear); y++) out.push(y);
    return out;
  }, [fromYear, toYear]);

  // The absolute month_index window this form is editing. Everything — load, save,
  // totals, clear — is scoped to it, so narrowing the range cannot touch months
  // outside it and widening it cannot invent them.
  const mLo = (fromYear - months.start_year) * 12 + 1;
  const mHi = (Math.max(fromYear, toYear) - months.start_year) * 12 + 12;

  // vals is keyed by ABSOLUTE month_index now, not 1..12. With more than one year on
  // screen a relative key collides across years — Jan 2026 and Jan 2027 are both "1".
  const [vals, setVals] = useState({});
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  // default the category from the route's material guess when the route resolves.
  // /api/meta now normalises material_guess to a factors.json category server-side, so
  // the value usually arrives already correct; the lookup stays for anything that does not.
  useEffect(() => {
    if(!route) return;
    const raw = (route.material_guess || "").trim();
    if(materials.includes(raw)){ setMaterial(raw); return; }
    const c = GUESS_TO_CAT[raw.toLowerCase()];
    if(c && materials.includes(c)) setMaterial(c);
  }, [routeId]);

  // category change -> sensible default unit + primary vehicle
  useEffect(() => {
    setUnit(u => (u === "m3" && !volumeOk) ? (cat.default_unit || "t") : u);
    setVehicle(v => suggestedVehicles.includes(v) ? v : (suggestedVehicles[0] || v));
  }, [material]);

  // Material categories the chosen discipline actually moves. Advisory, not enforced --
  // the discipline-to-category join is many-to-many and deliberately permissive, and a
  // real delivery that does not fit the seed should be recordable, not blocked.
  const disciplineCats = useMemo(() => {
    const d = (disciplines || []).find(x => x.id === discipline);
    return (d && d.materials) ? d.materials : null;
  }, [discipline, disciplines]);
  const materialFitsDiscipline = !discipline || !disciplineCats
    || disciplineCats.includes(material);

  // when the destination has a default section recorded, offer it as a starting point.
  // It is a pre-fill and nothing more: sections overlap, so the destination cannot know
  // which one a given delivery is for.
  useEffect(() => {
    if(!route || sectionId) return;
    const d = (routes || []).find(r => r.route_id === routeId);
    if(d && d.default_section_id) setSectionId(d.default_section_id);
  }, [routeId]);

  // load saved cells for route+year
  useEffect(() => {
    let live = true;
    if(!routeId){ setVals({}); return; }
    // scoped to this route — this reloads on every route, year, discipline AND section
    // change, and it used to pull the whole forecasts table each time
    fetch(`${API}/forecasts?route_id=${encodeURIComponent(routeId)}`).then(r => r.json()).then(rows => {
      if(!live) return;
      // a route can now carry several lines in the same months, so the cells loaded are
      // the ones for THIS discipline and section, not every row on the route — and
      // every month inside the year RANGE, not one year's twelve
      const mine = rows.filter(x => x.route_id === routeId
        && (x.discipline || "") === discipline
        && (x.section_id || "") === sectionId
        && x.month_index >= mLo && x.month_index <= mHi);
      const next = {};
      mine.forEach(x => { next[x.month_index] = String(x.quantity); });
      setVals(next);
      const first = mine[0];
      if(first){
        if(first.ipt && !iptLocked) setIpt(first.ipt);
        if(first.unit) setUnit(first.unit);
        if(first.material_type && materials.includes(first.material_type)) setMaterial(first.material_type);
        if(first.vehicle_type) setVehicle(first.vehicle_type);
        setDescription(first.material_description || "");
      }
      // other lines already on this route, so a submitter can see them before adding one more
      setSiblings(rows
        .filter(x => x.route_id === routeId
          && !((x.discipline || "") === discipline && (x.section_id || "") === sectionId))
        .reduce((acc, x) => {
          const k = `${x.discipline || ""}|${x.section_id || ""}`;
          if(!acc.some(a => a.k === k)) acc.push({
            k, discipline: x.discipline || "", section_id: x.section_id || "",
            vehicle: x.vehicle_type, submitted_by: x.submitted_by,
          });
          return acc;
        }, []));
    }).catch(() => {});
    return () => { live = false; };
  }, [routeId, fromYear, toYear, discipline, sectionId]);

  const setMonth = (mi, v) => setVals(s => ({ ...s, [mi]: v }));

  // Only the cells inside the current window count. vals is replaced wholesale by the
  // load effect whenever the range moves, so a stale key should never survive — but
  // every total, the save and the seasonal check filter anyway, because a stale key
  // outside the range would be counted in a figure and then not written by the save.
  const inRange = useMemo(
    () => Object.entries(vals)
      .map(([mi, q]) => [+mi, q])
      .filter(([mi]) => mi >= mLo && mi <= mHi),
    [vals, mLo, mHi]);

  // One vehicle per line since Phase 2. A load split across two vehicle types is two
  // lines now, which the widened forecasts key makes storable. The old blended payload
  // averaged two haul cycles that are not close -- an Artic Flatbed turns round in 45
  // minutes against a Tipper's 24 -- and hid that inside a single number.
  const effPayload = payload(factors, vehicle);
  const allowedUnits = units.filter(u => (u !== "m3" || volumeOk));

  // Totals run across the WHOLE range, not one year — the brief's requirement and the
  // only reading that makes sense once a save can cover 2026-2027.
  const totalUnit = inRange.reduce((a, [, q]) => a + (+q || 0), 0);
  const totalT = inRange.reduce((a, [, q]) => a + toTonnes(q, unit, material, vehicle, factors), 0);
  const totalVeh = totalT / (effPayload || 1);

  // Daily rates. A year total tells you nothing about whether a site gate can cope;
  // the peak month divided by working days is the number that sizes the fleet.
  const perDay = useMemo(() => {
    const wd = (factors.planning && factors.planning.working_days_per_month) || 22;
    // Still per WORKING month, and now over the whole range — the average is across
    // the months actually entered, not across every month the range spans. A range of
    // 2026-2030 with three months filled in must not report a twelfth of the traffic.
    //
    // 2026-09-02, §3 of the feedback: six figures, all per working day, all across the
    // selected year range, all over months-with-qty:
    //   vehicles/day  = vehicle-loads (tonnes ÷ payload)   avg and peak month
    //   trips/day     = the same figure. On ONE line with ONE vehicle a trip IS a
    //                   vehicle-load, whatever unit the line was typed in — t and m³
    //                   both convert via the payload, exactly as the brief says. The
    //                   two only diverge on the dashboard, where lines mix vehicles.
    //   material/day  = the typed quantity in the CHOSEN unit, avg and peak month
    const months = inRange.filter(([, q]) => +q > 0);
    if(!months.length || wd <= 0) return { avgT:0, peakT:0, avgVeh:0, peakVeh:0,
      avgTrips:0, peakTrips:0, avgQty:0, peakQty:0, months:0, wd };
    const monthlyT = months.map(([, q]) => toTonnes(q, unit, material, vehicle, factors));
    const monthlyQ = months.map(([, q]) => +q);
    const sum = (a) => a.reduce((x, y) => x + y, 0);
    const avgT = (sum(monthlyT) / months.length) / wd;
    const peakT = Math.max(...monthlyT) / wd;
    const p = effPayload || 1;
    const avgVeh = avgT / p, peakVeh = peakT / p;
    return { avgT, peakT, avgVeh, peakVeh,
      avgTrips: avgVeh, peakTrips: peakVeh,
      avgQty: (sum(monthlyQ) / months.length) / wd, peakQty: Math.max(...monthlyQ) / wd,
      months: months.length, wd };
  }, [inRange, unit, material, vehicle, factors, effPayload]);

  const warnings = useMemo(() => {
    // seasonal_restrictions.months are CALENDAR months 1-12. month_index is absolute,
    // so it has to be folded back — ((mi - 1) % 12) + 1. Reading an absolute index as
    // a calendar month would put Jan 2027 (13) outside every window silently.
    const entered = new Set(inRange.filter(([, q]) => +q > 0).map(([mi]) => ((mi - 1) % 12) + 1));
    return (seasonal_restrictions || [])
      .filter(w => (w.months || []).some(m => entered.has(m)))
      .map(w => {
        const rv = w.restricted_vehicles || [];
        return (rv.length === 0 || rv.includes(vehicle)) ? w.message : null;
      })
      .filter(Boolean);
  }, [inRange, vehicle, seasonal_restrictions]);

  const rangeLabel = fromYear === toYear ? String(fromYear) : `${fromYear}–${toYear}`;

  // ⭐ 2026-09-03 — how many MOVEMENTS one VEHICLE can make per day on THIS route, for
  // THIS vehicle: the baked HERE cycle (laden out, unload, empty back, load), from
  // /api/routes/{id}/analysis — the same figure the dashboard and the map use, so the
  // three surfaces cannot disagree. null = not baked for this vehicle, and the strip
  // then says "not baked" rather than a fleet size.
  const [tripsPerVehicleDay, setTpv] = useState(null);
  useEffect(() => {
    let live = true;
    setTpv(null);
    if(!routeId || !vehicle) return;
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/analysis?profile=${encodeURIComponent(vehicle)}`)
      .then(r => r.ok ? r.json() : null)
      .then(j => {
        if(!live || !j) return;
        const row = (j.rows || []).find(x => x.alt_index === 0 && x.profile === vehicle);
        setTpv(row && row.trips_per_day > 0 ? row.trips_per_day : null);
      }).catch(() => {});
    return () => { live = false; };
  }, [routeId, vehicle]);
  // vehicles needed = movements/day ÷ movements one vehicle can make, rounded UP
  const fleetOf = (movesPerDay) => (tripsPerVehicleDay > 0 ? Math.ceil(movesPerDay / tripsPerVehicleDay) : null);

  const save = () => {
    if(!routeId){ setMsg({ ok: false, text: "Pick an origin and destination that map to a route first." }); return; }
    if(iptRequired && !ipt){ setMsg({ ok: false, text: "Pick which IPT this line belongs to before saving." }); return; }
    setBusy(true); setMsg(null); setCaution(null);
    // ONE POST for the whole range. The backend upserts a cell with a quantity and
    // DELETES one at zero, both on the full widened key, so an emptied month inside
    // the range is cleared and a month outside the range is never mentioned and
    // therefore never touched. Narrowing the range cannot delete another year.
    const cells = [];
    for(let mi = mLo; mi <= mHi; mi++) cells.push({ month_index: mi, quantity: +vals[mi] || 0 });
    fetch(`${API}/forecasts/bulk`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        route_id: routeId, discipline, section_id: sectionId,
        material_type: material, material_description: description || null,
        vehicle_type: vehicle, submitted_by: who || null,
        unit, cells, status: "Pending",
        // the server forces this to the caller's IPT for an IPT code regardless
        ipt: (iptLocked ? access.ipt : ipt) || null,
      }),
    })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        setMsg({ ok: true, text: `Saved ${rangeLabel} forecast for ${routeId}${discipline ? ` · ${discipline}` : ""}. Sent for approval.` });
        // not an error — two disciplines on one route is the case the taxonomy exists
        // for — but two people filling this in separately can double-count the same
        // lorries without ever seeing each other's line
        setCaution(j && j.caution ? j.caution : null);
      })
      .catch(e => setMsg({ ok: false, text: `Couldn't save (${e}). Try again.` }))
      .finally(() => setBusy(false));
  };
  // Clears only what is on screen. With a range open, wiping vals outright would also
  // discard nothing visible — but the name mattered when it said "year", and a future
  // caller that keeps out-of-range keys would silently lose them.
  const clearRange = () => setVals(s => {
    const next = { ...s };
    for(let mi = mLo; mi <= mHi; mi++) delete next[mi];
    return next;
  });

  return (
    <div className="max-w-7xl mx-auto p-5">
      <PageHeader title="Submit forecast"
        subtitle="Choose where the material moves from and to — the route reference fills in automatically. One vehicle per line; a split across two vehicles is two lines." />

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-5 space-y-4">
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label="Origin">
            <select value={origin} onChange={e => setOrigin(e.target.value)} className={selCls}>
              {origins.map(o => <option key={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Destination">
            <select value={dest} onChange={e => setDest(e.target.value)} className={selCls}>
              {destsForOrigin.map(d => <option key={d}>{d}</option>)}
            </select>
          </Field>
          <Field label="Route reference">
            {matchingRoutes.length > 1 ? (
              <select value={routeId} onChange={e => setRouteId(e.target.value)} className={selCls}>
                {matchingRoutes.map(r => <option key={r.route_id} value={r.route_id}>{r.route_id}{r.ipt ? ` · ${r.ipt}` : ""}</option>)}
              </select>
            ) : (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm font-medium text-slate-700 truncate">
                {routeId || <span className="text-slate-400">No route for this pair</span>}
              </div>
            )}
          </Field>
        </div>
        {route ? (
          <p className="text-xs text-slate-400 -mt-1">
            {route.ipt || "—"}
            {route.distance_km != null
              ? <> · {route.distance_km} km one-way{route.distance_profile ? ` (${vehShort(route.distance_profile)})` : ""}</>
              : <span style={{color:"var(--red)"}}> · not baked — no routed distance yet</span>}
          </p>
        ) : null}

        {/* Discipline and section sit on the LINE. Ballast to a substructure section is
            still superstructure traffic, and sections overlap, so neither can be derived
            from the route or the destination. */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
          <Field label={iptRequired ? "IPT (required)" : "IPT"}>
            {iptLocked ? (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm font-medium text-slate-700"
                title="Your access code is for this IPT. Every line you save belongs to it.">
                {access.ipt} <span className="text-slate-400 font-normal">· your IPT</span>
              </div>
            ) : (
              <select value={ipt} onChange={e => setIpt(e.target.value)} className={selCls}>
                <option value="">— pick an IPT —</option>
                {((access && access.ipts) || ["IPT1","IPT2","IPT3","IPT4","IPT5","IPT6"]).map(i => (
                  <option key={i} value={i}>{i.replace(/^IPT/, "IPT ")}</option>
                ))}
              </select>
            )}
          </Field>
          <Field label="Discipline">
            <select value={discipline} onChange={e => setDiscipline(e.target.value)} className={selCls}>
              <option value="">— unassigned —</option>
              {disciplines.map(d => <option key={d.id} value={d.id}>{d.label}</option>)}
            </select>
          </Field>
          <Field label="Work section">
            {work_sections.length ? (
              <select value={sectionId} onChange={e => setSectionId(e.target.value)} className={selCls}>
                <option value="">— unassigned —</option>
                {work_sections.map(s => (
                  <option key={s.section_id} value={s.section_id}>
                    {s.section_id}{s.name ? ` · ${s.name}` : ""}
                  </option>
                ))}
              </select>
            ) : (
              <div className="px-3 py-2 rounded-lg bg-slate-50 border border-slate-200 text-sm text-slate-400 truncate"
                title="Work sections are not seeded yet — their key space is still being settled against the scope document">
                Not configured yet
              </div>
            )}
          </Field>
        </div>

        {!materialFitsDiscipline && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-2.5 text-xs text-amber-800">
            {material} isn't a material normally moved by {discipline}. That may well be
            right — this is advisory, not a rule — but check it is the discipline you meant.
          </div>
        )}

        {siblings.length > 0 && (
          <div className="rounded-lg border border-slate-200 bg-slate-50 p-2.5 text-xs text-slate-600">
            <span className="font-semibold">This route already carries {siblings.length} other forecast line{siblings.length > 1 ? "s" : ""}:</span>{" "}
            {siblings.map(s => `${s.discipline || "unassigned"}${s.section_id ? " / " + s.section_id : ""}${s.submitted_by ? " (" + s.submitted_by + ")" : ""}`).join(" · ")}.
            {" "}Different disciplines on one route are expected — just make sure you aren't counting the same lorries twice.
          </div>
        )}

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Material category">
            <select value={material} onChange={e => setMaterial(e.target.value)} className={selCls}>
              {materials.map(m => <option key={m}>{m}</option>)}
            </select>
          </Field>
          <Field label="Material description (optional)">
            <input value={description} onChange={e => setDescription(e.target.value)}
              placeholder="e.g. MOT Type 1 sub-base" className={selCls} />
          </Field>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
          <Field label="Vehicle">
            {/* Restricted to the vehicles this material category is actually carried in.
                factors.json has carried that list all along — it was only being used to
                pick a DEFAULT, while the dropdown still offered every vehicle, so an
                Artic Flatbed could be chosen for aggregates. Anything outside the list
                stays visible but disabled rather than vanishing, so a wrong saved value
                is obvious instead of silently swapped. */}
            <select value={vehicle} onChange={e => setVehicle(e.target.value)} className={selCls}>
              {planning_vehicles.length > 0 && (
                <optgroup label="Planning vehicles">
                  {planning_vehicles.map(v => vehOption(v, suggestedVehicles, vehicle))}
                </optgroup>
              )}
              {planning_vehicles.length > 0 ? (
                <optgroup label="Other vehicles">
                  {legacyVehicles.map(v => vehOption(v, suggestedVehicles, vehicle))}
                </optgroup>
              ) : vehicles.map(v => vehOption(v, suggestedVehicles, vehicle))}
            </select>
          </Field>
          <Field label="Input unit">
            <select value={unit} onChange={e => setUnit(e.target.value)} className={selCls}>
              {allowedUnits.map(u => <option key={u} value={u}>{u === "m3" ? "m³" : u === "t" ? "tonnes" : "vehicles"}</option>)}
            </select>
          </Field>
        </div>

        <p className="text-[11px] text-slate-400 -mt-1">
          One vehicle per line. If a haul genuinely splits across two vehicle types, save
          it as two lines — that keeps each one's real cycle time, which a blended payload
          used to hide (an Artic Flatbed turns round in 45 minutes, a Tipper in 24).
        </p>

        {/* From year / To year. One save covers the whole range — see the save()
            comment for why widening or narrowing it cannot touch another year's
            months. The To list only offers years at or after From, so `to >= from`
            cannot be entered; the effect above enforces it for programmatic sets. */}
        <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
          <Field label="From year">
            <select value={fromYear} onChange={e => setFromYear(+e.target.value)} className={selCls}>
              {yearsAvail.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </Field>
          <Field label="To year">
            <select value={toYear} onChange={e => setToYear(+e.target.value)} className={selCls}>
              {yearsAvail.filter(y => y >= fromYear).map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </Field>
          <div className="col-span-2 md:col-span-3 self-end text-[11px] text-slate-400 pb-2">
            {yearsInRange.length} year{yearsInRange.length === 1 ? "" : "s"} ·{" "}
            {mHi - mLo + 1} months in one save. Months left blank are cleared.
          </div>
        </div>

        {/* One labelled twelve-cell row per year in the range. The cells are keyed by
            ABSOLUTE month_index — Jan 2026 is 1 and Jan 2027 is 13 — because a
            relative 1..12 key collides between years. */}
        <div className="space-y-4">
          {yearsInRange.map(y => {
            const base = (y - months.start_year) * 12;
            return (
              <div key={y}>
                <div className="flex items-baseline gap-2 mb-1.5">
                  <span className="text-xs font-semibold text-[color:var(--navy-deep)] tabular-nums">{y}</span>
                  <span className="flex-1 border-t border-slate-100" />
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-3">
                  {MONTHS.map((mn, i) => {
                    const mi = base + i + 1;
                    return (
                      <label key={mn} className="block">
                        <span className="text-[11px] uppercase tracking-wide text-slate-400">{mn}</span>
                        <input type="number" min="0" inputMode="decimal"
                          value={vals[mi] ?? ""} onChange={e => setMonth(mi, e.target.value)} placeholder="0"
                          className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                      </label>
                    );
                  })}
                </div>
              </div>
            );
          })}
        </div>

        {warnings.length > 0 && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800 space-y-1">
            {warnings.map((w, i) => <div key={i}>⚠ {w}</div>)}
          </div>
        )}

        {/* The range strip. Totals first, then the six per-working-day cards the
            2026-09-02 feedback asks for: avg and peak of vehicles, trips and material.
            Per WORKING day (factors.planning.working_days_per_month), across the
            selected range, averaged over the months actually entered — a 2026-2030
            range with three months filled in must not report a twelfth of the traffic.
            Peak = the single busiest month ÷ working days; that is what sizes a fleet
            and a site gate, and a range total hides it. */}
        <div className="rounded-lg border border-slate-200 overflow-hidden text-sm">
          <div className="bg-slate-50 p-4 flex flex-wrap gap-x-8 gap-y-2 border-b border-slate-200">
            <Stat label={`${fromYear === toYear ? "Year" : "Range"} total · ${rangeLabel} (${unit === "m3" ? "m³" : unit})`}
              value={fmt(totalUnit, unit)} />
            <Stat label="≈ tonnes" value={fmt(totalT, "t")} />
            <Stat label="≈ vehicle loads" value={fmt(totalVeh, "vehicles")} tone="var(--navy)" />
            <span className="text-xs text-slate-400 self-center">
              {volumeOk ? `${density(factors, material)} t/m³ · ` : ""}
              {`${payload(factors, vehicle)} t/load · ${vehLabel(vehicle)}`}
              {` · ${perDay.wd} working days/month · ${perDay.months} month${perDay.months === 1 ? "" : "s"} with a figure`}
            </span>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-6 divide-x divide-slate-200 text-white kpi-num" style={{ background: "var(--navy)" }}>
            {/* Movements = loads per working day. Vehicles needed = movements ÷ what one
                vehicle can do per day on this route (the baked cycle), rounded up. The
                second is a property of the ROUTE, which is why it reads "not baked"
                until HERE geometry exists for this vehicle. */}
            {[
              ["Avg movements / day",  fmt(perDay.avgTrips, "vehicles"),  ""],
              ["Peak movements / day", fmt(perDay.peakTrips, "vehicles"), "peak"],
              ["Vehicles needed (avg)",  fleetOf(perDay.avgTrips) == null ? "not baked" : String(fleetOf(perDay.avgTrips)),   ""],
              ["Vehicles needed (peak)", fleetOf(perDay.peakTrips) == null ? "not baked" : String(fleetOf(perDay.peakTrips)), "peak"],
              [`Avg ${unit === "m3" ? "m³" : unit === "t" ? "t" : "loads"} / day`,  fmt(perDay.avgQty, unit),  ""],
              [`Peak ${unit === "m3" ? "m³" : unit === "t" ? "t" : "loads"} / day`, fmt(perDay.peakQty, unit), "peak"],
            ].map(([label, value, tone]) => (
              <div key={label} className="px-3 py-2.5">
                <div className="text-[10px] uppercase tracking-wide text-white/60">{label}</div>
                <div className={"text-lg font-bold tabular-nums " + (tone === "peak" ? "text-[color:var(--gold)]" : "")}>{value}</div>
              </div>
            ))}
          </div>
          <div className="px-3 py-1.5 text-[10.5px] text-slate-400 bg-white">
            Movements = loads per working day ({perDay.wd}/month). Vehicles needed = movements ÷{" "}
            {tripsPerVehicleDay > 0
              ? <>the <strong>{tripsPerVehicleDay}</strong> movements one {vehLabel(vehicle)} can make per day on this route (baked cycle), rounded up.</>
              : <>what one vehicle can do per day on this route — <strong>not baked yet for {vehLabel(vehicle)}</strong>, so no fleet size can be given.</>}
          </div>
        </div>

        <div className="flex items-center gap-3">
          <button onClick={save} disabled={busy || !routeId}
            className="px-5 py-2.5 rounded-lg text-white font-semibold disabled:opacity-50 transition"
            style={{background:"var(--navy)"}}>
            {busy ? "Saving…" : "Save & send for approval"}
          </button>
          <button onClick={clearRange} className="px-4 py-2.5 rounded-lg text-slate-600 hover:bg-slate-100 text-sm">
            {fromYear === toYear ? "Clear year" : `Clear ${rangeLabel}`}
          </button>
          {msg && <span className="text-sm font-medium" style={{color: msg.ok ? "var(--green)" : "var(--red)"}}>{msg.text}</span>}
        </div>

        {caution && (
          <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">
            <div className="font-semibold">{caution.message}</div>
            <ul className="mt-1 space-y-0.5 text-xs">
              {(caution.lines || []).map((l, i) => (
                <li key={i}>
                  {l.discipline}{l.section_id && l.section_id !== "(unassigned)" ? ` / ${l.section_id}` : ""}
                  {" — "}{l.months} month{l.months === 1 ? "" : "s"}
                  {l.submitted_by ? `, submitted by ${l.submitted_by}` : ""}
                </li>
              ))}
            </ul>
            <div className="mt-1 text-xs">Your forecast was saved. This is a heads-up, not an error.</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ================================================================= Forecasts (2.5b)
//
// My submissions and Approvals, merged into one page. One list of forecast LINES — a route, a
// discipline, a section, one vehicle, across every year it covers — already filtered on
// the server by the caller's access code (Task F), so an IPT user sees its IPT's lines
// and a planner sees everyone's. What each person can DO to a line is what differs:
//   anyone     edit (reopens it in Submit forecast), withdraw their own
//   planner    approve / reject inline, withdraw anyone's
// Grouped per line, NOT per line-and-year (a multi-year save is one submission), and
// withdraw is scoped to the months the row actually shows.
function Forecasts({ meta, who, access, onEdit, onChanged }){
  const { routes, months } = meta;
  const routeById = useMemo(() => Object.fromEntries(routes.map(r => [r.route_id, r])), [routes]);
  const canApprove = !!(access && access.can_approve);
  const [rows, setRows] = useState(null);
  const [err, setErr] = useState(false);
  const [tick, setTick] = useState(0);
  const [busy, setBusy] = useState("");
  const [f, setF] = useState({ status: "ALL", ipt: "ALL", discipline: "ALL", mine: false, q: "" });

  useEffect(() => {
    let live = true;
    fetch(`${API}/forecasts`).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(rs => { if(live){ setRows(rs); setErr(false); } })
      .catch(() => setErr(true));
    return () => { live = false; };
  }, [tick]);

  const groups = useMemo(() => {
    if(!rows) return [];
    const g = {};
    rows.forEach(r => {
      const disc = r.discipline || "", sect = r.section_id || "";
      const key = [r.route_id, disc, sect].join("|");
      const e = g[key] || (g[key] = {
        key, routeId: r.route_id, discipline: disc, sectionId: sect, ipt: r.ipt || "",
        statuses: new Set(), material: r.material_type, material_description: r.material_description,
        vehicle: r.vehicle_type, unit: r.unit, submittedBy: r.submitted_by || "",
        months: 0, quantity: 0, rejectReason: null, minMonth: r.month_index, maxMonth: r.month_index,
      });
      e.statuses.add(r.status); e.months += 1; e.quantity += (+r.quantity || 0);
      e.minMonth = Math.min(e.minMonth, r.month_index); e.maxMonth = Math.max(e.maxMonth, r.month_index);
      if(r.reject_reason && !e.rejectReason) e.rejectReason = r.reject_reason;
    });
    const yearOf = (mi) => months.start_year + Math.floor((mi - 1) / 12);
    return Object.values(g).map(e => {
      const fromYear = yearOf(e.minMonth), toYear = yearOf(e.maxMonth);
      return { ...e, fromYear, toYear, yearLabel: fromYear === toYear ? String(fromYear) : `${fromYear}–${toYear}`,
        status: e.statuses.size === 1 ? [...e.statuses][0] : "Mixed" };
    }).sort((a, b) => (a.status === "Pending" ? -1 : 1) - (b.status === "Pending" ? -1 : 1)
      || (a.fromYear - b.fromYear) || a.routeId.localeCompare(b.routeId) || a.discipline.localeCompare(b.discipline));
  }, [rows, months]);

  const ipts = useMemo(() => [...new Set(groups.map(g => g.ipt).filter(Boolean))].sort(), [groups]);
  const discs = useMemo(() => [...new Set(groups.map(g => g.discipline).filter(Boolean))].sort(), [groups]);
  const shown = groups.filter(g =>
    (f.status === "ALL" || g.status === f.status)
    && (f.ipt === "ALL" || (f.ipt === "none" ? !g.ipt : g.ipt === f.ipt))
    && (f.discipline === "ALL" || g.discipline === f.discipline)
    && (!f.mine || g.submittedBy === who)
    && (!f.q || `${g.routeId} ${(routeById[g.routeId] || {}).origin || ""} ${(routeById[g.routeId] || {}).dest || ""} ${g.material || ""} ${g.submittedBy}`.toLowerCase().includes(f.q.toLowerCase())));
  const counts = useMemo(() => groups.reduce((a, g) => { a[g.status] = (a[g.status] || 0) + 1; return a; }, {}), [groups]);

  const done = () => { setTick(t => t + 1); if(onChanged) onChanged(); };
  // Scoped to the LINE and to exactly the months the row shows — never 1..60.
  const withdraw = (g) => {
    const what = g.discipline ? `${g.discipline} forecast` : "forecast";
    if(!confirm(`Withdraw the ${g.yearLabel} ${what} on ${g.routeId}${g.submittedBy && g.submittedBy !== who ? ` (submitted by ${g.submittedBy})` : ""}?\n${g.months} month${g.months === 1 ? "" : "s"} will be removed.`)) return;
    const p = new URLSearchParams({ from: String(g.minMonth), to: String(g.maxMonth),
      discipline: g.discipline || "", section_id: g.sectionId || "" });
    if(!canApprove) p.set("submitted_by", who);   // a submitter withdraws only its own
    setBusy(g.key);
    fetch(`${API}/forecasts/${encodeURIComponent(g.routeId)}?${p}`, { method: "DELETE" })
      .then(done).catch(() => {}).finally(() => setBusy(""));
  };
  // A rejection REQUIRES a reason: it is stored, shown to the submitter, and a
  // rejection without one is a dead end.
  const setStatus = (g, status) => {
    let reason = null;
    if(status === "Rejected"){
      reason = (window.prompt(`Why is ${g.routeId}${g.discipline ? " · " + g.discipline : ""} being rejected?\nThe submitter sees this, so say what needs to change.`) || "").trim();
      if(!reason){ alert("A rejection needs a reason — nothing was changed."); return; }
    }
    setBusy(g.key);
    const p = new URLSearchParams({ discipline: g.discipline || "", section_id: g.sectionId || "" });
    fetch(`${API}/routes/${encodeURIComponent(g.routeId)}/status?${p}`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, reject_reason: reason }),
    }).then(done).catch(() => {}).finally(() => setBusy(""));
  };

  const exportCsv = () => {
    const cols = ["Route", "From", "To", "Years", "IPT", "Discipline", "Section", "Material", "Description",
                  "Vehicle", "Unit", "Quantity", "Months", "Status", "Submitted by", "Rejection reason"];
    const esc = (v) => { const s = (v == null ? "" : String(v)); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    const lines = [cols.join(",")];
    shown.forEach(g => {
      const r = routeById[g.routeId] || {};
      lines.push([g.routeId, r.origin || "", r.dest || "", g.yearLabel, g.ipt, g.discipline, g.sectionId,
        g.material || "", g.material_description || "", g.vehicle || "", g.unit || "",
        Math.round(g.quantity * 10) / 10, g.months, g.status, g.submittedBy, g.rejectReason || ""].map(esc).join(","));
    });
    const blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = `forecasts-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  const badge = (s) => {
    const map = { Approved: ["var(--green)", "rgba(3,158,134,.12)"], Rejected: ["var(--red)", "rgba(191,46,85,.12)"],
                  Pending: ["#B45309", "rgba(217,119,6,.12)"], Mixed: ["#475569", "rgba(71,85,105,.12)"] };
    const [c, bg] = map[s] || map.Mixed;
    return <span className="text-xs font-semibold px-2 py-0.5 rounded-full" style={{ color: c, background: bg }}>{s}</span>;
  };
  const chip = (t, title) => <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-slate-100 text-slate-600" title={title}>{t}</span>;

  return (
    <div className="max-w-7xl mx-auto p-6">
      <PageHeader title="Forecasts"
        subtitle={canApprove
          ? "Every forecast line you can see, across every year it covers. Approve or reject each line here; approved lines feed the public map, the look-ahead and the KPI cards."
          : "Your IPT's forecast lines, across every year each one covers. Edit reopens a line in Submit forecast; a revised line goes back for approval."}
        actions={<>
          <button onClick={() => setTick(t => t + 1)} className="text-xs font-semibold px-2.5 py-1.5 rounded-md border border-slate-200 hover:bg-slate-50">Refresh</button>
          {shown.length > 0 && <button onClick={exportCsv} className="text-xs font-semibold px-2.5 py-1.5 rounded-md border border-slate-200 hover:bg-slate-50">Export CSV</button>}
        </>}>
        {groups.length > 0 && (
          <div className="flex flex-wrap gap-2 mt-2 text-xs">
            {["Pending", "Approved", "Rejected", "Mixed"].filter(s => counts[s]).map(s => (
              <button key={s} onClick={() => setF(x => ({ ...x, status: x.status === s ? "ALL" : s }))}
                className={"px-2 py-1 rounded-md border " + (f.status === s ? "border-[color:var(--navy)] bg-slate-50" : "border-slate-200 hover:bg-slate-50")}>
                {badge(s)} <span className="ml-1 tabular-nums text-slate-600">{counts[s]}</span>
              </button>
            ))}
          </div>
        )}
      </PageHeader>

      {err ? <EmptyState title="Couldn't load forecasts" body="Refresh the page; if it persists the server may still be starting." />
       : !rows ? <div className="p-8 text-center text-slate-400">Loading…</div>
       : groups.length === 0 ? (
        <EmptyState title="No forecast lines yet"
          body={canApprove ? "Nothing has been submitted that you can see. Lines appear here the moment a submitter saves one." : "Head to Submit forecast to add your first line."}
          action={!canApprove && <button onClick={() => onEdit({})} className="px-4 py-2 rounded-lg text-white text-sm font-semibold" style={{ background: "var(--navy)" }}>Submit a forecast</button>} />
      ) : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="flex flex-wrap items-center gap-2 px-3 py-2 border-b border-slate-100 bg-slate-50/60 text-xs">
            <input value={f.q} onChange={e => setF(x => ({ ...x, q: e.target.value }))} placeholder="Search route, site, material, submitter…"
              className="border border-slate-200 rounded-md px-2 py-1 w-56 bg-white" />
            {ipts.length > 0 && (
              <select value={f.ipt} onChange={e => setF(x => ({ ...x, ipt: e.target.value }))} className="border border-slate-200 rounded-md px-2 py-1 bg-white">
                <option value="ALL">All IPTs</option>
                {ipts.map(i => <option key={i} value={i}>{i}</option>)}
                {groups.some(g => !g.ipt) && <option value="none">No IPT set</option>}
              </select>
            )}
            {discs.length > 0 && (
              <select value={f.discipline} onChange={e => setF(x => ({ ...x, discipline: e.target.value }))} className="border border-slate-200 rounded-md px-2 py-1 bg-white">
                <option value="ALL">All disciplines</option>
                {discs.map(d => <option key={d} value={d}>{d}</option>)}
              </select>
            )}
            <label className="flex items-center gap-1.5 text-slate-600"><input type="checkbox" checked={f.mine} onChange={e => setF(x => ({ ...x, mine: e.target.checked }))} /> Mine only</label>
            <span className="ml-auto text-slate-400 tabular-nums">{shown.length} of {groups.length} line{groups.length === 1 ? "" : "s"}</span>
          </div>
          <div className="overflow-auto">
            <table className="w-full text-sm">
              <thead className="bg-slate-50 text-slate-500 text-xs">
                <tr>
                  <th className="px-3 py-2 text-left font-semibold">Route</th>
                  <th className="px-3 py-2 text-left font-semibold whitespace-nowrap">Line · submitted by</th>
                  <th className="px-3 py-2 text-left font-semibold">Years</th>
                  <th className="px-3 py-2 text-left font-semibold">Material · vehicle</th>
                  <th className="px-3 py-2 text-right font-semibold">Total</th>
                  <th className="px-3 py-2 text-left font-semibold">Status</th>
                  <th className="px-3 py-2 text-right font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody>
                {shown.map(g => {
                  const r = routeById[g.routeId] || {};
                  const own = g.submittedBy === who;
                  return (
                    <tr key={g.key} className="border-t border-slate-100 hover:bg-slate-50 align-top">
                      {/* route id, the pair it runs between and the IPT in ONE column: nine
                          columns pushed Actions off the right edge at 1440px, and a row
                          whose buttons you have to scroll sideways to reach is the whole
                          page failing at the one thing it is for. */}
                      <td className="px-3 py-2 whitespace-nowrap">
                        <div className="font-medium text-slate-800">{g.routeId}
                          <span className="ml-1.5">{g.ipt ? chip(g.ipt) : chip("no IPT", "No IPT on this line — only planners can see it until one is set. Edit and re-save it from Submit forecast.")}</span>
                        </div>
                        <div className="text-[11px] text-slate-500 mt-0.5">{r.origin || "—"} → {r.dest || "—"}</div>
                      </td>
                      {/* discipline, section and submitter in one column. Eight columns
                          still pushed the Withdraw link off the right edge at 1440px; who
                          submitted a line is secondary to what the line IS, so it rides
                          under it rather than taking a column of its own. */}
                      <td className="px-3 py-2 whitespace-nowrap">
                        <div>
                          {g.discipline
                            ? <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full" style={{ background:"rgba(0,55,135,.08)", color:"var(--navy)" }}>{g.discipline}</span>
                            : <span className="text-slate-300">unassigned</span>}
                          {g.sectionId && <span className="ml-1 text-[11px] text-slate-500">{g.sectionId}</span>}
                        </div>
                        <div className="text-[11px] text-slate-500 mt-0.5">{g.submittedBy || "—"}{own ? " · you" : ""}</div>
                      </td>
                      <td className="px-3 py-2 tabular-nums whitespace-nowrap">{g.yearLabel} <span className="text-slate-400 text-xs">· {g.months} mo</span></td>
                      <td className="px-3 py-2 text-slate-600 max-w-[220px]">
                        <div className="truncate" title={`${g.material || ""}${g.material_description ? " · " + g.material_description : ""}`}>
                          {g.material}{g.material_description ? <span className="text-slate-400"> · {g.material_description}</span> : null}
                        </div>
                        <div className="text-[11px] text-slate-500 truncate" title={g.vehicle}>{vehLabel(g.vehicle)}</div>
                      </td>
                      <td className="px-3 py-2 text-right tabular-nums whitespace-nowrap">{fmt(g.quantity, g.unit)} <span className="text-slate-400 text-xs">{g.unit === "m3" ? "m³" : g.unit}</span></td>
                      <td className="px-3 py-2">
                        {badge(g.status)}
                        {g.rejectReason && <div className="text-[11px] mt-1 max-w-[180px]" style={{ color: "var(--red)" }}>{g.rejectReason}</div>}
                      </td>
                      <td className="px-3 py-2 pl-1 text-right whitespace-nowrap">
                        {canApprove && g.status !== "Approved" && (
                          <button disabled={busy === g.key} onClick={() => setStatus(g, "Approved")}
                            className="px-2 py-1 rounded-md text-white text-xs font-semibold mr-1 disabled:opacity-50" style={{ background: "var(--green)" }}>Approve</button>
                        )}
                        {canApprove && g.status !== "Rejected" && (
                          <button disabled={busy === g.key} onClick={() => setStatus(g, "Rejected")}
                            className="px-2 py-1 rounded-md text-white text-xs font-semibold mr-1.5 disabled:opacity-50" style={{ background: "var(--red)" }}>Reject</button>
                        )}
                        <button onClick={() => onEdit({ routeId: g.routeId, year: g.fromYear, toYear: g.toYear, discipline: g.discipline, sectionId: g.sectionId })}
                          className="text-[color:var(--navy)] font-semibold hover:underline text-xs mr-1.5">Edit</button>
                        {(own || canApprove) && (
                          <button disabled={busy === g.key} onClick={() => withdraw(g)} className="text-[color:var(--red)] hover:underline text-xs disabled:opacity-50">Withdraw</button>
                        )}
                      </td>
                    </tr>
                  );
                })}
                {shown.length === 0 && <tr><td colSpan="7" className="px-3 py-8 text-center text-slate-400">Nothing matches these filters.</td></tr>}
              </tbody>
            </table>
          </div>
        </div>
      )}
    </div>
  );
}

// ================================================================= Config (2.5b)
//
// The editable copy of factors.json. Once the config row exists, THIS is what every
// payload, density and cycle time reads; the file is only the seed. Four tabs of
// form-backed editing plus a raw JSON tab for everything the forms do not cover
// (routing dimensions, aliases, notes). Save sends the WHOLE document; the server
// validates it and refuses with the list of problems rather than storing a bad one.
function ConfigPage({ meta, who, access }){
  const [doc, setDoc] = useState(null);
  const [orig, setOrig] = useState(null);
  const [status, setStatus] = useState(null);
  const [tab, setTab] = useState("vehicles");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);
  const [token, setToken] = useState(() => { try { return localStorage.getItem("rbe_admin_token") || ""; } catch(e){ return ""; } });
  const [raw, setRaw] = useState("");
  const [rawErr, setRawErr] = useState("");

  const load = () => fetch(`${API}/config/factors`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { setDoc(j.doc); setOrig(JSON.stringify(j.doc)); setStatus(j.status); setRaw(JSON.stringify(j.doc, null, 2)); setRawErr(""); })
    .catch(e => setMsg({ ok: false, text: `Couldn't load the configuration (${e}).` }));
  useEffect(() => { load(); }, []);

  const dirty = doc && JSON.stringify(doc) !== orig;
  const upd = (fn) => setDoc(d => { const n = JSON.parse(JSON.stringify(d)); fn(n); return n; });
  const num = (v) => (v === "" || v == null ? null : (isNaN(+v) ? v : +v));
  const vehicles = doc ? Object.keys(doc.vehicles || {}).filter(k => !k.startsWith("_")) : [];
  const materials = doc ? Object.keys(doc.material_categories || {}).filter(k => !k.startsWith("_")) : [];

  const save = async () => {
    let body = doc;
    if(tab === "raw"){
      try { body = JSON.parse(raw); } catch(e){ setRawErr("Not valid JSON: " + e.message); return; }
    }
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setBusy(true); setMsg(null);
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const r = await fetch(`${API}/admin/config/factors${qs}`, { method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ doc: body, updated_by: who || null }) });
      const t = await r.text();
      if(!r.ok) throw new Error(t.slice(0, 600));
      setMsg({ ok: true, text: "Saved. Every payload, density and cycle time now reads this." });
      await load();
    } catch(e){ setMsg({ ok: false, text: "Not saved — " + e.message.replace(/^\{"detail":"|"\}$/g, "") }); }
    setBusy(false);
  };
  const reset = async () => {
    if(!confirm("Replace the live configuration with backend/factors.json? Every edit made here since the last reset is lost.")) return;
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setBusy(true); setMsg(null);
    const qs = new URLSearchParams({ updated_by: who || "" }); if(token) qs.set("token", token);
    try {
      const r = await fetch(`${API}/admin/config/factors/reset?${qs}`, { method: "POST" });
      if(!r.ok) throw new Error((await r.text()).slice(0, 300));
      setMsg({ ok: true, text: "Reset to the file." }); await load();
    } catch(e){ setMsg({ ok: false, text: "Reset failed — " + e.message }); }
    setBusy(false);
  };

  const inp = "border border-slate-300 rounded-md px-2 py-1 text-sm w-full tabular-nums";
  const TABS = [["vehicles", "Vehicles"], ["materials", "Materials"], ["planning", "Planning"], ["seasonal", "Seasonal restrictions"], ["raw", "Everything (JSON)"]];

  return (
    <div className="max-w-7xl mx-auto p-6">
      <PageHeader title="Configuration"
        subtitle="Vehicles, materials, planning constants and seasonal windows — the numbers every forecast, cycle time and map figure is computed from. Changes apply on save, everywhere, for everyone."
        actions={<>
          <input value={token} onChange={e => setToken(e.target.value)} placeholder="Admin token"
            title="Needed to save. Remembered in this browser." className="border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm w-36" />
          <button onClick={reset} disabled={busy} className="text-xs font-semibold px-2.5 py-1.5 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-50" title="Overwrite the live configuration with backend/factors.json">Reset to file</button>
          <button onClick={save} disabled={busy || (!dirty && tab !== "raw")} className="px-4 py-1.5 rounded-lg text-white text-sm font-semibold disabled:opacity-50" style={{ background: "var(--navy)" }}>{busy ? "Saving…" : "Save"}</button>
        </>}>
        {status && (
          <div className="text-xs text-slate-500 mt-2">
            Live source: <strong>{status.source === "database" ? "the configuration table" : "backend/factors.json (not yet seeded)"}</strong>
            {status.updated_at && <> · last saved {status.updated_at.replace("T", " ").replace("Z", " UTC")} by {status.updated_by || "—"}</>}
            {status.differs_from_file && <span className="ml-2 px-1.5 py-0.5 rounded bg-amber-50 text-amber-800 border border-amber-200">differs from the file in the repo</span>}
            {dirty && <span className="ml-2 px-1.5 py-0.5 rounded bg-blue-50 text-blue-800 border border-blue-200">unsaved changes</span>}
          </div>
        )}
      </PageHeader>

      {msg && <div className="rounded-lg border p-3 text-sm mb-4 whitespace-pre-wrap" style={{ borderColor: msg.ok ? "var(--green)" : "var(--red)", color: msg.ok ? "var(--green)" : "var(--red)", background: msg.ok ? "rgba(3,158,134,.06)" : "rgba(191,46,85,.06)" }}>{msg.text}</div>}

      {!doc ? <div className="p-8 text-center text-slate-400">Loading…</div> : (
        <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
          <div className="flex gap-1 border-b border-slate-200 px-2">
            {TABS.map(([k, l]) => (
              <button key={k} onClick={() => setTab(k)} className={"px-3 py-2.5 text-sm font-medium border-b-2 -mb-px " + (tab === k ? "border-[color:var(--navy)] text-[color:var(--navy)]" : "border-transparent text-slate-500 hover:text-slate-800")}>{l}</button>
