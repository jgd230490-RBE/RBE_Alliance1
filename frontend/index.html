// ---- 10 Sep evening: the fuel-price widget — ONE component, THREE mounts --------------
// Account (top of the strip), Commit (the KPI strip, right of t·km) and Config (under the
// rates). It reads /api/fuel-index — the STORED EU Weekly Oil Bulletin diesel row plus the
// tenant's fuel settings — never the feed itself; the server refreshes in the background
// when the row is older than 12 h and this polls `refresh` while it runs. Two numbers,
// deliberately: the INDEX (public, weekly, what BAF is computed from) and the YARD price
// (typed, what the haulier pays, for a later cost-plus slice). The feed never writes the
// yard; the yard never changes the index. Nothing is seeded — no share, no base, no price.
// `initial` is the page's own `costing` block, so a mount inside the Look-ahead paints at
// once from the page read and the widget's fetch only refines it.
const fuelDate = (iso) => iso ? longDate(String(iso).slice(0, 10)) : "—";
const costingToData = (c) => !c ? null : ({
  fuel: c.fuel || {}, summary: c,
  index: { eur_per_l: c.index_eur_per_l, bulletin_date: c.index_bulletin_date, source: c.index_source,
           stale: c.index_eur_per_l == null, refresh: null, attribution: "EU Weekly Oil Bulletin via EuroOilWatch" } });
function FuelWidget({ who, access, mode, initial, onChanged }){
  // mode: "compact" (Commit KPI card) · "strip" (Account, one row) · "config" (everything)
  const [fetched, setFetched] = useState(null);
  const [draft, setDraft] = useState({});
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [token, setToken] = useState(() => { try { return localStorage.getItem("rbe_admin_token") || ""; } catch(e){ return ""; } });
  const canType = !!(access && access.can_approve);
  const load = (lazy) => fetch(`${API}/fuel-index?lazy=${lazy ? 1 : 0}`).then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { setFetched(j); return j; })
    .catch(e => { setErr(`Couldn't read the fuel index (${e}).`); return null; });
  useEffect(() => {
    let live = true, timer = null;
    const poll = (j) => {
      if(!live || !j) return;
      const rf = j.index && j.index.refresh;
      if(rf && rf.running){ timer = setTimeout(() => load(false).then(poll), 3000); }
      else if(rf && rf.finished_at && onChanged && j.__polled){ onChanged(); }
    };
    load(true).then(j => { if(j && j.index && j.index.refresh && j.index.refresh.running){ j.__polled = true; } poll(j); });
    return () => { live = false; if(timer) clearTimeout(timer); };
  }, []);
  const data = fetched || costingToData(initial);
  const idx = (data && data.index) || {};
  const fuelS = (data && data.fuel) || {};
  const sum = (data && data.summary) || {};
  const rf = idx.refresh || {};
  const put = async (path, body, method, admin) => {
    setBusy(true); setErr("");
    try {
      if(admin){ try { localStorage.setItem("rbe_admin_token", token); } catch(e){} }
      const qs = admin && token ? `?token=${encodeURIComponent(token)}` : "";
      const r = await fetch(`${API}${path}${qs}`, { method: method || "PUT", headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      if(!r.ok) throw new Error((await r.text()).slice(0, 200).replace(/^\{"detail":"|"\}$/g, ""));
      const j = await r.json(); setFetched(j); setDraft({});
      if(onChanged) onChanged();
    } catch(e){ setErr(String(e.message || e)); }
    setBusy(false);
  };
  const saveSetting = (k) => {
    if(draft[k] === undefined) return;
    const v = draft[k] === "" ? null : numOr(draft[k], null);
    if(draft[k] !== "" && v === null){ setErr(`${k === "share_pct" ? "Fuel share" : "Yard price"} must be a number.`); return; }
    put("/fuel-index/settings", { [k]: v, updated_by: who || null });
  };
  const hasIndex = idx.eur_per_l != null;
  const price = hasIndex ? `€${(+idx.eur_per_l).toFixed(3)} / L` : null;
  const country = fuelS.country || "EE";
  const bafTxt = sum.baf_pct != null
    ? `BAF ${sum.baf_pct >= 0 ? "+" : ""}${(sum.baf_pct * 100).toFixed(2)} % of quote`
    : sum.baf_reason === "no base" ? "BAF: set a base on Confirm week"
    : sum.baf_reason === "no share" ? "BAF: type a fuel share"
    : "BAF: no index";
  const baseTxt = fuelS.baf_base_eur_per_l != null ? `base €${(+fuelS.baf_base_eur_per_l).toFixed(3)} · ${fuelDate(fuelS.baf_base_bulletin_date)}` : "no base locked";
  const staleChip = hasIndex && idx.stale ? <span className="ml-1 text-[9px] font-semibold px-1.5 py-0.5 rounded-full" style={{ color: "#B45309", background: "rgba(217,119,6,.14)" }} title="The last good bulletin is older than 8 days">stale</span> : null;
  const inputCls = "border border-slate-300 rounded px-1.5 py-0.5 text-xs text-right tabular-nums w-20";
  const setting = (k, label, placeholder, title) => (
    <label className="inline-flex items-center gap-1 text-[11px] text-slate-600" title={title}>
      <span>{label}</span>
      {canType ? (
        <input className={inputCls} inputMode="decimal" placeholder={placeholder}
          value={draft[k] ?? (fuelS[k] ?? "")}
          onChange={e => setDraft(d => ({ ...d, [k]: e.target.value }))}
          onBlur={() => saveSetting(k)} disabled={busy} />
      ) : <span className="tabular-nums">{fuelS[k] ?? "—"}</span>}
    </label>
  );
  const attribution = <span className="text-[10px] text-slate-400" title={idx.source === "manual" ? "typed by an admin on Config" : "EU Weekly Oil Bulletin, Estonia, automotive diesel, price with taxes — via EuroOilWatch"}>
    {idx.source === "manual" ? "typed index" : "EU Weekly Oil Bulletin via EuroOilWatch"}</span>;

  if(mode === "compact"){
    return (
      <div className="bg-white rounded-xl border border-slate-200 px-4 py-3 min-w-0" data-fuel-widget="compact">
        <div className="text-2xl font-bold tabular-nums truncate" style={{ color: "var(--navy-deep)" }}>
          {hasIndex ? price : <span className="text-base text-amber-700">Index unavailable</span>}{staleChip}
        </div>
        <div className="text-[10px] uppercase tracking-wide text-slate-400 mt-0.5 truncate" title={bafTxt}>
          diesel {country} · {hasIndex ? `bulletin ${fuelDate(idx.bulletin_date)}` : "type a price on Config"}{rf.running ? " · updating…" : ""}
        </div>
        <div className="text-[10px] text-slate-500 mt-0.5 truncate">{bafTxt}</div>
      </div>
    );
  }
  return (
    <div className={"rounded-xl border border-slate-200 bg-white " + (mode === "config" ? "p-4" : "px-4 py-2.5 mb-3")} data-fuel-widget={mode || "strip"}>
      <div className="flex flex-wrap items-center gap-x-4 gap-y-1.5">
        <div className="flex items-baseline gap-2 min-w-0">
          <span className="text-[10px] uppercase tracking-wide text-slate-400">Diesel {country}</span>
          {hasIndex ? <span className="text-lg font-bold tabular-nums" style={{ color: "var(--navy-deep)" }}>{price}</span>
                    : <span className="text-sm font-semibold text-amber-700">Index unavailable — {canType ? "type a price" : "not set"}</span>}
          {staleChip}
          <span className="text-[11px] text-slate-500">{hasIndex ? `bulletin ${fuelDate(idx.bulletin_date)}` : (idx.last_error ? `feed: ${String(idx.last_error).slice(0, 60)}` : "")}</span>
          {rf.running && <span className="text-[11px] text-slate-400">updating…</span>}
          {!rf.running && idx.last_error && hasIndex && <span className="text-[11px]" style={{ color: "var(--red)" }} title={idx.last_error}>· last fetch failed {String(idx.last_attempt_at || "").replace("T", " ").slice(0, 16)}; the stored bulletin stands</span>}
        </div>
        {setting("yard_eur_per_l", "Yard €/L", "—", "What the haulier actually pays at the yard. Optional; for cost-plus later. Never replaces the bulletin index.")}
        {setting("share_pct", "Fuel share %", "—", "Fuel's share of the haulage price, 0–100. Empty = no BAF line.")}
        <span className="text-[11px] font-semibold tabular-nums" style={{ color: sum.baf_pct != null ? "var(--navy)" : "#64748b" }} title={baseTxt}>{bafTxt}</span>
        <span className="text-[10px] text-slate-400">{baseTxt}</span>
        <span className="ml-auto">{attribution}</span>
      </div>
      {mode === "config" && (
        <div className="mt-3 pt-3 border-t border-slate-100 flex flex-wrap items-center gap-x-4 gap-y-2 text-[11px] text-slate-600">
          <span className="text-[10px] uppercase tracking-wide text-slate-400">Admin</span>
          <input value={token} onChange={e => setToken(e.target.value)} placeholder="Admin token" className="border border-slate-200 rounded px-2 py-0.5 text-xs w-32" />
          <button onClick={() => put("/admin/fuel-index/refresh?sync=1", null, "POST", true)} disabled={busy || rf.running}
            className="font-semibold px-2 py-0.5 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40">Fetch the bulletin now</button>
          <label className="inline-flex items-center gap-1">
            <span>Manual index €/L</span>
            <input className={inputCls} inputMode="decimal" placeholder="—" value={draft.manual_eur ?? ""} onChange={e => setDraft(d => ({ ...d, manual_eur: e.target.value }))} />
            <input type="date" className="border border-slate-300 rounded px-1.5 py-0.5 text-xs" value={draft.manual_date ?? ""} onChange={e => setDraft(d => ({ ...d, manual_date: e.target.value }))} />
            <button onClick={() => put("/admin/fuel-index/manual", { eur_per_l: numOr(draft.manual_eur, null), bulletin_date: draft.manual_date || "", updated_by: who || null }, "PUT", true)}
              disabled={busy || !draft.manual_eur || !draft.manual_date}
              className="font-semibold px-2 py-0.5 rounded border border-slate-200 hover:bg-slate-50 disabled:opacity-40"
              title="When the feed is down: writes the same index row, marked 'typed'. It is the INDEX, not the yard price.">Use this index</button>
          </label>
          <button onClick={() => { if(confirm("Clear the locked BAF base? The next Confirm week will lock a fresh one from the index of that day.")) put(`/admin/fuel-index/reset-base?updated_by=${encodeURIComponent(who || "")}`, null, "POST", true); }}
            disabled={busy || fuelS.baf_base_eur_per_l == null}
            className="font-semibold px-2 py-0.5 rounded border disabled:opacity-40" style={{ borderColor: "var(--red)", color: "var(--red)" }}>Reset the BAF base</button>
          <span className="w-full text-[10px] text-slate-400">The base is locked by the first Confirm week that finds an index and no base; later confirms never move it. BAF = (index ÷ base − 1) × fuel share, applied as a second figure beside every quote — the quote itself is never replaced. One base per tenant, not per haulier.</span>
        </div>
      )}
      {err && <div className="text-[11px] mt-1" style={{ color: "var(--red)" }}>{err}</div>}
    </div>
  );
}

// `initialPage` / `initialView` exist for the render harness only — useEffect does not run
// under renderToStaticMarkup, so without them the populated views could never be rendered
// in a test. The app never passes them.
function LookAhead({ meta, who, access, initialPage, initialView }){
  const { months } = meta;
  const [view, setView] = useState(() => { if(initialView) return initialView; try { return localStorage.getItem("rbe_la_view") || "commit"; } catch(e){ return "commit"; } });
  const [bucket, setBucket] = useState("commit");        // 'commit' = the week containing today · 'next' = the Thursday process
  const [page, setPage] = useState(initialPage || null);
  const [err, setErr] = useState("");
  const [tick, setTick] = useState(0);
  const [busy, setBusy] = useState("");
  const [draft, setDraft] = useState({});                // key -> unsaved input
  const [open, setOpen] = useState({});                  // line key -> expanded
  const [railOpen, setRailOpen] = useState(false);
  const [confirming, setConfirming] = useState(false);   // the whole-week flag dialog
  const [flags, setFlags] = useState({ weather: "", wetness: "", traffic: "", other: "" });
  const pick = (v) => { setView(v); try { localStorage.setItem("rbe_la_view", v); } catch(e){} };

  // Tark Tee road restrictions — the page carries the STORED per-route check (a DB read).
  // The live check (six services + a geometry loop) froze the page on 09 Sep and took
  // 30 s+ off the path; it now runs on demand in the background, and this polls its
  // state while it runs. A route never checked is named, never shown clean.
  const [tt, setTt] = useState({ status: "unknown", refresh: null });
  const [ttPolling, setTtPolling] = useState(false);
  const refreshTarkTee = async () => {
    try {
      const r = await fetch(`${API}/forecast-weeks/tark-tee/refresh`, { method: "POST" });
      if(!r.ok) throw new Error(`${r.status}`);
      setTtPolling(true);
    } catch(e){ setErr("Couldn't start the road-restriction check: " + e.message); }
  };
  useEffect(() => {
    let live = true;
    setErr("");
    fetch(`${API}/lookahead?bucket=${bucket}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setPage(j); setDraft({}); } })
      .catch(e => { if(live) setErr(`Couldn't load the look-ahead (${e}).`); });
    return () => { live = false; };
  }, [bucket, tick]);
  useEffect(() => {
    if(!ttPolling || initialPage) return;
    let live = true;
    const tickPoll = () => fetch(`${API}/forecast-weeks/tark-tee?bucket=${bucket}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => {
        if(!live) return;
        setTt({ status: j.status, refresh: j.refresh });
        if(j.refresh && j.refresh.running){ setTimeout(tickPoll, 4000); }
        else { setTtPolling(false); setTick(t => t + 1); }     // done — re-read the page, flags included
      })
      .catch(() => { if(live){ setTtPolling(false); } });
    tickPoll();
    return () => { live = false; };
  }, [ttPolling, bucket]);

  const send = (path, body, method) => {
    setBusy(path);
    return fetch(`${API}${path}`, { method: method || "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
      .then(async r => { if(!r.ok){ throw new Error((await r.text()).slice(0, 200)); } return r.json(); })
      .then((j) => { setTick(t => t + 1); setErr(""); return j; })
      .catch(e => { setErr(String(e.message || e)); return null; })
      .finally(() => setBusy(""));
  };

  const cw = (page && page.commit_week) || {};
  const commit = (page && page.commit) || { lines: [], totals: {} };
  const lines = commit.lines || [];
  const totals = commit.totals || {};
  const account = (page && page.account) || { rows: [] };
  const horizon = (page && page.horizon) || { rows: [] };
  const rail = (page && page.clashes) || { flags: [], count: 0, sources: {} };
  const ttSrc = rail.sources || {};
  const ttRunning = ttPolling || !!(ttSrc.tark_tee_refresh && ttSrc.tark_tee_refresh.running);
  const today = page ? page.today : null;
  // Mon–Fri only (10 Sep, the human). The weekend days still exist at 0 in the database
  // — the sum rule and the export see them — but the grid does not show them.
  const dates = lines.length ? lines[0].days.map(d => d.day_date).filter(iso => !isWeekend(iso)) : [];
  const weekdaysOf = (line) => (line.days || []).filter(d => !isWeekend(d.day_date));
  const flagsByLine = useMemo(() => {
    const g = {};
    (rail.flags || []).forEach(f => { const k = lineKeyOf(f); (g[k] || (g[k] = [])).push(f); });
    return g;
  }, [rail]);
  const allConfirmed = lines.length > 0 && lines.every(l => l.week && l.week.status === "confirmed");
  const anyConfirmed = lines.some(l => l.week && l.week.status === "confirmed");

  // ---- writes ------------------------------------------------------------------
  const saveDay = (line, d) => {
    const k = `${lineKeyOf(line)}|${d.day_date}|p`;
    const v = draft[k];
    if(v === undefined) return;
    send("/forecast-days", { route_id: line.route_id, month_index: line.month_index,
      discipline: line.discipline || "", section_id: line.section_id || "",
      day_date: d.day_date, planned_qty: numOr(v, d.planned_qty), edited_by: who || null }, "PUT");
  };
  const saveActual = (r) => {
    const kq = wkKey(r) + "|a", kn = wkKey(r) + "|n", kc = wkKey(r) + "|c";
    if(draft[kq] === undefined && draft[kn] === undefined && draft[kc] === undefined) return;
    const v = draft[kq] !== undefined ? draft[kq] : (r.actual_qty ?? "");
    // an emptied box clears the actual back to "not reported", which is NOT zero. The
    // confirmed cost is sent ONLY when it was touched — an absent field leaves it alone.
    const body = { ...wkBody(r), actual_qty: (v === "" || v == null ? null : numOr(v, null)),
      actual_note: draft[kn] !== undefined ? draft[kn] : (r.actual_note ?? null),
      actual_by: who || null };
    if(draft[kc] !== undefined) body.actual_cost_eur = (draft[kc] === "" ? null : numOr(draft[kc], null));
    send("/forecast-weeks/actual", body, "PUT");
  };
  // 10 Sep: one stockpile's consumption for the account week. Empty = "not typed" (null),
  // not zero. The same PUT the old Horizon grid used; nothing new on the server.
  const saveConsumed = (s) => {
    const k = `stock|${s.location_id}`;
    const v = draft[k];
    if(v === undefined || !account.week) return;
    send("/stockpiles/consume", { location_id: s.location_id, month_index: account.week.month_index,
      week_index: account.week.week_index, consumed_qty: (v === "" ? null : numOr(v, null)),
      unit: s.unit, note: null, updated_by: who || null }, "PUT");
  };
  const doConfirm = async () => {
    // L6: ONE button, the whole week — every line in the bucket, the same four notes
    setConfirming(false);
    for(const l of lines){
      if(l.week && l.week.status === "confirmed") continue;
      const j = await send("/forecast-weeks/confirm", { ...wkBody(l.week), confirmed_by: who || null, ...flags });
      if(!j) break;
    }
  };
  const doReopen = async () => {
    if(!confirm("Re-open this week? Its plan becomes editable again and calibrate can reach it. Nothing is deleted.")) return;
    for(const l of lines){
      if(!(l.week && l.week.status === "confirmed")) continue;
      const j = await send("/forecast-weeks/reopen", { ...wkBody(l.week), reopened_by: who || null });
      if(!j) break;
    }
  };
  // "spread on this week": the shortage of ONE account line, carried into the commit
  // week and divided over its remaining weekdays. The only thing that writes next week.
  const doSpread = (row) => send("/forecast-weeks/calibrate", { ...wkBody(row), spread: true, by: who || null });
  const download = async (format) => {
    setBusy("export");
    try {
      const r = await fetch(`${API}/forecast-weeks/export?format=${format}&bucket=${bucket}`);
      if(!r.ok) throw new Error(`${r.status} ${(await r.text()).slice(0, 140)}`);
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `lookahead-${cw.from || "week"}.${format}`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    } catch(e){ setErr("Export failed: " + e.message); }
    setBusy("");
  };

  const fld = "w-full border border-slate-300 rounded px-1.5 py-1 text-xs text-right tabular-nums outline-none focus:ring-2 focus:ring-[color:var(--blue)]";
  const pill = (id, label) => (
    <button key={id} onClick={() => pick(id)}
      className="px-4 py-2 rounded-lg text-sm font-semibold border"
      style={view === id ? { background: "var(--navy)", color: "white", borderColor: "var(--navy)" }
                         : { background: "white", color: "#475569", borderColor: "#cbd5e1" }}>{label}</button>
  );
  const subtitle = view === "account"
    ? `Account is last week only · ${spanLabel(account.week && account.week.from, account.week && account.week.to)} · type what actually moved`
    : view === "commit"
    ? `Commit week is ${spanLabel(cw.from, cw.to)}${bucket === "next" ? " · next week, by the switch" : ""} · Mon–Fri only`
    : `Horizon is weeks, not days · ${monthLabelAbs(horizon.from_month || cw.month_index || 1, months.start_year)} + ${monthLabelAbs((horizon.to_month || (cw.month_index || 1) + 1), months.start_year)} · make-ready only`;

  return (
    <div className="max-w-[1500px] mx-auto p-5">
      <PageHeader title="Look-ahead" subtitle={page ? subtitle : "Loading the commit week…"} />

      <div className="flex flex-wrap items-center gap-2 mb-4">
        {pill("account", "Account")}
        {pill("commit", bucket === "next" ? "Commit · next week" : "Commit · this week")}
        {pill("horizon", "Horizon")}
        {/* the Thursday switch: which bucket the Commit and Account views look at */}
        <span className="ml-2 inline-flex rounded-lg border border-slate-300 overflow-hidden text-xs">
          {[["commit", "this week"], ["next", "next week"]].map(([b, l]) => (
            <button key={b} onClick={() => setBucket(b)} className="px-2.5 py-1.5 font-semibold"
              title={b === "next" ? "Commit NEXT week's plan now (e.g. on a Thursday). Its days are created when you open it." : "The week that contains today"}
              style={bucket === b ? { background: "#eff6ff", color: "var(--navy)" } : { color: "#64748b" }}>{l}</button>
          ))}
        </span>
        {view === "commit" && (
          <span className="ml-auto flex items-center gap-2">
            <button onClick={() => download("xlsx")} disabled={!!busy || !lines.length}
              className="px-4 py-2 rounded-lg text-sm font-semibold border disabled:opacity-40"
              style={{ borderColor: "var(--navy)", color: "var(--navy)", background: "white" }}>Export XLSX</button>
            <button onClick={() => download("pdf")} disabled={!!busy || !lines.length}
              className="px-3 py-2 rounded-lg text-sm font-semibold border disabled:opacity-40"
              title="The one-page commitment sheet, grouped by origin"
              style={{ borderColor: "#cbd5e1", color: "#475569", background: "white" }}>PDF</button>
            {allConfirmed ? (
              <button onClick={doReopen} disabled={!!busy}
                className="px-4 py-2 rounded-lg text-sm font-semibold border disabled:opacity-40"
                style={{ borderColor: "var(--red)", color: "var(--red)", background: "white" }}>Re-open week</button>
            ) : (
              <button onClick={() => setConfirming(true)} disabled={!!busy || !lines.length}
                className="px-4 py-2 rounded-lg text-sm font-semibold text-white disabled:opacity-40"
                title="Whole week, every line, one act. Planned cells lock; actuals stay typeable."
                style={{ background: "var(--green)" }}>{anyConfirmed ? "Confirm remaining lines" : "Confirm week"}</button>
            )}
          </span>
        )}
      </div>

      {err && <div className="rounded-lg border p-3 text-sm mb-3"
        style={{ borderColor: "var(--red)", color: "var(--red)", background: "rgba(191,46,85,.06)" }}>{err}</div>}

      {!page ? <div className="p-8 text-center text-slate-400">Loading…</div>
      : view === "commit" ? (
        <>
          {/* KPI strip — six cards; only the shortage is coloured */}
          <div className="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-8 gap-3 mb-3">
            <LaKpi value={`${grp(totals.planned_t)} t`} caption="planned this week" />
            <LaKpi value={grp(totals.trips)} caption="trips" />
            <LaKpi value={grp(totals.vehicles_peak)} caption={"vehicles / day peak" + (totals.excludes_unbaked ? " · unbaked lines excluded" : "")} />
            <LaKpi value={grp(totals.tonne_km)} caption="t·km · route basis" />
            {/* 10 Sep evening: the diesel index, right of t·km — the same widget as Account and Config */}
            <FuelWidget mode="compact" who={who} access={access} initial={page && page.costing} onChanged={() => setTick(t => t + 1)} />
            <LaKpi value={totals.eur == null ? "—" : "€ " + grp(totals.eur)}
              caption={totals.eur == null ? "planned € · no rate typed, no target set"
                : `planned € · ${totals.eur_lines} of ${totals.lines} lines priced${totals.eur_target_lines ? ` · ${totals.eur_target_lines} at target` : ""}${totals.eur_partial ? " · partial" : ""}${totals.eur_adj != null ? ` · + BAF € ${grp(totals.eur_adj)}` : ""}${totals.fair_eur != null ? ` · fair € ${grp(totals.fair_eur)} (model, ${totals.fair_lines} of ${totals.lines})` : ""}`} />
            <LaKpi value={account.shortfall > 0 ? `+${grp(account.shortfall)}` : "0"} tone={account.shortfall > 0 ? "red" : undefined} caption="last week shortage" />
            <LaKpi value={account.lines ? `${account.delivered} of ${account.lines} lines` : "—"} caption="last week delivered" />
          </div>

          {/* the clash rail — ONE row, flags run together, +N more */}
          {rail.count > 0 && (
            <div className="rounded-lg border px-3 py-2 mb-3 text-xs flex items-start gap-2"
              style={{ borderColor: "rgba(191,46,85,.35)", background: "rgba(191,46,85,.06)", color: "var(--red)" }}>
              <span className="mt-1 inline-block w-2 h-2 rounded-full shrink-0" style={{ background: "var(--red)" }} />
              <span className="min-w-0 flex-1 leading-5">
                {(railOpen ? rail.flags : rail.flags.slice(0, 3)).map((f, i) => (
                  <span key={i}>{i > 0 && <span className="text-slate-400"> · </span>}<span className="font-semibold">{f.code}</span> {f.text}</span>
                ))}
              </span>
              {rail.count > 3 && (
                <button onClick={() => setRailOpen(o => !o)} className="shrink-0 font-semibold hover:underline">
                  {railOpen ? "show fewer" : `+${rail.count - 3} more`}
                </button>
              )}
            </div>
          )}
          {lines.length > 0 && ttSrc.tark_tee !== "skipped" && (
            <div className="text-[11px] mb-3 flex flex-wrap items-center gap-2"
              style={{ color: ttSrc.tark_tee === "ok" ? "#64748b" : "#B45309" }}>
              <span>
                {ttRunning ? "checking road restrictions (Tark Tee) — this takes a minute; the page will refresh when it finishes…"
                 : ttSrc.tark_tee === "ok" ? `Road restrictions (Tark Tee): checked ${(ttSrc.tark_tee_checked_at || "").replace("T", " ").slice(0, 16)} UTC`
                 : ttSrc.tark_tee === "partial" ? `Road restrictions: ${(ttSrc.tark_tee_unchecked || []).join(", ")} not checked since baking — the rest as of ${(ttSrc.tark_tee_checked_at || "").slice(0, 10)}`
                 : "Road restrictions (Tark Tee): NOT checked for these routes — that is not the same as \"no restrictions\"."}
              </span>
              {!ttRunning && (
                <button onClick={refreshTarkTee} className="font-semibold underline hover:no-underline">
                  {ttSrc.tark_tee === "ok" ? "re-check" : "check now"}
                </button>
              )}
              {ttSrc.tark_tee_refresh && ttSrc.tark_tee_refresh.status === "unavailable" && !ttRunning && (
                <span style={{ color: "var(--red)" }}>· the last check could not reach Tark Tee; the stored result stands</span>
              )}
            </div>
          )}

          {lines.length === 0 ? (
            <EmptyState title={`No approved forecast line in the commit week (${spanLabel(cw.from, cw.to)}).`}
              body="Days exist only for Approved month lines. Approve a line for this month, or switch to next week." />
          ) : (
            <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
              <div className="overflow-auto">
                <table className="text-sm" style={{ minWidth: `${420 + dates.length * 118}px` }}>
                  <thead className="bg-slate-50 text-slate-500 text-xs">
                    <tr>
                      <th className="px-3 py-2 text-left font-semibold border-r border-slate-200 sticky left-0 bg-slate-50 z-10" style={{ minWidth: 260 }}>Line</th>
                      <th className="px-2 py-2 text-left font-semibold border-r border-slate-200"></th>
                      {dates.map(iso => {
                        const t = iso === today, we = isWeekend(iso);
                        return (
                          <th key={iso} className="px-2 py-1.5 text-right border-r border-slate-100"
                            style={t ? { background: "#eff6ff" } : {}}>
                            <div className={"font-semibold " + (we ? "text-slate-400" : (t ? "" : "text-slate-700"))}
                              style={t ? { color: "var(--navy)" } : {}}>{dayName(iso)} {dayNum(iso)}{t ? " · today" : ""}</div>
                            <div className="text-[9px] uppercase tracking-wide text-slate-400 font-medium">{we ? "0 default" : "qty · tr · veh"}</div>
                          </th>
                        );
                      })}
                    </tr>
                  </thead>
                  <tbody>
                    {lines.map(line => {
                      const c = line.context || {};
                      const lk = lineKeyOf(line);
                      const lf = flagsByLine[lk] || [];
                      const w = line.week || {};
                      const locked = w.status === "confirmed";
                      const wd = line.week_derived || {};
                      const isOpen = !!open[lk];
                      return (
                        <React.Fragment key={lk}>
                          <tr className="border-t border-slate-100 align-top">
                            <td className="px-3 py-2 border-r border-slate-100 sticky left-0 bg-white z-10" style={{ minWidth: 260 }}>
                              <div className="flex items-start gap-1.5">
                                <button onClick={() => setOpen(o => ({ ...o, [lk]: !o[lk] }))}
                                  className="text-slate-400 hover:text-slate-700 text-xs mt-0.5 w-4 shrink-0"
                                  title={isOpen ? "Hide km, t·km, cycle and €" : "Show km, t·km, cycle and €"}>{isOpen ? "▼" : "▶"}</button>
                                <div className="min-w-0">
                                  <div className="font-semibold text-[color:var(--navy-deep)] whitespace-nowrap">
                                    {c.origin_name || line.route_id} <span className="text-slate-400 font-normal">→</span> {c.dest_name || "—"}
                                  </div>
                                  <div className="flex flex-wrap items-center gap-1 mt-0.5 text-[11px] text-slate-500">
                                    <IptPill ipt={c.ipt} /><WsPill ws={c.section_id} />
                                    <span>{c.material_type || "—"} · <span title={c.vehicle_type}>{c.vehicle_short || vehLabel(c.vehicle_type) || "—"}</span></span>
                                    <StatusChip s={w.status} parentChanged={w.parent_changed} />
                                  </div>
                                  <div className="text-[10px] text-slate-400 mt-0.5">{line.route_id} · {line.discipline || "unassigned"} · {unitLbl(line.unit)} · week {grp(w.planned_qty, 1)} {unitLbl(line.unit)}{line.days_ne_week ? <span style={{ color: "var(--red)" }}> · days sum {grp(line.days_sum, 1)} ≠ week</span> : null}</div>
                                </div>
                              </div>
                            </td>
                            <td className="px-2 py-2 border-r border-slate-100"><LineFlags flags={lf} /></td>
                            {weekdaysOf(line).map(d => {
                              const k = `${lk}|${d.day_date}|p`;
                              const t = d.day_date === today, we = isWeekend(d.day_date);
                              const f = d.derived || {};
                              return (
                                <td key={d.day_date} className="px-2 py-2 text-right border-r border-slate-100"
                                  style={t ? { background: "#eff6ff" } : {}}>
                                  {/* ⭐ Editable while the week is not confirmed — this week or next,
                                      whichever bucket is open. A confirmed week's plan is read-only
                                      (L6); re-open it to change it. Sat/Sun are typeable: 0 is a
                                      default, not a rule. */}
                                  {!locked ? (
                                    <input className={fld + (we && !(draft[k] ?? d.planned_qty) ? " text-slate-300" : " font-semibold")} inputMode="decimal"
                                      value={draft[k] ?? (d.planned_qty ?? "")}
                                      onChange={e => setDraft(x => ({ ...x, [k]: e.target.value }))}
                                      onBlur={() => saveDay(line, d)} />
                                  ) : (
                                    <span className={"tabular-nums " + (we ? "text-slate-300" : "font-semibold text-slate-700")}
                                      title="Confirmed — reopen it to change the plan">{grp(d.planned_qty, 1)}{we ? "" : ` ${unitLbl(line.unit)}`}</span>
                                  )}
                                  <div className="text-[10px] text-slate-500 mt-0.5 tabular-nums whitespace-nowrap">
                                    {we && !(+d.planned_qty) ? "" : c.baked
                                      ? `${grp(f.trips)} tr · ${grp(f.vehicles)} veh`
                                      : <span title="Vehicles need a baked route for this vehicle">{grp(f.trips)} tr · <span className="text-amber-700">veh —</span></span>}
                                    {d.status === "edited" && <span className="ml-1 text-amber-700" title="typed — this day no longer follows the week ÷ 5">✎</span>}
                                  </div>
                                </td>
                              );
                            })}
                          </tr>
                          {isOpen && (
                            <tr className="bg-slate-50 border-t border-slate-100">
                              <td colSpan={2 + dates.length} className="px-3 py-1.5 text-[11px] text-slate-600 tabular-nums">
                                {c.baked ? (
                                  <>
                                    {grp(c.km_trip)} km/trip{c.return_baked ? "" : " (outbound only — return not baked)"} · {grp(wd.km)} km/week
                                    · {grp(wd.vehicles_peak)} veh peak · {grp(wd.tonne_km)} t·km ({c.km_basis === "loaded" ? "loaded leg" : "round trip"})
                                    · cycle {grp(c.cycle_min)} min {c.cycle_source === "here" ? "HERE" : "HERE‡ (return estimated)"}
                                    · {c.cycles_per_vehicle_day} cycles/veh/day · {wd.eur == null ? "rate not set" : `€ ${grp(wd.eur)}${c.rate_source === "target" ? " (target rate)" : ""}${wd.eur_partial ? " (per-km term missing)" : ""} this week${wd.eur_adj != null ? ` · + BAF € ${grp(wd.eur_adj)}` : ""}`}{wd.fair_eur != null && c.fair && <span title={`fair (model): ${grp(c.fair.litres_trip, 1)} L / trip at €${c.fair.index_eur_per_l} · fuel ${grp(c.fair.fuel_share_pct)} % of cost${c.fair.flags.length ? " · " + c.fair.flags.join(", ") : ""}`}> · <span className="text-[color:var(--navy)] font-semibold">fair € {grp(wd.fair_eur)}</span> (model{c.fair.flags.includes("WINTER") ? ", winter" : ""}{c.fair.flags.includes("THAW") ? ", thaw restrictions may apply" : ""}){wd.fair_units && wd.fair_units.per_t != null ? ` = ${unitTriple(wd.fair_units)}` : ""}</span>}{wd.eur != null && wd.eur_units && wd.eur_units.per_t != null && <span className="text-slate-500"> · {c.rate_source === "target" ? "target" : "quote"} = {unitTriple(wd.eur_units)}</span>}
                                  </>
                                ) : (
                                  <span className="text-amber-700">km — until the route is baked · trips still from {grp(c.payload_t, 1)} t planning payload{c.payload_fallback ? ` (${c.payload_fallback} fallback)` : ""}{wd.eur != null ? ` · € ${grp(wd.eur)}${c.rate_source === "target" ? " (target rate)" : ""}${wd.eur_partial ? " without the per-km term" : ""}${wd.eur_adj != null ? ` · + BAF € ${grp(wd.eur_adj)}` : ""}` : ""}</span>
                                )}
                              </td>
                            </tr>
                          )}
                        </React.Fragment>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100">
                Editable cells = this week, while status is not confirmed. Confirm locks the week as the haulier sheet.
                Mon–Fri only — Sat/Sun are held at 0 and not shown. Figures are planning, not plated. ✎ = a typed day that no longer follows the week ÷ 5.
                {busy && <span className="ml-2 text-slate-500">saving…</span>}
              </div>
            </div>
          )}

          {/* 10 Sep: this week's movements on a map, in place of the stock card (now on
              the Dashboard). Drawn from the baked geometry of the lines on this page;
              its own small fetch, off the page read, so it cannot slow the grid. */}
          {lines.length > 0 && !initialPage && <CommitMap meta={meta} bucket={bucket} tick={tick} lines={lines} />}
        </>
      ) : view === "account" ? (
        <>
          {/* 10 Sep evening: the diesel index and the two fuel settings, top of the strip */}
          <FuelWidget mode="strip" who={who} access={access} initial={page && page.costing} onChanged={() => setTick(t => t + 1)} />
          <div className="grid grid-cols-2 xl:grid-cols-4 gap-3 mb-3">
            <LaKpi value={account.lines ? `${account.delivered} of ${account.lines} lines` : "—"} caption="last week delivered · 98% band" />
            <LaKpi value={`${grp(account.actual_t)} t`} caption={`actual moved · ${account.reported || 0} of ${account.lines || 0} reported`} />
            <LaKpi value={account.shortfall > 0 ? `+${grp(account.shortfall)}` : "0"} tone={account.shortfall > 0 ? "red" : undefined} caption="shortfall vs plan · not yet carried" />
            <LaKpi value={`${account.open_to_calibrate || 0} line${account.open_to_calibrate === 1 ? "" : "s"} open to calibrate`} caption="adds shortage onto this week · not auto" />
          </div>
          {!account.week || account.rows.length === 0 ? (
            <EmptyState title="No approved line in last week." body="The Account view types what actually moved against last week's plan. There is nothing to account for yet." />
          ) : (
            <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
              <div className="overflow-auto">
                <table className="text-sm w-full" style={{ minWidth: 1220 }}>
                  <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wide">
                    <tr>
                      <th className="px-3 py-2 text-left font-semibold">Line</th>
                      <th className="px-2 py-2 text-right font-semibold">Planned</th>
                      <th className="px-2 py-2 text-right font-semibold">Actual</th>
                      <th className="px-2 py-2 text-right font-semibold">Variance</th>
                      <th className="px-2 py-2 text-right font-semibold">Planned €</th>
                      <th className="px-2 py-2 text-right font-semibold" title="The fair-price model: vehicle, distance, tonnage, month and the live diesel index. Never a quote.">Fair € <span className="normal-case tracking-normal text-slate-400">(model)</span></th>
                      <th className="px-2 py-2 text-right font-semibold">Actual €</th>
                      <th className="px-2 py-2 text-right font-semibold">€ var</th>
                      <th className="px-2 py-2 text-left font-semibold">Note</th>
                      <th className="px-2 py-2 text-right font-semibold">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {account.rows.map(r => {
                      const k = wkKey(r);
                      const short = r.action === "spread";
                      return (
                        <tr key={k} className="border-t border-slate-100 align-middle" style={short ? { background: "rgba(191,46,85,.05)" } : {}}>
                          <td className="px-3 py-2">
                            <div className="font-semibold text-[color:var(--navy-deep)] whitespace-nowrap">{r.route_id}</div>
                            <div className="text-[11px] text-slate-500 flex flex-wrap items-center gap-1">
                              <IptPill ipt={r.ipt} /><WsPill ws={r.section_id} />
                              <span>{r.material_type || "—"} · <span title={r.vehicle_type}>{vehShort(r.vehicle_type) || "—"}</span> · {r.status}</span>
                            </div>
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums font-semibold">{grp(r.planned_qty, 1)} {unitLbl(r.unit)}</td>
                          <td className="px-2 py-2 text-right">
                            <input className={fld + " max-w-[110px] ml-auto"} inputMode="decimal" placeholder="—"
                              style={short ? { borderColor: "var(--red)" } : {}}
                              value={draft[k + "|a"] ?? (r.actual_qty ?? "")}
                              onChange={e => setDraft(d => ({ ...d, [k + "|a"]: e.target.value }))}
                              onBlur={() => saveActual(r)} />
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums font-medium"
                            style={{ color: r.variance == null ? "#cbd5e1" : r.variance > 0 && !r.held ? "var(--red)" : "var(--green)" }}>
                            {r.variance == null ? "—" : (r.variance > 0 ? "+" : "") + grp(r.variance, 1)}
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums text-slate-600">
                            {r.planned_eur == null ? <span className="text-slate-300">rate not set</span> : <>
                              <div>€ {grp(r.planned_eur)}{r.rate_source === "target" && <span className="ml-1 text-[9px] font-semibold px-1.5 py-0.5 rounded-full text-slate-600 bg-slate-100" title="No rate on this route — priced at the target rate from Config">target</span>}</div>
                              {r.planned_units && r.planned_units.per_t != null && <div className="text-[10px] text-slate-400 whitespace-nowrap">{unitTriple(r.planned_units)}</div>}
                              {r.planned_eur_adj != null && <div className="text-[10px] text-slate-500" title="Quote × (1 + BAF). The quote above is unchanged.">+ BAF € {grp(r.planned_eur_adj)}</div>}
                            </>}
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums" style={{ color: "var(--navy)" }}>
                            {r.planned_fair_eur == null ? <span className="text-slate-300" title="No fair price: the route is not baked for this vehicle, or the diesel index is missing">—</span>
                              : <>€ {grp(r.planned_fair_eur)}{(r.fair_flags || []).includes("WINTER") && <span className="ml-1 text-[9px] text-slate-400" title="winter consumption uplift applied">winter</span>}{(r.fair_flags || []).includes("THAW") && <span className="ml-1 text-[9px] text-amber-700" title="Spring load restrictions (8 t) may apply on gravel and municipal roads — permits are free">thaw</span>}
                                  {r.fair_units && r.fair_units.per_t != null && <div className="text-[10px] text-slate-400 whitespace-nowrap">{unitTriple(r.fair_units)}</div>}</>}
                          </td>
                          <td className="px-2 py-2 text-right">
                            <input className={fld + " max-w-[110px] ml-auto"} inputMode="decimal" placeholder="€ —"
                              title="The confirmed cost of this week, as invoiced or agreed. Typed, never derived."
                              value={draft[k + "|c"] ?? (r.actual_cost_eur ?? "")}
                              onChange={e => setDraft(d => ({ ...d, [k + "|c"]: e.target.value }))}
                              onBlur={() => saveActual(r)} />
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums font-medium"
                            style={{ color: r.eur_variance == null ? "#cbd5e1" : r.eur_variance < 0 ? "var(--red)" : "var(--green)" }}>
                            {r.eur_variance == null ? "—" : (r.eur_variance > 0 ? "+" : "") + grp(r.eur_variance)}
                          </td>
                          <td className="px-2 py-2">
                            <input className={fld + " text-left"} placeholder="not typed"
                              value={draft[k + "|n"] ?? (r.actual_note ?? "")}
                              onChange={e => setDraft(d => ({ ...d, [k + "|n"]: e.target.value }))}
                              onBlur={() => saveActual(r)} />
                          </td>
                          <td className="px-2 py-2 text-right whitespace-nowrap">
                            {r.action === "held" && <span className="text-[11px] font-semibold px-2 py-1 rounded-full" style={{ color: "var(--green)", background: "rgba(3,158,134,.12)" }}>held</span>}
                            {r.action === "waiting" && <span className="text-[11px] text-slate-400">waiting</span>}
                            {r.action === "applied" && <span className="text-[11px] font-semibold px-2 py-1 rounded-full text-slate-600 bg-slate-100" title={`${grp(r.carried, 1)} carried into this week`}>applied · {grp(r.carried, 1)}</span>}
                            {r.action === "spread" && (
                              <button onClick={() => doSpread(r)} disabled={!!busy}
                                className="text-[11px] font-semibold px-2.5 py-1.5 rounded-lg text-white disabled:opacity-40"
                                title={`Carry +${grp(r.remaining_short, 1)} into the commit week, divided over its remaining weekdays. Refused if that week is confirmed.`}
                                style={{ background: "var(--navy)" }}>spread on this week</button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <div className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100 space-y-0.5">
                <div>Variance = planned − actual. Green = held (within the 98 % band) or over-delivered. Red = short. Empty actual is not zero — it is "not reported".
                  Calibrate never fires on save; only the navy button writes the commit week, and only if that week is not already confirmed.</div>
                <div>"Spread on this week" divides the shortage not yet carried across the remaining weekdays of the commit week (all of Mon–Fri when that week has not started). Sat/Sun stay 0 unless you type them. A second press carries only what the first did not.</div>
                <div>Planned € is the route's own rates, or the target rate from Config where the route has none (marked "target"). "+ BAF" is the same quote with the fuel surcharge; the quote is never replaced. € var compares the actual against the quote, not the surcharged figure. "Fair € (model)" is what the job should cost from the vehicle, distance, tonnage, month and the live diesel index at the coefficients on Config — a floor for negotiation, never a quote.{account.eur_target_lines ? ` ${account.eur_target_lines} line${account.eur_target_lines === 1 ? "" : "s"} at the target rate.` : ""}</div>
                {busy && <span className="text-slate-500">saving…</span>}
              </div>
            </div>
          )}
          {/* 10 Sep: what came OUT of each stockpile in the account week — one box per
              stockpile. In = the typed week actuals delivered there (a week nobody
              reported counts as nothing). Over capacity is a flag, never a block. */}
          {account.week && (account.stock || []).length > 0 && (
            <div className="mt-4">
              <div className="text-sm font-semibold text-slate-700 mb-1">Stockpiles · {spanLabel(account.week.from, account.week.to)}</div>
              <p className="text-[11px] text-slate-400 mb-2">Type what came out of each stockpile this week. Opening = the balance at the end of the week before · in = typed week actuals delivered here (a week nobody reported counts as nothing) · closing = opening + in − out. Empty = not typed, which is not zero.</p>
              <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <table className="text-sm w-full" style={{ minWidth: 760 }}>
                  <thead className="bg-slate-50 text-slate-500 text-[10px] uppercase tracking-wide">
                    <tr>
                      <th className="px-3 py-2 text-left font-semibold">Stockpile</th>
                      <th className="px-2 py-2 text-right font-semibold">Opening</th>
                      <th className="px-2 py-2 text-right font-semibold">In</th>
                      <th className="px-2 py-2 text-right font-semibold">Out</th>
                      <th className="px-2 py-2 text-right font-semibold">Closing</th>
                      <th className="px-2 py-2 text-right font-semibold">Capacity</th>
                      <th className="px-2 py-2 text-right font-semibold">Remaining</th>
                    </tr>
                  </thead>
                  <tbody>
                    {account.stock.map(s => {
                      const k = `stock|${s.location_id}`;
                      return (
                        <tr key={s.location_id} className="border-t border-slate-100" style={s.over ? { background: "rgba(191,46,85,.05)" } : {}}>
                          <td className="px-3 py-2">
                            <div className="font-semibold text-[color:var(--navy-deep)]">{s.name}</div>
                            <div className="text-[11px] text-slate-500">{s.loc_type} · {s.location_id}{s.unconvertible_movements ? <span className="text-amber-700"> · {s.unconvertible_movements} movement(s) not convertible to {s.unit}</span> : null}</div>
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums text-slate-600">{grp(s.opening, 1)} {s.unit}</td>
                          <td className="px-2 py-2 text-right tabular-nums text-slate-600">{grp(s.inbound, 1)}</td>
                          <td className="px-2 py-2 text-right">
                            <input className={fld + " max-w-[110px] ml-auto"} inputMode="decimal" placeholder="out —"
                              title={`What came out of ${s.name} this week, in ${s.unit}. Empty = not typed, which is not zero.`}
                              value={draft[k] ?? (s.consumed ?? "")}
                              onChange={e => setDraft(d => ({ ...d, [k]: e.target.value }))}
                              onBlur={() => saveConsumed(s)} />
                          </td>
                          <td className="px-2 py-2 text-right tabular-nums font-semibold" style={{ color: s.over ? "var(--red)" : "var(--navy-deep)" }}>{grp(s.closing, 1)}</td>
                          <td className="px-2 py-2 text-right tabular-nums text-slate-600">{s.capacity_qty == null ? <span className="text-slate-300">not recorded</span> : grp(s.capacity_qty)}</td>
                          <td className="px-2 py-2 text-right tabular-nums font-medium" style={{ color: s.over ? "var(--red)" : "var(--green)" }}>
                            {s.remaining == null ? "—" : s.over ? `OVER by ${grp(-s.remaining, 1)}` : grp(s.remaining, 1)}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </>
      ) : (
        <>
          {horizon.rows.length === 0 ? (
            <EmptyState title={`No approved forecast lines in ${monthLabelAbs(cw.month_index || 1, months.start_year)} or the month after.`}
              body="Weeks are created when a month line is approved — a Pending line has none by design." />
          ) : (() => {
            const g = {};
            horizon.rows.forEach(r => {
              const k = `${r.route_id}|${r.discipline || ""}|${r.section_id || ""}`;
              const e = (g[k] || (g[k] = { key: k, route_id: r.route_id, discipline: r.discipline || "", section_id: r.section_id || "",
                                 unit: r.unit, material_type: r.material_type, vehicle_type: r.vehicle_type, ipt: r.ipt, weeks: {}, reopened: [] }));
              e.weeks[`${r.month_index}|${r.week_index}`] = r;
              // Reopening a month does NOT delete its weeks — a confirmed week with an
              // actual against it is a record of what happened. Shown as a note.
              if(r.parent_status && r.parent_status !== "Approved" && !e.reopened.includes(r.month_index)) e.reopened.push(r.month_index);
            });
            const hl = Object.values(g).sort((a, b) => a.route_id.localeCompare(b.route_id) || a.discipline.localeCompare(b.discipline));
            const cols = [];
            [horizon.from_month, horizon.to_month].forEach(m => weekNosOf(horizon, m).forEach(w => cols.push({ m, w })));
            const roleOf = (m, w) => { const rr = horizon.roles || {}; return Object.keys(rr).find(k => rr[k][0] === m && rr[k][1] === w) || null; };
            const roleLbl = { account: "ACCOUNT", commit: "COMMIT", "make-ready": "MAKE-READY", "early-warning": "EARLY WARNING" };
            return (
              <div className="bg-white rounded-xl border border-slate-200 overflow-hidden">
                <div className="overflow-auto">
                  <table className="text-sm" style={{ minWidth: 1300 }}>
                    <thead className="bg-slate-50 text-slate-500 text-xs">
                      <tr>
                        <th className="px-3 py-2 text-left font-semibold border-r border-slate-200 sticky left-0 bg-slate-50 z-10" style={{ minWidth: 240 }}>
                          Line<div className="text-[10px] font-normal text-slate-400">{monthLabelAbs(horizon.from_month, months.start_year)} · {monthLabelAbs(horizon.to_month, months.start_year)}</div>
                        </th>
                        {cols.map(({ m, w }) => {
                          const role = roleOf(m, w);
                          return (
                            <th key={`${m}|${w}`} className="px-2 py-1.5 text-left border-r border-slate-100"
                              style={role === "commit" ? { background: "#eff6ff" } : {}}>
                              <div className={"font-semibold " + (role === "commit" ? "" : "text-slate-600")} style={role === "commit" ? { color: "var(--navy)" } : {}}>
                                W{w} · {weekSpanLbl(horizon, m, w)}
                              </div>
                              <div className="text-[9px] uppercase tracking-wide text-slate-400">{roleLbl[role] || " "}</div>
                            </th>
                          );
                        })}
                      </tr>
                    </thead>
                    <tbody>
                      {hl.map(line => (
                        <tr key={line.key} className="border-t border-slate-100 align-top">
                          <td className="px-3 py-2 border-r border-slate-100 sticky left-0 bg-white z-10">
                            <div className="font-semibold text-[color:var(--navy-deep)] whitespace-nowrap">{line.route_id}</div>
                            <div className="text-[11px] text-slate-500 flex flex-wrap items-center gap-1"><IptPill ipt={line.ipt} /><WsPill ws={line.section_id} /><span>{line.material_type || "—"} · {vehShort(line.vehicle_type) || "—"}</span></div>
                            {line.reopened.length > 0 && (
                              <div className="text-[10px] mt-0.5" style={{ color: "var(--red)" }}
                                title="These weeks were created while the month was approved. Reopening it does not delete them.">
                                month is now {(line.weeks[Object.keys(line.weeks).find(k => +k.split("|")[0] === line.reopened[0])] || {}).parent_status || "reopened"} ({line.reopened.map(m => monthLabelAbs(m, months.start_year)).join(", ")})
                              </div>
                            )}
                          </td>
                          {cols.map(({ m, w }) => {
                            const r = line.weeks[`${m}|${w}`];
                            const role = roleOf(m, w);
                            if(!r) return <td key={`${m}|${w}`} className="px-2 py-2 text-slate-300 border-r border-slate-100" style={role === "commit" ? { background: "#eff6ff" } : {}}>—</td>;
                            const short = r.actual_qty != null && r.variance > 0 && !(r.actual_qty >= 0.98 * (r.planned_qty || 0));
                            const status = r.actual_qty != null
                              ? <span style={{ color: short ? "var(--red)" : "var(--green)" }}>actual {grp(r.actual_qty, 1)} · {short ? `+${grp(r.variance, 1)} short${r.calibrated_at ? " · carried" : ""}` : "held"}</span>
                              : r.status === "confirmed" ? <span style={{ color: "var(--green)" }}>confirmed</span>
                              : r.status === "edited" ? <span className="text-amber-700">edited{role === "commit" ? " · open days" : ""}</span>
                              : <span className="text-slate-400">derived ÷{weekNosOf(horizon, m).length}</span>;
                            return (
                              <td key={`${m}|${w}`} className="px-2 py-2 border-r border-slate-100 whitespace-nowrap" style={role === "commit" ? { background: "#eff6ff" } : {}}>
                                <div className="font-semibold tabular-nums text-slate-800">{grp(r.planned_qty, 1)} {unitLbl(line.unit)}</div>
                                <div className="text-[10px] tabular-nums">{status}{r.parent_changed && <span style={{ color: "var(--red)" }}> · month changed</span>}</div>
                              </td>
                            );
                          })}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100">
                  No day columns here. Confirm lives on the Commit view. Weeks beyond the commit week stay week totals so hauliers are not sent a four-week daily spreadsheet.
                  Blue column = the commit week{bucket === "next" ? " (next week, by the switch above)" : " — the week that contains today"}. That is the only week that materialises daily rows.
                </div>
              </div>
            );
          })()}
        </>
      )}

      {confirming && (
        <div className="fixed inset-0 bg-black/30 flex items-center justify-center p-4 z-50" onClick={() => setConfirming(false)}>
          <div className="bg-white rounded-xl p-5 w-full max-w-md space-y-3" onClick={e => e.stopPropagation()}>
            <div className="font-semibold text-[color:var(--navy-deep)]">
              Confirm the week of {spanLabel(cw.from, cw.to)} — {lines.filter(l => !(l.week && l.week.status === "confirmed")).length} line(s)
            </div>
            <p className="text-xs text-slate-500">
              Whole week, one act: every line's Mon–Sun is locked as the haulier sheet and calibrate into this week is
              disabled until it is re-opened. Actuals stay typeable. All four notes are optional and may be left blank.
              Free text — no scores, no lookups, no colour used as logic.
            </p>
            {["weather", "wetness", "traffic", "other"].map(f => (
              <label key={f} className="block">
                <span className="text-[11px] uppercase tracking-wide text-slate-400">{f}</span>
                <input className={selCls} value={flags[f]}
                  onChange={e => setFlags(s => ({ ...s, [f]: e.target.value }))} />
              </label>
            ))}
            <div className="flex gap-2 justify-end pt-1">
              <button onClick={() => setConfirming(false)} className="px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
              <button onClick={doConfirm} className="px-4 py-2 text-sm font-semibold text-white rounded-lg" style={{ background: "var(--green)" }}>Confirm week</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}


// ---- 10 Sep: this week's movements on a map (Commit view) ----------------------------
// A SMALL live Mapbox map of the lines on the page — not the public map in a frame (that
// loads zones, restrictions and months of matrix, and the human does not want the page
// slow). One fetch to /api/lookahead/geometry with the route ids the page already has;
// nothing here reads the page again. The map is created once and kept for the life of
// the Look-ahead — moving to Account and back does not rebuild it. Lines take the IPT's
// palette-C colour; ends are dots (navy origin, red destination); hover names the line
// with its week figures. An unbaked route is listed under the map, not drawn.
function CommitMap({ meta, bucket, tick, lines, title, height, flush }){
  const mapDiv = useRef(null);
  const mapObj = useRef(null);
  const [geo, setGeo] = useState(null);
  const [err, setErr] = useState("");
  const [ready, setReady] = useState(false);
  const ids = lines.map(l => l.route_id).filter((v, i, a) => a.indexOf(v) === i);
  const idKey = ids.join(",");
  const byRoute = useMemo(() => {
    const g = {};
    lines.forEach(l => (g[l.route_id] || (g[l.route_id] = [])).push(l));
    return g;
  }, [lines]);

  useEffect(() => {
    let live = true;
    if(!ids.length){ setGeo({ routes: [] }); return; }
    const vehicles = ids.map(id => ((byRoute[id] || [])[0] || {}).vehicle_type || "");
    fetch(`${API}/lookahead/geometry?ids=${encodeURIComponent(ids.join(","))}&vehicles=${encodeURIComponent(vehicles.join(","))}`)
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { if(live){ setGeo(j); setErr(""); } })
      .catch(e => { if(live) setErr(`Couldn't load the week's routes for the map (${e}).`); });
    return () => { live = false; };
  }, [idKey, bucket, tick]);

  useEffect(() => {
    if(mapObj.current || !mapDiv.current || !window.mapboxgl) return;
    window.mapboxgl.accessToken = meta.mapbox_token;
    let m;
    try {
      m = new window.mapboxgl.Map({ container: mapDiv.current, style: "mapbox://styles/mapbox/light-v11",
                                    center: [24.7, 58.5], zoom: 6.5, attributionControl: true });
    } catch(e) {
      // 11 Sep: the Dashboard mounts this too — a map that cannot start (no token, no
      // WebGL) must never take the page down with it
      setErr(`The map could not start (${e && e.message ? e.message : e}).`);
      return;
    }
    m.addControl(new window.mapboxgl.NavigationControl({ showCompass: false }), "top-right");
    m.on("load", () => {
      m.addSource("la-routes", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      m.addSource("la-ends", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
      m.addLayer({ id: "la-routes-casing", type: "line", source: "la-routes",
                   paint: { "line-color": "#ffffff", "line-width": 6, "line-opacity": 0.9 } });
      m.addLayer({ id: "la-routes", type: "line", source: "la-routes",
                   paint: { "line-color": ["get", "color"], "line-width": 3.5 } });
      m.addLayer({ id: "la-ends", type: "circle", source: "la-ends",
                   paint: { "circle-radius": 5, "circle-color": ["get", "color"], "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.5 } });
      const popup = new window.mapboxgl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
      m.on("mousemove", "la-routes", (e) => {
        m.getCanvas().style.cursor = "pointer";
        const f = e.features && e.features[0];
        if(f) popup.setLngLat(e.lngLat).setHTML(f.properties.label).addTo(m);
      });
      m.on("mouseleave", "la-routes", () => { m.getCanvas().style.cursor = ""; popup.remove(); });
      setReady(true);
    });
    mapObj.current = m;
  }, []);

  useEffect(() => {
    const m = mapObj.current;
    if(!m || !ready || !geo) return;
    const feats = [], ends = [], b = new window.mapboxgl.LngLatBounds();
    (geo.routes || []).forEach(r => {
      const ls = byRoute[r.route_id] || [];
      const color = IPT_PALETTE_C[iptKey(r.ipt || (ls[0] || {}).ipt)] || "#0B1B45";
      const wk = ls.map(l => `${grp((l.week || {}).planned_qty, 0)} ${unitLbl(l.unit)} · ${grp((l.week_derived || {}).trips)} trips`).join("<br>");
      const label = `<div style="font:12px system-ui"><b>${r.route_id}</b> · ${r.origin.name} → ${r.dest.name}<br>${wk}${r.vehicle_as_planned === false ? `<br><i>drawn for ${r.vehicle_profile}, not the planned vehicle</i>` : ""}</div>`;
      if(r.geometry && r.geometry.length > 1){
        feats.push({ type: "Feature", properties: { route_id: r.route_id, color, label }, geometry: { type: "LineString", coordinates: r.geometry } });
        r.geometry.forEach(c => b.extend(c));
      }
      [["origin", "#0B1B45"], ["dest", "#BF2E55"]].forEach(([k, c]) => {
        const e = r[k];
        if(e && e.lon != null && e.lat != null){
          ends.push({ type: "Feature", properties: { color: c, name: e.name }, geometry: { type: "Point", coordinates: [e.lon, e.lat] } });
          b.extend([e.lon, e.lat]);
        }
      });
    });
    m.getSource("la-routes").setData({ type: "FeatureCollection", features: feats });
    m.getSource("la-ends").setData({ type: "FeatureCollection", features: ends });
    if(!b.isEmpty()) m.fitBounds(b, { padding: 40, maxZoom: 12, duration: 0 });
  }, [geo, ready, byRoute]);

  const unbaked = (geo && geo.routes || []).filter(r => !r.geometry).map(r => r.route_id);
  // 11 Sep: the Dashboard mounts this too (`flush` inside its own card, its own title
  // and height); the Look-ahead's rendering is unchanged by the defaults.
  return (
    <div className={flush ? "" : "mt-4"}>
      <div className={"text-sm font-semibold text-slate-700 mb-2" + (flush ? " px-4 pt-3 chart-title" : "")}>{title || "This week's movements"}</div>
      <div className={flush ? "" : "bg-white rounded-xl border border-slate-200 overflow-hidden"}>
        <div ref={mapDiv} style={{ height: height || 380 }} />
        <div className="px-3 py-2 text-[11px] text-slate-400 border-t border-slate-100 flex flex-wrap gap-x-3">
          <span>Baked loaded leg per line, coloured by IPT · navy dot = origin · red dot = destination · hover a line for its week.</span>
          {unbaked.length > 0 && <span className="text-amber-700">Not drawn (no baked route): {unbaked.join(", ")}</span>}
          {err && <span style={{ color: "var(--red)" }}>{err}</span>}
        </div>
      </div>
    </div>
  );
}


// ---- Look-ahead v2 slices 3-5: the typed planning cap and contract rates on ONE route --
// Its own save, separate from the endpoint/vehicle form above: these are planning inputs
// that touch no geometry. Nothing is seeded — an empty field means "no rate typed" and the
// Look-ahead prints "rate not set" rather than €0. The cap is a FLAG on the Look-ahead,
// never a block (brief L2). km basis decides what the per-km rate and t·km multiply.
function RoutePlanning({ route, token, onSaved }){
  const [v, setV] = useState({ max_vehicles_per_day: "", rate_eur_per_load: "", rate_eur_per_t: "", rate_eur_per_km: "", km_basis: "round_trip" });
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);
  useEffect(() => {
    setV({ max_vehicles_per_day: route.max_vehicles_per_day ?? "", rate_eur_per_load: route.rate_eur_per_load ?? "",
           rate_eur_per_t: route.rate_eur_per_t ?? "", rate_eur_per_km: route.rate_eur_per_km ?? "",
           km_basis: route.km_basis || "round_trip" });
    setMsg("");
  }, [route.id]);
  const save = async () => {
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    setBusy(true);
    try {
      const body = {};
      ["max_vehicles_per_day", "rate_eur_per_load", "rate_eur_per_t", "rate_eur_per_km"].forEach(k => {
        body[k] = (v[k] === "" || v[k] == null) ? null : +v[k];
      });
      body.km_basis = v.km_basis;
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(route.id)}/planning${qs}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0, 140)}`); }
      await res.json();
      setMsg("Saved planning figures.");
      if(onSaved) await onSaved();
    } catch(e){ setMsg("Couldn't save: " + e.message); }
    setBusy(false);
  };
  const inp = "mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]";
  const F = ({ k, label, step }) => (
    <label className="block">
      <span className="text-[11px] uppercase tracking-wide text-slate-400">{label}</span>
      <input className={inp} inputMode="decimal" placeholder="—" value={v[k]}
        onChange={e => setV(x => ({ ...x, [k]: e.target.value }))} />
    </label>
  );
  return (
    <div className="border-t border-slate-200 pt-3 mt-3 space-y-2">
      <div className="text-sm font-semibold text-slate-700">Planning · Look-ahead</div>
      <p className="text-[11px] text-slate-400">Typed, never seeded. Rates are SUMMED where filled (a base per load plus a per-km rate is the usual Estonian quote). Blank = no rate on this route: the Look-ahead then prices it at the target rate from Config (marked "target") — or prints "rate not set" when none is set either. A typed rate here is used ALONE; it is never mixed with the target.</p>
      <div className="grid grid-cols-2 gap-2">
        <F k="max_vehicles_per_day" label="Max vehicles / day (flag only)" />
        <label className="block">
          <span className="text-[11px] uppercase tracking-wide text-slate-400">km basis · €/km and t·km</span>
          <select className={inp} value={v.km_basis} onChange={e => setV(x => ({ ...x, km_basis: e.target.value }))}>
            <option value="round_trip">round trip (loaded + return)</option>
            <option value="loaded">loaded leg only</option>
          </select>
        </label>
        <F k="rate_eur_per_load" label="€ per load" />
        <F k="rate_eur_per_t" label="€ per tonne" />
        <F k="rate_eur_per_km" label="€ per km" />
      </div>
      <button onClick={save} disabled={busy}
        className="w-full py-2 rounded-lg text-sm font-semibold border disabled:opacity-50"
        style={{ borderColor: "var(--navy)", color: "var(--navy)", background: "white" }}>{busy ? "Saving…" : "Save planning figures"}</button>
      {msg && <p className="text-xs text-slate-500">{msg}</p>}
    </div>
  );
}

// ---- Task D2's stock grid (W1–W4 × two months of consumption inputs) was REMOVED on
// 10 Sep: consumption is typed on the Look-ahead's Account view for the account week
// (one box per stockpile), and the read-only balances live on the Dashboard.

// ================================================================= Data Management (Phase 1)
// This is the structural view of the network: every route is drawn the same neutral
// navy and the selected one is the only thing highlighted. Material colouring belongs
// on the forecasting dashboard and the public route map, not here.
const ROUTE_COLOR = "#003787";
// pairs HERE could not route — drawn dashed straight so 'impossible' reads differently
// from 'not baked yet', which used to look identical (both simply absent)
const FAILED_COLOR = "#BF2E55";
// the selected route's other options, drawn behind the chosen line
const ALT_COLOR = "#94A3B8";
const MAP_H = "62vh";     // map height — the right-hand column matches it and scrolls inside
// ⚠️ This is the ADMIN map's node legend, not the public map's palette — the public
// map draws nodes as DOM markers with their own colouring. #0F766E is the rail colour
// the build list reserves and is used here for the same concept. Stockpile's #78350F
// is MY choice, not a reserved value: it is clear of every reserved route, brand and
// IPT colour. Change it here and the legend follows, because both are generated from
// this object.
const NODE_COLORS = { "Quarry": "#C6841D", "Port": "#003787", "Compound": "#039E86",
                      "Site": "#6D28D9", "Railhead": "#0F766E", "Stockpile": "#78350F" };

// Phase 3 zones. The colour carries the only distinction that matters at a glance:
// red means the router is steered away from this area, grey means it is drawn for
// information and HERE never hears about it.
const ZONE_ROUTING = "#BF2E55";
const ZONE_ADVISORY = "#64748B";
// Phase 4. A haul road is the one kind that is NOT an obstacle: every other kind with
// "affects routing" on goes to HERE as an area to avoid, and a haul road is a road to
// route through. It gets its own colour because red would read as "closed".
const ZONE_HAUL = "#C2790B";
const HAUL_KIND = "haul_road";
const ZONE_KINDS = [
  ["closure", "Road closure"],
  ["weight_limit", "Weight / height limit"],
  ["works", "Works area"],
  ["haul_road", "Temporary haul road"],
  ["other", "Other"],
];
// Which of the two ways of making a route use a haul road applies. This is a fact about
// HERE's map data, not a preference — see the backend's haul.py. Splice is the default
// because its failure mode (geometry only as good as the drawing) is visible, and via's
// (a confident wrong route through roads HERE does know) is not.
const HAUL_MODES = [
  ["splice", "Splice — HERE does not map this road (default, safe)"],
  ["via", "Via — HERE already maps this road"],
];

// The sub-tabs share one map, so instead of toggling layers we lean the styling towards
// whichever half is in focus. Applied on add and re-applied after a basemap swap.
// Zones borrow the Locations weighting: routes stay legible but recede, so the shape
// being drawn over them is what reads.
const EMPHASIS = {
  locations: { route: 2, routeOp: 0.45, casingOp: 0.30, node: 7, nodeStroke: 2 },
  routes:    { route: 3, routeOp: 1.00, casingOp: 0.85, node: 5, nodeStroke: 1.5 },
  zones:     { route: 2, routeOp: 0.55, casingOp: 0.35, node: 5, nodeStroke: 1.5 },
};

function nodeExpr(){
  const e = ["match", ["get", "loc_type"]];
  Object.entries(NODE_COLORS).forEach(([k, v]) => { e.push(k, v); });
  e.push("#64748B");
  return e;
}

const BASEMAPS = [
  ["Light", "mapbox://styles/mapbox/light-v11"],
  ["Streets", "mapbox://styles/mapbox/streets-v12"],
  ["Outdoors", "mapbox://styles/mapbox/outdoors-v12"],
  ["Dark", "mapbox://styles/mapbox/dark-v11"],
  ["Satellite", "mapbox://styles/mapbox/satellite-v9"],
  ["Satellite Streets", "mapbox://styles/mapbox/satellite-streets-v12"],
  ["Navigation Day", "mapbox://styles/mapbox/navigation-day-v1"],
  ["Navigation Night", "mapbox://styles/mapbox/navigation-night-v1"],
  ["Estonia ortho (Maa-amet)", "maaamet-ortho"],
];
function maaametStyle(){

    sources: { "maaamet-ortho": { type: "raster", tileSize: 256, scheme: "tms", maxzoom: 18,

// Week 1: two new types.
//   Railhead  where material arrives by rail and leaves by road. An ORIGIN, like a
//              quarry or a port — map/index.html's filterByNode() and
//              network._role_for() carry the matching rule and all three must agree.
//   Stockpile  somewhere material is held. A DESTINATION by default.
const LOC_TYPES = ["Quarry", "Port", "Compound", "Site", "Railhead", "Stockpile", "Other"];
// 2026-09-02: 'Rail head' -> 'Railhead'. The backend rewrites old rows on boot and
// canonicalises on read, but this client can meet a row the backend has not touched yet
// (a stale /api/locations/geojson in the tab). Read either spelling; write only the new.
const locTypeOf = (t) => (t === "Rail head" ? "Railhead" : t);
// Types that can hold stock — the capacity fields appear for these. Mirrors
// stockpiles.STORAGE_TYPES on the backend.
const STORAGE_TYPES = ["Stockpile", "Site", "Compound", "Railhead"];
const ROLE_OPTIONS = [["origin", "Origin (supplier)"], ["destination", "Destination (site)"], ["both", "Both"]];
const ROLE_LABEL = { origin: "Origin", destination: "Destination", both: "Both" };
const asArray = (v) => Array.isArray(v) ? v : (() => { try { return JSON.parse(v || "[]"); } catch(e){ return []; } })();

// "Artic Tipper (44t)" -> "Tipper (44t)". Full name stays in the chip's tooltip.
// ---- 2026-09-02: one vehicle, three labels ------------------------------------
// VEH.lang is the toggle (en | eu | ee); VEH.labels comes off /api/meta. vehLabel()
// changes ONLY what is shown — the string a forecast line stores, the payload it
// converts on and the emissions factor are all keyed on the canonical id, which is
// the EU string for the four planning vehicles and the trade name for the six legacy
// ones. A missing label falls back to that id, never to an invented name.
const VEH = { lang: "eu", labels: {}, fallbacks: {} };
try { const l = localStorage.getItem("rbe_veh_lang"); if(["en","eu","ee"].includes(l)) VEH.lang = l; } catch(e){}
const VEH_LANGS = [["en", "English"], ["eu", "European"], ["ee", "Estonian"]];
const vehLabel = (v, lang) => ((VEH.labels[v] || {})[lang || VEH.lang]) || v || "";
const vehIsFallback = (v, lang) => ((VEH.fallbacks[v] || []).includes(lang || VEH.lang));
// short form for tables: the label, minus the leading 'Artic'/'Rigid' of the trade names
const vehShort = (v) => vehLabel(v).replace(/^(Artic|Rigid)\s+/, "");

// Which vehicle profiles a route is baked for, and how that went.
// A route is baked in two directions now, so a chip is only "fully baked" (solid) when
// both the laden run out and the empty run back are cached. Outbound-only shows hollow —
// enough to draw the map, not enough for a cycle time.
function VehChips({ profiles }){
  const keys = Object.keys(profiles || {}).sort();
  if(!keys.length) return <span className="text-xs text-slate-300">not baked</span>;
  return (
    <span className="flex flex-wrap gap-1">
      {keys.map(k => {
        const p = profiles[k] || {};
        const both = p.baked && p.return_baked;
        const [bg, fg] = both    ? ["rgba(3,158,134,.12)", "var(--green)"]
                       : p.baked ? ["rgba(255,193,1,.16)", "#8a6d00"]
                       : p.error ? ["rgba(191,46,85,.12)", "var(--red)"]
                                 : ["#f1f5f9", "#94a3b8"];
        const alts = p.alt_count > 1 ? ` · ${p.alt_count} options` : "";
        const tip = p.error ? `${k} — ${p.error}`
                  : !p.baked ? `${k} · not baked`
