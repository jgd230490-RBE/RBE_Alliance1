const LOC_TYPES = ["Quarry", "Port", "Compound", "Site", "Other"];
const ROLE_OPTIONS = [["origin", "Origin (supplier)"], ["destination", "Destination (site)"], ["both", "Both"]];
const ROLE_LABEL = { origin: "Origin", destination: "Destination", both: "Both" };
const asArray = (v) => Array.isArray(v) ? v : (() => { try { return JSON.parse(v || "[]"); } catch(e){ return []; } })();

// "Artic Tipper (44t)" -> "Tipper (44t)". Full name stays in the chip's tooltip.
const vehShort = (v) => (v || "").replace(/^(Artic|Rigid)\s+/, "");

// Which vehicle profiles a route is baked for, and how that went.
// A route is baked in two directions now, so a chip is only "fully baked" (solid) when
// both the laden run out and the empty run back are cached. Outbound-only shows hollow —
// enough to draw the map, not enough for a cycle time.
function VehChips({ profiles }){
  const keys = Object.keys(profiles || {}).sort();
  if(!keys.length) return <span className="text-xs text-slate-300">not baked</span>;
  return (
    <span className="flex flex-wrap gap-1">
      {keys.map(k => {
        const p = profiles[k] || {};
        const both = p.baked && p.return_baked;
        const [bg, fg] = both    ? ["rgba(3,158,134,.12)", "var(--green)"]
                       : p.baked ? ["rgba(255,193,1,.16)", "#8a6d00"]
                       : p.error ? ["rgba(191,46,85,.12)", "var(--red)"]
                                 : ["#f1f5f9", "#94a3b8"];
        const alts = p.alt_count > 1 ? ` · ${p.alt_count} options` : "";
        const tip = p.error ? `${k} — ${p.error}`
                  : !p.baked ? `${k} · not baked`
                  : `${k} · ${p.distance_km} km out` +
                    (p.return_baked ? ", return baked" : ", return NOT baked") + alts;
        return (
          <span key={k} title={tip}
            className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
            style={{ background: bg, color: fg }}>
            {vehShort(k)}{p.baked && !p.return_baked ? " ↦" : ""}
          </span>
        );
      })}
    </span>
  );
}

// Step C — haul-cycle figures for one route, fetched on demand when its row is opened.
// Everything here is derived from cached geometry plus factors.json, so opening a row
// costs one cheap request and never touches HERE.
function RouteAnalysis({ routeId, colSpan }){
  const [data, setData] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    let live = true;
    setData(null); setErr("");
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/analysis`)
      .then(r => r.json())
      .then(j => { if(!live) return; j.error ? setErr(j.error) : setData(j); })
      .catch(e => { if(live) setErr(e.message); });
    return () => { live = false; };
  }, [routeId]);

  const cell = "px-2 py-1 text-right tabular-nums whitespace-nowrap";
  const head = "px-2 py-1 text-right font-semibold whitespace-nowrap";

  return (
    <tr className="bg-slate-50/70">
      <td colSpan={colSpan} className="px-4 py-3">
        {err && <p className="text-xs" style={{ color: "var(--red)" }}>Couldn't load analysis: {err}</p>}
        {!data && !err && <p className="text-xs text-slate-400">Loading analysis…</p>}
        {data && !data.rows.length && (
          <p className="text-xs text-slate-500">
            Nothing to analyse yet — this route has no cached geometry. Tick a vehicle in
            “Vehicle profiles to bake” and run a bake.
          </p>
        )}
        {data && !!data.rows.length && (
          <div className="overflow-x-auto">
            <table className="text-xs w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="px-2 py-1 text-left font-semibold">Vehicle</th>
                  <th className="px-2 py-1 text-left font-semibold">Option</th>
                  <th className={head}>Out km</th>
                  <th className={head}>Back km</th>
                  <th className={head}>Turn</th>
                  <th className={head}>Cycle</th>
                  <th className={head}>Trips/day</th>
                  <th className={head}>t/day</th>
                  <th className={head}>t/month</th>
                  <th className={head}>CO₂ kg/trip</th>
                </tr>
              </thead>
              <tbody>
                {data.rows.map((r, i) => (
                  <tr key={`${r.profile}-${r.alt_index}`}
                    className={"border-t border-slate-200/70 " + (r.alt_index === 0 ? "" : "text-slate-500")}>
                    <td className="px-2 py-1 whitespace-nowrap">
                      {r.alt_index === 0 ? vehShort(r.profile) : ""}
                    </td>
                    <td className="px-2 py-1 whitespace-nowrap">
                      {r.alt_index === 0
                        ? <span className="font-semibold" style={{ color: "var(--navy)" }}>Best</span>
                        : `Alt ${r.alt_index}`}
                    </td>
                    <td className={cell}>{r.loaded_km}</td>
                    <td className={cell} title={r.return_estimated ? "Return leg not baked — assumed same as outbound" : undefined}>
                      {r.return_km}{r.return_estimated ? "*" : ""}
                    </td>
                    <td className={cell} title={`${r.load_minutes} min load + ${r.unload_minutes} min unload`}>
                      {Math.round((r.turnaround_hr || 0) * 60)}m
                    </td>
                    <td className={cell}>{r.cycle_hr} h</td>
                    <td className={cell}>{r.trips_per_day || <span className="text-slate-300">0</span>}</td>
                    <td className={cell}>{r.tonnes_per_day}</td>
                    <td className={cell}>{r.tonnes_per_month}</td>
                    <td className={cell}>{r.co2_kg_per_trip}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <p className="text-[11px] text-slate-400 mt-2">
              Cycle = out + back + turnaround, where turnaround is the vehicle's own load and
              unload time from factors.json. Trips/day assumes a {data.planning.shift_hours_per_day} h
              shift; t/month assumes {data.planning.working_days_per_month} working days.
              {data.rows.some(r => r.return_estimated) && " * return leg not baked — assumed to mirror the outbound."}
            </p>
          </div>
        )}
      </td>
    </tr>
  );
}

// Material categories a location supplies (out) or receives (in).
function CatChips({ list, dir }){
  const arr = asArray(list);
  if(!arr.length) return <span className="text-slate-300">—</span>;
  const bg = dir === "in" ? "rgba(3,158,134,.10)" : "rgba(0,55,135,.08)";
  const fg = dir === "in" ? "var(--green)" : "var(--navy)";
  return (
    <span className="flex flex-wrap gap-1">
      {arr.map(c => (
        <span key={c} className="text-[10px] px-1.5 py-0.5 rounded-full whitespace-nowrap"
          style={{ background: bg, color: fg }}>{c}</span>
      ))}
    </span>
  );
}

// Why the analysis table can look like it ignores the vehicle. Three different faults
// present identically — a profile whose name no longer matches factors.json, a deployed
// factors.json that isn't the one you think, and vehicles that genuinely share a figure.
// This shows the resolved numbers so they can be told apart, and can put a real question
// to HERE about one route.
function Diagnostics({ token, routeId }){
  const [fx, setFx] = useState(null);
  const [cmp, setCmp] = useState(null);
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const qs = () => (token ? `?token=${encodeURIComponent(token)}` : "");

  const loadFactors = async () => {
    setBusy("factors"); setErr("");
    try {
      const r = await fetch(`${API}/admin/diagnostics/factors${qs()}`);
      if(!r.ok) throw new Error(`${r.status} — ${r.status === 403 ? "admin token rejected" : await r.text()}`);
      setFx(await r.json());
    } catch(e){ setErr(e.message); }
    setBusy("");
  };

  const probeHere = async () => {
    if(!routeId){ setErr("Pick a route on the Routes tab first."); return; }
    setBusy("probe"); setErr("");
    try {
      const p = new URLSearchParams({ probe: "true" });
      if(token) p.set("token", token);
      const r = await fetch(`${API}/admin/diagnostics/compare/${encodeURIComponent(routeId)}?${p}`);
      if(!r.ok) throw new Error(`${r.status} — ${r.status === 403 ? "admin token rejected" : await r.text()}`);
      setCmp(await r.json());
    } catch(e){ setErr(e.message); }
    setBusy("");
  };

  return (
    <div className="card p-4">
      <div className="text-sm font-semibold text-slate-700 mb-1">Diagnostics</div>
      <p className="text-[11px] text-slate-400 mb-2">
        Use these when vehicles look interchangeable — identical distances, cycle times or CO₂.
      </p>
      <div className="flex flex-wrap gap-2">
        <button onClick={loadFactors} disabled={!!busy}
          className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-40">
          {busy === "factors" ? "Checking…" : "Check factors.json"}
        </button>
        <button onClick={probeHere} disabled={!!busy || !routeId} title={routeId ? `Ask HERE about ${routeId}` : "Select a route first"}
          className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 hover:bg-slate-50 disabled:opacity-40">
          {busy === "probe" ? "Asking HERE…" : `Probe HERE${routeId ? ` · ${routeId}` : ""}`}
        </button>
      </div>
      {err && <p className="text-xs mt-2" style={{ color: "var(--red)" }}>{err}</p>}

      {fx && (
        <div className="mt-3">
          {fx.warnings.map((w, i) => (
            <p key={i} className="text-[11px] rounded-md px-2 py-1.5 mb-1"
              style={{ background: "rgba(255,193,1,.14)", color: "#8a6d00" }}>⚠ {w}</p>
          ))}
          {!fx.warnings.length && (
            <p className="text-[11px] rounded-md px-2 py-1.5 mb-1"
              style={{ background: "rgba(3,158,134,.10)", color: "var(--green)" }}>
              Every profile resolves to a distinct entry in factors.json.
            </p>
          )}
          <div className="overflow-x-auto">
            <table className="text-[11px] w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="text-left font-semibold py-1">Vehicle</th>
                  <th className="text-right font-semibold px-1">Payload</th>
                  <th className="text-right font-semibold px-1">CO₂/km</th>
                  <th className="text-right font-semibold px-1">Laden</th>
                  <th className="text-right font-semibold px-1">Tare</th>
                  <th className="text-right font-semibold px-1">Turn</th>
                </tr>
              </thead>
              <tbody>
                {fx.vehicles.map(v => (
                  <tr key={v.profile} className="border-t border-slate-100">
                    <td className="py-1 whitespace-nowrap">
                      {!v.in_factors && <span style={{ color: "var(--red)" }} title="Not a key in factors.json — falls back to _default">⚠ </span>}
                      {vehShort(v.profile)}
                      {v.in_database && <span className="text-slate-300" title="Present in cached geometry"> ●</span>}
                    </td>
                    <td className="text-right tabular-nums px-1">{v.payload_t}t</td>
                    <td className="text-right tabular-nums px-1">{v.emissions_kg_co2e_per_km}</td>
                    <td className="text-right tabular-nums px-1">{v.gross_weight_kg ? (v.gross_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{v.tare_weight_kg ? (v.tare_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{Math.round((v.turnaround_hr||0)*60)}m</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-[11px] text-slate-400 mt-1">● = appears in cached geometry. ⚠ = name not found in factors.json.</p>
        </div>
      )}

      {cmp && (
        <div className="mt-3">
          <p className="text-[11px] mb-1" style={{ color: cmp.all_identical ? "#8a6d00" : "var(--green)" }}>
            {cmp.note}
          </p>
          <div className="overflow-x-auto">
            <table className="text-[11px] w-full">
              <thead className="text-slate-400">
                <tr>
                  <th className="text-left font-semibold py-1">Vehicle</th>
                  <th className="text-right font-semibold px-1">Gross</th>
                  <th className="text-right font-semibold px-1">Live km</th>
                  <th className="text-right font-semibold px-1">Options</th>
                  <th className="text-center font-semibold px-1">Truck params</th>
                </tr>
              </thead>
              <tbody>
                {cmp.rows.map(r => (
                  <tr key={r.profile} className="border-t border-slate-100">
                    <td className="py-1 whitespace-nowrap">{vehShort(r.profile)}</td>
                    <td className="text-right tabular-nums px-1">{r.gross_weight_kg ? (r.gross_weight_kg/1000)+"t" : "—"}</td>
                    <td className="text-right tabular-nums px-1">{r.error ? "err" : (r.live_km ?? "—")}</td>
                    <td className="text-right tabular-nums px-1">{r.routes_returned ?? "—"}</td>
                    <td className="text-center px-1">
                      {r.truck_params_present === undefined ? "—"
                        : r.truck_params_present ? <span style={{ color: "var(--green)" }}>✓</span>
                        : <span style={{ color: "var(--red)" }} title="No vehicle[...] params were sent — HERE routed this as a generic truck">✗</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <p className="text-[11px] text-slate-400 mt-1">
            “Options” is how many routes HERE actually returned — 1 means it found no
            meaningfully different alternative, which is common on a sparse network.
          </p>
        </div>
      )}
    </div>
  );
}

function DataManagement({ meta, who }){
  const { vehicles, materials = [], mapbox_token } = meta;
  const mapDiv = useRef(null);
  const mapObj = useRef(null);
  const routesFC = useRef({ type: "FeatureCollection", features: [] });
  const nodesFC = useRef({ type: "FeatureCollection", features: [] });
  const selFC = useRef({ type: "FeatureCollection", features: [] });
  const newFC = useRef({ type: "FeatureCollection", features: [] });   // provisional add marker
  const geoCache = useRef({});
  const [mapReady, setMapReady] = useState(false);
  const [status, setStatus] = useState(null);
  const [summary, setSummary] = useState(null);
  const [basemap, setBasemap] = useState("mapbox://styles/mapbox/light-v11");
  const [showProfile, setShowProfile] = useState(vehicles.includes("Artic Tipper (44t)") ? "Artic Tipper (44t)" : vehicles[0]);
  // which of the baked geometries the map draws. A route now has two directions and up
  // to three HERE options each, so without a pick the map would stack six lines per route.
  const [showLeg, setShowLeg] = useState("loaded");
  const [showAlt, setShowAlt] = useState(0);
  // which Routes row has its analysis panel open (Step C)
  const [openRow, setOpenRow] = useState(null);
  const [bakeProfiles, setBakeProfiles] = useState(["Artic Tipper (44t)"]);
  const [token, setToken] = useState(() => { try { return localStorage.getItem("rbe_admin_token") || ""; } catch(e){ return ""; } });
  const [baking, setBaking] = useState(false);
  const [bakeMsg, setBakeMsg] = useState("");
  const [overwrite, setOverwrite] = useState(false);
  const [selected, setSelected] = useState(null);

  // ---- sub-tabs (Locations | Routes). One map, shared: only the right-hand panel
  // and the bottom table swap, so the Mapbox instance is never torn down. ----
  const [subTab, setSubTab] = useState("locations");
  const subTabRef = useRef("locations");
  useEffect(() => { subTabRef.current = subTab; }, [subTab]);

  // The right column only matches the map's height where they sit side by side;
  // stacked on narrow screens it flows normally.
  const [isWide, setIsWide] = useState(() => {
    try { return window.matchMedia("(min-width: 1024px)").matches; } catch(e){ return true; }
  });
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia("(min-width: 1024px)"); } catch(e){ return; }
    const on = () => setIsWide(mq.matches);
    mq.addEventListener ? mq.addEventListener("change", on) : mq.addListener(on);
    return () => { mq.removeEventListener ? mq.removeEventListener("change", on) : mq.removeListener(on); };
  }, []);

  // ---- reactive locations (for the route-authoring pickers) ----
  const [locs, setLocs] = useState([]);
  const featProps = (gj) => (gj.features || []).map(f => ({ ...f.properties }));

  // ---- route authoring (Phase 1b) ----
  const [rOrigin, setROrigin] = useState("");
  const [rDest, setRDest] = useState("");
  // Vehicle profiles the new route is baked for on create. Routes no longer carry a
  // material — validity is origin.supplies n dest.receives instead.
  const [rVehicles, setRVehicles] = useState(
    () => (vehicles.includes("Artic Tipper (44t)") ? ["Artic Tipper (44t)"] : vehicles.slice(0, 1)));
  const [rId, setRId] = useState("");
  const [rIdTouched, setRIdTouched] = useState(false);
  const [rIpt, setRIpt] = useState("");
  const [routeBusy, setRouteBusy] = useState(false);
  const [routeMsg, setRouteMsg] = useState("");

  // ---- location management (Phase 1) ----
  const [mode, setMode] = useState("view");        // 'view' | 'add' | 'edit'
  const [form, setForm] = useState(null);          // {id?, name, role, loc_type, supplies[], receives[], lat, lon}
  const [savingLoc, setSavingLoc] = useState(false);
  const [locMsg, setLocMsg] = useState("");
  // refs so once-bound map handlers always read current values
  const modeRef = useRef("view");
  const bakeProfilesRef = useRef(bakeProfiles);
  const tokenRef = useRef(token);
  const justDragged = useRef(false);
  const cbRef = useRef({});
  useEffect(() => { modeRef.current = mode; }, [mode]);
  useEffect(() => { bakeProfilesRef.current = bakeProfiles; }, [bakeProfiles]);
  useEffect(() => { tokenRef.current = token; }, [token]);

  const fetchStatus = () =>
    Promise.all([
      fetch(`${API}/routes/status`).then(r => r.json()),
      fetch(`${API}/routes/summary`).then(r => r.json()),
    ]).then(([st, sm]) => { setStatus(st); setSummary(sm); });

  useEffect(() => { fetchStatus().catch(() => setStatus([])); }, []);

  // lean the shared map towards the active sub-tab (paint only — no layer churn)
  const applyEmphasis = (m) => {
    const E = EMPHASIS[subTabRef.current] || EMPHASIS.routes;
    try {
      m.setPaintProperty("route-line", "line-width", E.route);
      m.setPaintProperty("route-line", "line-opacity", E.routeOp);
      m.setPaintProperty("route-casing", "line-opacity", E.casingOp);
      m.setPaintProperty("node-dots", "circle-radius", E.node);
      m.setPaintProperty("node-dots", "circle-stroke-width", E.nodeStroke);
    } catch(e){}
  };

  // add sources + layers; called on first load AND after every basemap change
  const addNetworkLayers = (m) => {
    if(!m.getSource("routes")) m.addSource("routes", { type: "geojson", data: routesFC.current });
    if(!m.getSource("nodes")) m.addSource("nodes", { type: "geojson", data: nodesFC.current });
    if(!m.getSource("sel")) m.addSource("sel", { type: "geojson", data: selFC.current });
    if(!m.getSource("selnode")) m.addSource("selnode", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    if(!m.getSource("newnode")) m.addSource("newnode", { type: "geojson", data: newFC.current });
    // failed routes share the source but are filtered apart, so an unroutable pair is
    // visibly impossible rather than simply absent
    if(!m.getLayer("route-casing")) m.addLayer({ id: "route-casing", type: "line", source: "routes",
      filter: ["!=", ["get", "failed"], true],
      paint: { "line-color": "#ffffff", "line-width": 5, "line-opacity": 0.85 } });
    if(!m.getLayer("route-line")) m.addLayer({ id: "route-line", type: "line", source: "routes",
      filter: ["!=", ["get", "failed"], true],
      paint: { "line-color": ROUTE_COLOR, "line-width": 3 } });
    if(!m.getLayer("route-failed")) m.addLayer({ id: "route-failed", type: "line", source: "routes",
      filter: ["==", ["get", "failed"], true],
      paint: { "line-color": FAILED_COLOR, "line-width": 2, "line-opacity": 0.9,
               "line-dasharray": [2, 2] } });
    if(!m.getLayer("sel-line")) m.addLayer({ id: "sel-line", type: "line", source: "sel",
      paint: { "line-color": "#BF2E55", "line-width": 5 } });
    if(!m.getLayer("selnode-ring")) m.addLayer({ id: "selnode-ring", type: "circle", source: "selnode",
      paint: { "circle-radius": 11, "circle-color": "rgba(0,0,0,0)", "circle-stroke-width": 3, "circle-stroke-color": "#BF2E55" } });
    if(!m.getLayer("node-dots")) m.addLayer({ id: "node-dots", type: "circle", source: "nodes",
      paint: { "circle-radius": 5, "circle-color": nodeExpr(), "circle-stroke-width": 1.5, "circle-stroke-color": "#fff" } });
    if(!m.getLayer("newnode-dot")) m.addLayer({ id: "newnode-dot", type: "circle", source: "newnode",
      paint: { "circle-radius": 8, "circle-color": "#FFC101", "circle-stroke-width": 3, "circle-stroke-color": "#003787", "circle-opacity": 0.95 } });
    applyEmphasis(m);   // a basemap switch resets paint, so re-lean towards the active sub-tab
  };

  // init the map once
  useEffect(() => {
    if(mapObj.current || !mapDiv.current || !window.mapboxgl) return;
    window.mapboxgl.accessToken = mapbox_token;
    const m = new window.mapboxgl.Map({ container: mapDiv.current, style: basemap, center: [24.7, 58.5], zoom: 7 });
    m.addControl(new window.mapboxgl.NavigationControl(), "top-right");
    // drag bookkeeping for moving a node
    const drag = { id: null, moved: false };
    const onMove = (e) => {
      if(!drag.id) return;
      drag.moved = true;
      const feat = nodesFC.current.features.find(f => f.properties.id === drag.id);
      if(feat){ feat.geometry.coordinates = [e.lngLat.lng, e.lngLat.lat];
        const s = m.getSource("nodes"); if(s) s.setData(nodesFC.current); }
    };
    const onUp = (e) => {
      const id = drag.id, moved = drag.moved;
      drag.id = null; drag.moved = false;
      m.off("mousemove", onMove);
      m.getCanvas().style.cursor = "";
      if(!id) return;
      if(moved){
        justDragged.current = true;
        setTimeout(() => { justDragged.current = false; }, 80);
        (cbRef.current.commitMove || (()=>{}))(id, e.lngLat.lng, e.lngLat.lat);
      } else {
        (cbRef.current.selectNode || (()=>{}))(id);
      }
    };

    m.on("load", () => {
      addNetworkLayers(m);
      // node drag (only in view/edit; add-mode clicks drop new points)
      m.on("mousedown", "node-dots", (e) => {
        if(modeRef.current === "add") return;
        e.preventDefault();
        drag.id = e.features[0].properties.id; drag.moved = false;
        m.getCanvas().style.cursor = "grabbing";
        m.on("mousemove", onMove);
        m.once("mouseup", onUp);
      });
      // unified click: place (add mode) / select node / select route
      m.on("click", (e) => {
        if(modeRef.current === "add"){ (cbRef.current.placeAt || (()=>{}))(e.lngLat.lng, e.lngLat.lat); return; }
        if(justDragged.current) return;
        const box = [[e.point.x - 6, e.point.y - 6], [e.point.x + 6, e.point.y + 6]];
        const hitNode = m.queryRenderedFeatures(box, { layers: ["node-dots"] });
        if(hitNode.length) return;    // node taps are handled by mousedown/up
        const layers = ["route-line", "route-failed"].filter(l => m.getLayer(l));
        const hitRoute = m.queryRenderedFeatures(e.point, { layers });
        if(hitRoute.length) (cbRef.current.selectRoute || (()=>{}))(hitRoute[0].properties.route_id);
      });
      m.on("mouseenter", "node-dots", () => { if(modeRef.current !== "add") m.getCanvas().style.cursor = "move"; });
      m.on("mouseleave", "node-dots", () => { m.getCanvas().style.cursor = modeRef.current === "add" ? "crosshair" : ""; });
      m.on("mouseenter", "route-line", () => { if(modeRef.current === "view") m.getCanvas().style.cursor = "pointer"; });
      m.on("mouseleave", "route-line", () => { m.getCanvas().style.cursor = modeRef.current === "add" ? "crosshair" : ""; });
      setMapReady(true);
    });
    m.on("style.load", () => { addNetworkLayers(m); });  // re-add after a basemap switch
    // Mapbox measures its container on init, before the flex/grid layout has settled,
    // so nudge it to re-measure once things are laid out (and whenever the window resizes).
    const doResize = () => { try { m.resize(); } catch(e){} };
    m.on("load", doResize);
    const t1 = setTimeout(doResize, 100);
    const t2 = setTimeout(doResize, 400);
    window.addEventListener("resize", doResize);
    mapObj.current = m;
    return () => {
      clearTimeout(t1); clearTimeout(t2);
      window.removeEventListener("resize", doResize);
      if(mapObj.current){ mapObj.current.remove(); mapObj.current = null; }
    };
  }, []);

  const changeStyle = (val) => {
    setBasemap(val);
    const m = mapObj.current;
    if(!m) return;
    if(val === "maaamet-ortho") m.setStyle(maaametStyle());
    else m.setStyle(val);
  };

  // load geometry for the shown profile whenever it (or the data) changes
  useEffect(() => {
    if(!mapReady) return;
    const m = mapObj.current;
    const q = new URLSearchParams({ profile: showProfile, leg: showLeg, alt_index: String(showAlt) });
    fetch(`${API}/routes/geojson?${q.toString()}`).then(r => r.json()).then(gj => {
      routesFC.current = gj;
      geoCache.current = {};
      (gj.features || []).forEach(f => { geoCache.current[f.properties.route_id] = f.geometry.coordinates; });
      if(m.getSource("routes")) m.getSource("routes").setData(gj);
      // the selected route's highlight belongs to whichever geometry is now shown
      if(selected && geoCache.current[selected]){
        selFC.current = { type: "Feature", properties: {},
          geometry: { type: "LineString", coordinates: geoCache.current[selected] } };
        if(m.getSource("sel")) m.getSource("sel").setData(selFC.current);
      }
    }).catch(() => {});
    fetch(`${API}/locations/geojson`).then(r => r.json()).then(gj => {
      nodesFC.current = gj;
      setLocs(featProps(gj));
      if(m.getSource("nodes")) m.getSource("nodes").setData(gj);
    }).catch(() => {});
  }, [mapReady, showProfile, showLeg, showAlt, status]);

  const boundsOf = (coords) => {
    const b = new window.mapboxgl.LngLatBounds();
    coords.forEach(c => b.extend(c));
    return b;
  };
  const selectRoute = (id) => {
    setSelected(id);
    const coords = geoCache.current[id];
    const m = mapObj.current;
    if(coords && m){
      selFC.current = { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } };
      m.getSource("sel").setData(selFC.current);
      m.fitBounds(boundsOf(coords), { padding: 60, maxZoom: 13, duration: 700 });
    }
  };

  const refresh = async () => { await fetchStatus(); };

  // re-pull locations + status; the [status] effect then reloads route geometry
  const reloadNetwork = async () => {
    const m = mapObj.current;
    try {
      const [loc, st, sm] = await Promise.all([
        fetch(`${API}/locations/geojson`).then(r => r.json()),
        fetch(`${API}/routes/status`).then(r => r.json()),
        fetch(`${API}/routes/summary`).then(r => r.json()),
      ]);
      nodesFC.current = loc;
      setLocs(featProps(loc));
      if(m && m.getSource("nodes")) m.getSource("nodes").setData(loc);
      setStatus(st); setSummary(sm);
    } catch(e){ /* leave existing data in place */ }
  };

  // shared HERE bake loop. clear=true wipes geometry first (full re-bake).
  const bakeLoop = async (profiles, clear) => {
    for(const prof of profiles){
      if(clear){
        const cqs = new URLSearchParams({ profile: prof });
        if(tokenRef.current) cqs.set("token", tokenRef.current);
        await fetch(`${API}/admin/clear-geometry?${cqs.toString()}`, { method: "POST" });
        setBakeMsg(`${prof}: cleared old geometry, re-routing…`);
      }
      let remaining = 1, pass = 0;
      while(remaining > 0 && pass < 25){
        pass++;
        const qs = new URLSearchParams({ profile: prof, limit: "30" });
        if(tokenRef.current) qs.set("token", tokenRef.current);
        const r = await fetch(`${API}/admin/bake-routes?${qs.toString()}`, { method: "POST" });
        const j = await r.json();
        if(j.error){ setBakeMsg(`${prof}: ${j.error}`); remaining = 0; break; }
        remaining = j.remaining ?? 0;
        // 'remaining' counts legs now, not routes — each route is routed out and back
        setBakeMsg(`${prof}: baked ${j.baked} leg(s), ${remaining} remaining…`);
      }
    }
  };

  const bake = async () => {
    if(!bakeProfiles.length){ setBakeMsg("Pick at least one vehicle to bake."); return; }
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setBaking(true); setBakeMsg("Starting…");
    try {
      await bakeLoop(bakeProfiles, overwrite);
      setBakeMsg("Bake complete — refreshing map.");
      await reloadNetwork();
      setBakeMsg("Done.");
    } catch(e){ setBakeMsg("Bake failed: " + e.message); }
    setBaking(false);
  };

  const toggleBakeProfile = (v) =>
    setBakeProfiles(ps => ps.includes(v) ? ps.filter(x => x !== v) : [...ps, v]);

  // ---- location add / edit / move / delete ----
  const startAdd = () => {
    setSubTab("locations");
    setSelected(null); setLocMsg("");
    setForm({ id: null, name: "", role: "origin", loc_type: "Quarry", supplies: [], receives: [],
      lat: "", lon: "", gate_lat: "", gate_lon: "" });
    setMode("add");
  };
  const openEditForNode = (id) => {
    const feat = nodesFC.current.features.find(f => f.properties.id === id);
    if(!feat) return;
    const p = feat.properties;
    const supplies = asArray(p.supplies).length ? asArray(p.supplies) : asArray(p.materials);
    setSelected(null); setLocMsg("");
    setForm({ id: p.id, name: p.name || "", role: p.role || "both", loc_type: p.loc_type || "Other",
      supplies, receives: asArray(p.receives),
      lat: feat.geometry.coordinates[1], lon: feat.geometry.coordinates[0],
      // blank means no gate surveyed — routing falls back to the marker above
      gate_lat: p.gate_lat == null ? "" : p.gate_lat,
      gate_lon: p.gate_lon == null ? "" : p.gate_lon });
    setMode("edit");
  };
  // Locations-table row click: centre the map on the node and open it for editing.
  const locateNode = (id) => {
    const feat = nodesFC.current.features.find(f => f.properties.id === id);
    openEditForNode(id);
    const m = mapObj.current;
    if(feat && m) m.easeTo({ center: feat.geometry.coordinates, zoom: Math.max(m.getZoom(), 11), duration: 700 });
  };
  const cancelForm = () => { setForm(null); setMode("view"); setLocMsg(""); };
  const setField = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const toggleCat = (key, cat) => setForm(f => {
    const list = f[key] || [];
    return { ...f, [key]: list.includes(cat) ? list.filter(c => c !== cat) : [...list, cat] };
  });

  // a gate only counts when both halves parse; half a coordinate is no coordinate
  const gateFrom = (f) => {
    const gLat = parseFloat(f.gate_lat), gLon = parseFloat(f.gate_lon);
    return (isFinite(gLat) && isFinite(gLon)) ? { gate_lat: gLat, gate_lon: gLon }
                                              : { gate_lat: null, gate_lon: null };
  };

  const bodyFromForm = (f, lat, lon) => ({
    name: (f.name || "").trim(), role: f.role, loc_type: f.loc_type || f.role,
    supplies: f.role === "destination" ? [] : (f.supplies || []),
    receives: f.role === "origin" ? [] : (f.receives || []),
    materials: f.role === "destination" ? [] : (f.supplies || []),
    lat, lon, ...gateFrom(f),
  });

  const saveLoc = async () => {
    if(!form) return;
    if(!form.name.trim()){ setLocMsg("Name is required."); return; }
    const lat = parseFloat(form.lat), lon = parseFloat(form.lon);
    if(!isFinite(lat) || !isFinite(lon)){ setLocMsg("Enter valid coordinates — click the map or type them."); return; }
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setSavingLoc(true); setLocMsg(form.id ? "Saving…" : "Creating…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    const body = bodyFromForm(form, lat, lon);
    try {
      const url = form.id ? `${API}/admin/locations/${encodeURIComponent(form.id)}${qs}` : `${API}/admin/locations${qs}`;
      const res = await fetch(url, { method: form.id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      const affected = j.affected_routes || [];
      await reloadNetwork();
      if(form.id && affected.length && bakeProfilesRef.current.length){
        setLocMsg(`Saved — re-baking ${affected.length} affected route(s)…`);
        await bakeLoop(bakeProfilesRef.current, false);
        await reloadNetwork();
        setLocMsg("Saved and re-baked.");
      } else if(form.id && affected.length){
        setLocMsg(`Saved. ${affected.length} route(s) need re-baking — pick profile(s) and Bake.`);
      } else {
        setLocMsg(form.id ? "Saved." : "Location created.");
      }
      setForm(null); setMode("view");
    } catch(e){ setLocMsg("Couldn't save: " + e.message); }
    setSavingLoc(false);
  };

  const deleteLoc = async () => {
    if(!form || !form.id) return;
    if(!confirm(`Delete ${form.name || form.id}? This also removes any routes that use it.`)) return;
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setSavingLoc(true); setLocMsg("Deleting…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/locations/${encodeURIComponent(form.id)}${qs}`, { method: "DELETE" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      await reloadNetwork();
      setLocMsg(`Deleted. Removed ${(j.deleted_routes || []).length} dependent route(s).`);
      setForm(null); setMode("view");
    } catch(e){ setLocMsg("Delete failed: " + e.message); }
    setSavingLoc(false);
  };

  // drag-drop commit: PUT new coords, then auto-rebake affected routes (if profiles picked)
  const commitMove = async (id, lng, lat) => {
    const feat = nodesFC.current.features.find(f => f.properties.id === id);
    const p = feat ? feat.properties : {};
    const supplies = asArray(p.supplies).length ? asArray(p.supplies) : asArray(p.materials);
    const body = {
      name: p.name || id, role: p.role || "both", loc_type: p.loc_type || p.role || "both",
      supplies, receives: asArray(p.receives), materials: supplies,
      lat: +(+lat).toFixed(6), lon: +(+lng).toFixed(6),
      // carry the existing gate through — this body is a full replace, so omitting it
      // would clear a surveyed gate just because someone nudged the marker
      gate_lat: p.gate_lat == null ? null : p.gate_lat,
      gate_lon: p.gate_lon == null ? null : p.gate_lon,
    };
    const qs = tokenRef.current ? `?token=${encodeURIComponent(tokenRef.current)}` : "";
    setLocMsg(`Moving ${p.name || id}…`);
    try {
      const res = await fetch(`${API}/admin/locations/${encodeURIComponent(id)}${qs}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const j = await res.json();
      if(!res.ok || j.error) throw new Error(j.error || res.status);
      const affected = j.affected_routes || [];
      if(affected.length && bakeProfilesRef.current.length){
        setLocMsg(`Moved — re-baking ${affected.length} route(s)…`);
        await bakeLoop(bakeProfilesRef.current, false);
        await reloadNetwork();
        setLocMsg("Moved and re-baked.");
      } else if(affected.length){
        await reloadNetwork();
        setLocMsg(`Moved. ${affected.length} route(s) cleared — pick profile(s) and Bake to re-route.`);
      } else {
        await reloadNetwork();
        setLocMsg("Moved.");
      }
    } catch(e){
      setLocMsg("Move failed: " + e.message);
      await reloadNetwork();   // snap the node back to server truth
    }
  };

  // expose the latest closures to the once-bound map handlers
  cbRef.current.placeAt = (lng, lat) => setForm(f => f ? { ...f, lat: +(+lat).toFixed(6), lon: +(+lng).toFixed(6) } : f);
  // clicking the map follows the thing you clicked to its sub-tab
  cbRef.current.selectNode = (id) => { setSubTab("locations"); openEditForNode(id); };
  cbRef.current.selectRoute = (id) => { setSubTab("routes"); selectRoute(id); };
  cbRef.current.commitMove = commitMove;

  // ---- route authoring: derived option validity (invalid shown but disabled) ----
  const locById = useMemo(() => Object.fromEntries(locs.map(l => [l.id, l])), [locs]);
  const originOpts = useMemo(() => locs.filter(l => l.role === "origin" || l.role === "both"), [locs]);
  const destOpts = useMemo(() => locs.filter(l => l.role === "destination" || l.role === "both"), [locs]);
  const suppliesOf = (id) => asArray(locById[id] && (locById[id].supplies || locById[id].materials));
  const receivesOf = (id) => asArray(locById[id] && locById[id].receives);
  const matsFor = (oId, dId) => {
    const s = suppliesOf(oId), r = receivesOf(dId);
    return s.filter(x => r.includes(x));
  };
  const destValid = (dId) => rOrigin && dId !== rOrigin && matsFor(rOrigin, dId).length > 0;
  const validMats = useMemo(() => (rOrigin && rDest) ? matsFor(rOrigin, rDest) : [], [rOrigin, rDest, locs]);

  const nextRouteId = (rows) => {
    let max = 0;
    (rows || []).forEach(r => { const m = /^R(\d+)$/.exec(r.id || ""); if(m) max = Math.max(max, +m[1]); });
    return "R" + String(max + 1).padStart(3, "0");
  };
  // keep the (editable) id field prefilled with the next free R00n until the user edits it
  useEffect(() => { if(!rIdTouched) setRId(nextRouteId(status)); }, [status, rIdTouched]);
  // if the origin changes and the chosen destination no longer shares a material, drop it
  useEffect(() => { if(rDest && !destValid(rDest)) setRDest(""); }, [rOrigin]);

  const toggleRVehicle = (v) =>
    setRVehicles(vs => vs.includes(v) ? vs.filter(x => x !== v) : [...vs, v]);

  // how many routes touch each location — for the Locations table's "Routes" column
  const routeCounts = useMemo(() => {
    const c = {};
    (status || []).forEach(r => {
      if(r.origin_id) c[r.origin_id] = (c[r.origin_id] || 0) + 1;
      if(r.dest_id) c[r.dest_id] = (c[r.dest_id] || 0) + 1;
    });
    return c;
  }, [status]);

  const createRoute = async () => {
    if(!rOrigin || !rDest){ setRouteMsg("Pick an origin and a destination."); return; }
    if(!destValid(rDest)){ setRouteMsg("That origin and destination share no material."); return; }
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setRouteBusy(true); setRouteMsg("Creating route…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/routes${qs}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ origin_id: rOrigin, dest_id: rDest,
          route_id: (rId || "").trim() || null, ipt: (rIpt || "").trim() || null }),
      });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,140)}`); }
      const j = await res.json();
      if(j.error) throw new Error(j.error);
      const newId = j.id;
      // bake the new route for the vehicles picked on this panel
      const failed = [];
      if(rVehicles.length){
        for(let i = 0; i < rVehicles.length; i++){
          const prof = rVehicles[i];
          setRouteMsg(`Created ${newId} — baking ${prof} (${i + 1}/${rVehicles.length})…`);
          const bqs = new URLSearchParams({ route_id: newId, profile: prof });
          if(tokenRef.current) bqs.set("token", tokenRef.current);
          try {
            const br = await fetch(`${API}/admin/bake-route?${bqs.toString()}`, { method: "POST" });
            const bj = await br.json();
            if(bj.error) failed.push(`${vehShort(prof)}: ${bj.error}`);
          } catch(e){ failed.push(`${vehShort(prof)}: ${e.message}`); }
        }
      }
      await reloadNetwork();
      setSubTab("routes");
      setRouteMsg(
        failed.length ? `Route ${newId} created — ${rVehicles.length - failed.length}/${rVehicles.length} baked. ${failed.join(" · ")}`
        : rVehicles.length ? `Route ${newId} created and baked for ${rVehicles.length} vehicle(s).`
        : `Route ${newId} created — no vehicles ticked, so it has no geometry yet.`
      );
      setRDest(""); setRIpt(""); setRIdTouched(false);   // next id repopulates
    } catch(e){ setRouteMsg("Couldn't create route: " + e.message); }
    setRouteBusy(false);
  };

  const deleteRoute = async (id) => {
    if(!confirm(`Delete route ${id}? (Its cached geometry goes too.)`)) return;
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/routes/${encodeURIComponent(id)}${qs}`, { method: "DELETE" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,120)}`); }
      if(selected === id) setSelected(null);
      await reloadNetwork();
      setRouteMsg(`Deleted ${id}.`);
    } catch(e){ setRouteMsg("Delete failed: " + e.message); }
  };

  const clearRoutes = async () => {
    if(!confirm("Clear ALL routes and their geometry? Locations are kept. This is for retiring the V2 seed and can't be undone.")) return;
    if(!confirm("Really clear every route? Type-check: this removes all of them.")) return;
    try { localStorage.setItem("rbe_admin_token", token); } catch(e){}
    setRouteBusy(true); setRouteMsg("Clearing all routes…");
    const qs = token ? `?token=${encodeURIComponent(token)}` : "";
    try {
      const res = await fetch(`${API}/admin/clear-routes${qs}`, { method: "POST" });
      if(!res.ok){ const t = await res.text(); throw new Error(`${res.status} ${t.slice(0,120)}`); }
      const j = await res.json();
      setSelected(null);
      await reloadNetwork();
      setRouteMsg(`Cleared ${j.cleared ?? 0} route(s). Locations kept.`);
    } catch(e){ setRouteMsg("Clear failed: " + e.message); }
    setRouteBusy(false);
  };

  // cursor reflects add mode
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    try { m.getCanvas().style.cursor = mode === "add" ? "crosshair" : ""; } catch(e){}
  }, [mode, mapReady]);

  // sub-tab switch: re-lean the shared map
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    applyEmphasis(m);
  }, [subTab, mapReady]);

  // leaving Locations abandons any half-finished add/edit, so add mode can't linger
  // (crosshair cursor, map clicks dropping pins) while its panel isn't on screen
  useEffect(() => {
    if(subTab !== "locations" && mode !== "view"){ setForm(null); setMode("view"); setLocMsg(""); }
  }, [subTab]);

  // provisional add marker follows the form coords
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const s = m.getSource("newnode"); if(!s) return;
    const lat = form ? parseFloat(form.lat) : NaN, lon = form ? parseFloat(form.lon) : NaN;
    const show = mode === "add" && isFinite(lat) && isFinite(lon);
    newFC.current = show
      ? { type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [lon, lat] } }] }
      : { type: "FeatureCollection", features: [] };
    s.setData(newFC.current);
  }, [mode, form && form.lat, form && form.lon, mapReady]);

  // highlight ring around the node being edited
  useEffect(() => {
    const m = mapObj.current; if(!m || !mapReady) return;
    const s = m.getSource("selnode"); if(!s) return;
    const lat = form ? parseFloat(form.lat) : NaN, lon = form ? parseFloat(form.lon) : NaN;
    if(mode === "edit" && form && form.id && isFinite(lat) && isFinite(lon)){
      s.setData({ type: "FeatureCollection", features: [{ type: "Feature", properties: {}, geometry: { type: "Point", coordinates: [lon, lat] } }] });
    } else {
      s.setData({ type: "FeatureCollection", features: [] });
    }
  }, [mode, form && form.id, form && form.lat, form && form.lon, mapReady]);

  const sel = "border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm bg-white";
  const bakedCount = (summary && summary.profiles && summary.profiles[showProfile]) ? summary.profiles[showProfile].baked : 0;
  const totalRoutes = summary ? summary.routes : 0;
  const onLoc = subTab === "locations";
  // side by side, the panel column matches the map and scrolls inside itself, so the
  // map never slides out from under whatever you're editing
  const panelStyle = isWide ? { height: MAP_H, overflowY: "auto" } : undefined;
  const th = "px-3 py-2 text-left font-semibold";

  return (
    <div className="max-w-7xl mx-auto p-5 space-y-4">
      <div className="flex items-end justify-between flex-wrap gap-3">
        <div>
          <h2 className="text-lg font-bold text-[color:var(--navy-deep)]">Data Management</h2>
          <p className="text-sm text-slate-500">Truck-routed network from HERE. {totalRoutes} routes · {summary ? summary.locations : 0} locations · {bakedCount}/{totalRoutes} baked for {showProfile}.</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-xs text-slate-400">Basemap</span>
          <select value={basemap} onChange={e => changeStyle(e.target.value)} className={sel}>
            {BASEMAPS.map(([label, val]) => <option key={val} value={val}>{label}</option>)}
          </select>
          <span className="text-xs text-slate-400 ml-1">Show</span>
          <select value={showProfile} onChange={e => setShowProfile(e.target.value)} className={sel}>
            {vehicles.map(v => <option key={v}>{v}</option>)}
          </select>
          {/* the map can only draw one of the baked geometries at a time */}
          <select value={showLeg} onChange={e => setShowLeg(e.target.value)} className={sel} title="Which direction to draw">
            <option value="loaded">Laden out</option>
            <option value="return">Empty back</option>
          </select>
          <select value={showAlt} onChange={e => setShowAlt(+e.target.value)} className={sel} title="Which HERE option to draw">
            <option value={0}>Best route</option>
            <option value={1}>Alt 1</option>
            <option value={2}>Alt 2</option>
          </select>
        </div>
      </div>

      <div className="flex gap-1 border-b border-slate-200">
        {[["locations", "Locations", locs.length], ["routes", "Routes", (status || []).length]].map(([k, label, n]) => (
          <button key={k} onClick={() => setSubTab(k)}
            className={"px-4 py-2 text-sm font-medium border-b-2 -mb-px transition " +
              (subTab === k ? "border-[color:var(--navy)] text-[color:var(--navy)]"
                            : "border-transparent text-slate-500 hover:text-slate-800")}>
            {label} <span className="font-normal text-slate-400">{n}</span>
          </button>
        ))}
      </div>

      {summary && !summary.here_configured && (
        <div className="rounded-lg border border-amber-300 bg-amber-50 p-3 text-sm text-amber-800">
          HERE_API_KEY isn't set on the server yet — add it in Render → Environment, then bake.
        </div>
      )}

      {mode === "add" && (
        <div className="rounded-lg border border-blue-300 bg-blue-50 p-3 text-sm text-blue-800 flex items-center justify-between gap-3">
          <span><strong>Add location:</strong> click the map to drop the marker, then fill in the panel and Create. Or type coordinates directly.</span>
          <button onClick={cancelForm} className="text-blue-700 hover:underline whitespace-nowrap">Cancel</button>
        </div>
      )}

      <div className="grid lg:grid-cols-3 gap-4">
        {/* ONE map instance, shared by both sub-tabs — this div is never unmounted */}
        <div className="lg:col-span-2 card overflow-hidden">
          <div ref={mapDiv} style={{ height: MAP_H, width: "100%" }} />
        </div>

        <div className="space-y-4" style={panelStyle}>
          {onLoc && (
          <div className="card p-4">
            <div className="flex items-center justify-between mb-2">
              <div className="text-sm font-semibold text-slate-700">Locations</div>
              {mode === "view" && (
                <button onClick={startAdd} className="text-xs font-semibold px-2.5 py-1 rounded-md text-white" style={{ background: "var(--navy)" }}>+ Add location</button>
              )}
            </div>

            {mode === "view" && (
              <p className="text-[11px] text-slate-400">Click a node to edit it, or drag it to move — routes it touches re-bake automatically for the profiles ticked below. Deleting a location also removes routes that use it.</p>
            )}

            {form && (
              <div className="space-y-3">
                <div className="text-[11px] uppercase tracking-wide text-slate-400">{form.id ? `Editing ${form.id}` : "New location"}</div>
                <label className="block">
                  <span className="text-[11px] uppercase tracking-wide text-slate-400">Name</span>
                  <input value={form.name} onChange={e => setField("name", e.target.value)} placeholder="e.g. Väo quarry"
                    className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                </label>
                <div className="grid grid-cols-2 gap-2">
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Role</span>
                    <select value={form.role} onChange={e => setField("role", e.target.value)} className={"mt-1 w-full " + sel}>
                      {ROLE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                    </select>
                  </label>
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Type</span>
                    <select value={form.loc_type} onChange={e => setField("loc_type", e.target.value)} className={"mt-1 w-full " + sel}>
                      {[...new Set([form.loc_type, ...LOC_TYPES].filter(Boolean))].map(t => <option key={t}>{t}</option>)}
                    </select>
                  </label>
                </div>

                {form.role !== "destination" && (
                  <div>
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Supplies · materials it provides</span>
                    <div className="mt-1 space-y-1">
                      {materials.map(cat => (
                        <label key={cat} className="flex items-center gap-2 text-xs text-slate-700">
                          <input type="checkbox" checked={(form.supplies || []).includes(cat)} onChange={() => toggleCat("supplies", cat)} style={{ accentColor: "#003787" }} />
                          {cat}
                        </label>
                      ))}
                    </div>
                  </div>
                )}
                {form.role !== "origin" && (
                  <div>
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Receives · materials it accepts</span>
                    <div className="mt-1 space-y-1">
                      {materials.map(cat => (
                        <label key={cat} className="flex items-center gap-2 text-xs text-slate-700">
                          <input type="checkbox" checked={(form.receives || []).includes(cat)} onChange={() => toggleCat("receives", cat)} style={{ accentColor: "#039E86" }} />
                          {cat}
                        </label>
                      ))}
                    </div>
                  </div>
                )}

                <div className="grid grid-cols-2 gap-2">
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Latitude</span>
                    <input value={form.lat} onChange={e => setField("lat", e.target.value)} inputMode="decimal" placeholder="58.5"
                      className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                  </label>
                  <label className="block">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Longitude</span>
                    <input value={form.lon} onChange={e => setField("lon", e.target.value)} inputMode="decimal" placeholder="24.7"
                      className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                  </label>
                </div>

                {/* Access gate — where trucks actually join the road, which for a big
                    site is nowhere near the marker in the middle of it. Optional: left
                    blank, routing uses the coordinates above. */}
                <div className="rounded-lg border border-slate-200 bg-slate-50/60 p-2.5">
                  <div className="flex items-baseline justify-between gap-2">
                    <span className="text-[11px] uppercase tracking-wide text-slate-400">Access gate (optional)</span>
                    {(form.gate_lat !== "" || form.gate_lon !== "") && (
                      <button onClick={() => setForm(f => ({ ...f, gate_lat: "", gate_lon: "" }))}
                        className="text-[11px] text-slate-500 hover:underline">Clear</button>
                    )}
                  </div>
                  <div className="grid grid-cols-2 gap-2 mt-1">
                    <input value={form.gate_lat} onChange={e => setField("gate_lat", e.target.value)}
                      inputMode="decimal" placeholder="Gate lat"
                      className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                    <input value={form.gate_lon} onChange={e => setField("gate_lon", e.target.value)}
                      inputMode="decimal" placeholder="Gate lon"
                      className="w-full border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                  </div>
                  <p className="text-[11px] text-slate-400 mt-1.5">
                    Where vehicles join the public road. Leave blank to route to the marker itself.
                    Changing it re-routes everything touching this location.
                  </p>
                </div>

                <div className="flex items-center gap-2">
                  <button onClick={saveLoc} disabled={savingLoc}
                    className="px-4 py-2 rounded-lg text-white font-semibold text-sm disabled:opacity-50" style={{ background: "var(--navy)" }}>
                    {savingLoc ? "Working…" : (form.id ? "Save changes" : "Create location")}
                  </button>
                  <button onClick={cancelForm} className="px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-sm">Cancel</button>
                  {form.id && (
                    <button onClick={deleteLoc} disabled={savingLoc}
                      className="ml-auto px-3 py-2 rounded-lg text-white font-semibold text-sm disabled:opacity-50" style={{ background: "var(--red)" }}>Delete</button>
                  )}
                </div>
                <p className="text-[11px] text-slate-400">Admin token (if set on the server) is taken from the bake panel below.</p>
              </div>
            )}
            {locMsg && <p className="text-xs text-slate-500 mt-2">{locMsg}</p>}
          </div>
          )}

          {!onLoc && (
          <div className="card p-4">
            <div className="text-sm font-semibold text-slate-700 mb-2">Create route</div>
            <div className="space-y-2.5">
              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-slate-400">Origin (supplier)</span>
                <select value={rOrigin} onChange={e => setROrigin(e.target.value)} className={"mt-1 w-full " + sel}>
                  <option value="">— pick origin —</option>
                  {originOpts.map(l => <option key={l.id} value={l.id}>{l.name} ({l.id})</option>)}
                </select>
              </label>
              <label className="block">
                <span className="text-[11px] uppercase tracking-wide text-slate-400">Destination (site)</span>
                <select value={rDest} onChange={e => setRDest(e.target.value)} disabled={!rOrigin} className={"mt-1 w-full " + sel + (rOrigin ? "" : " opacity-50")}>
                  <option value="">— pick destination —</option>
                  {destOpts.map(l => {
                    const ok = destValid(l.id);
                    return <option key={l.id} value={l.id} disabled={!ok} style={{ color: ok ? undefined : "#cbd5e1" }}>
                      {l.name} ({l.id}){ok ? "" : " · no shared material"}
                    </option>;
                  })}
                </select>
              </label>

              {/* a route is valid when the origin supplies something the destination receives */}
              {rOrigin && rDest && (
                <div className="rounded-lg bg-slate-50 border border-slate-200 px-2.5 py-2">
                  <span className="text-[11px] uppercase tracking-wide text-slate-400">Shared materials</span>
                  <div className="mt-1 text-xs">
                    {validMats.length
                      ? <CatChips list={validMats} />
                      : <span style={{ color: "var(--red)" }}>None — this pair can't be routed. Set what each one supplies and receives on the Locations tab.</span>}
                  </div>
                </div>
              )}

              <div>
                <span className="text-[11px] uppercase tracking-wide text-slate-400">Vehicle(s) · baked on create</span>
                <div className="mt-1 space-y-1">
                  {vehicles.map(v => (
                    <label key={v} className="flex items-center gap-2 text-xs text-slate-700">
                      <input type="checkbox" checked={rVehicles.includes(v)} onChange={() => toggleRVehicle(v)} style={{ accentColor: "#003787" }} />
                      {v}
                    </label>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 gap-2">
                <label className="block">
                  <span className="text-[11px] uppercase tracking-wide text-slate-400">Route id</span>
                  <input value={rId} onChange={e => { setRId(e.target.value); setRIdTouched(true); }}
                    className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                </label>
                <label className="block">
                  <span className="text-[11px] uppercase tracking-wide text-slate-400">IPT (optional)</span>
                  <input value={rIpt} onChange={e => setRIpt(e.target.value)} placeholder="—"
                    className="mt-1 w-full border border-slate-300 rounded-lg px-2.5 py-2 text-sm outline-none focus:ring-2 focus:ring-[color:var(--blue)]" />
                </label>
              </div>
              <button onClick={createRoute} disabled={routeBusy || !rOrigin || !rDest || !destValid(rDest)}
                className="w-full py-2 rounded-lg text-white font-semibold text-sm disabled:opacity-50" style={{ background: "var(--navy)" }}>
                {routeBusy ? "Working…" : (rVehicles.length ? `Create & route · ${rVehicles.length} vehicle(s)` : "Create route (no geometry)")}
              </button>
              {routeMsg && <p className="text-xs text-slate-500">{routeMsg}</p>}
              <p className="text-[11px] text-slate-400">Destinations sharing no material with the origin are greyed out. Ticked vehicles are routed through HERE as soon as the route is created.</p>
            </div>
          </div>
          )}

          <div className="card p-4">
            <div className="text-sm font-semibold text-slate-700 mb-2">Vehicle profiles to bake</div>
            <div className="space-y-1.5">
              {vehicles.map(v => (
                <label key={v} className="flex items-center gap-2 text-sm text-slate-700">
                  <input type="checkbox" checked={bakeProfiles.includes(v)} onChange={() => toggleBakeProfile(v)} style={{ accentColor: "#003787" }} />
                  {v}
                  {summary && summary.profiles && summary.profiles[v] ? (
                    <span className="ml-auto text-xs text-slate-400">{summary.profiles[v].baked} baked{summary.profiles[v].errors ? `, ${summary.profiles[v].errors} err` : ""}</span>
                  ) : <span className="ml-auto text-xs text-slate-300">not baked</span>}
                </label>
              ))}
            </div>
            <input value={token} onChange={e => setToken(e.target.value)} placeholder="Admin token (only if set on server)"
              className="w-full mt-3 border border-slate-200 rounded-lg px-2.5 py-1.5 text-sm" />
            <label className="flex items-center gap-2 text-xs text-slate-600 mt-2">
              <input type="checkbox" checked={overwrite} onChange={e => setOverwrite(e.target.checked)} style={{ accentColor: "#BF2E55" }} />
              Overwrite existing geometry (re-bake all)
            </label>
            <button onClick={bake} disabled={baking}
              className="w-full mt-2 py-2 rounded-lg text-white font-semibold text-sm disabled:opacity-50" style={{ background: "var(--navy)" }}>
              {baking ? "Baking…" : (overwrite ? "Re-bake selected profiles" : "Bake selected profiles")}
            </button>
            {bakeMsg && <p className="text-xs text-slate-500 mt-2">{bakeMsg}</p>}
          </div>

          <Diagnostics token={token} routeId={selected} />

          <div className="card p-4">
            <div className="text-sm font-semibold text-slate-700 mb-2">Legend</div>
            <div className="flex flex-wrap gap-x-4 gap-y-1 text-xs text-slate-600">
              {Object.entries(NODE_COLORS).map(([k, v]) => (
                <span key={k} className="inline-flex items-center gap-1.5">
                  <span style={{ background: v, width: 10, height: 10, borderRadius: 999, display: "inline-block" }} />{k}
                </span>
              ))}
              <span className="inline-flex items-center gap-1.5">
                <span style={{ background: ROUTE_COLOR, width: 14, height: 3, borderRadius: 2, display: "inline-block" }} />Route
              </span>
              <span className="inline-flex items-center gap-1.5">
                <span style={{ background: "var(--red)", width: 14, height: 3, borderRadius: 2, display: "inline-block" }} />Selected
              </span>
              <span className="inline-flex items-center gap-1.5" title="HERE could not route this pair — shown as a straight line between the two points">
                <span style={{ width: 14, height: 3, display: "inline-block",
                  backgroundImage: `repeating-linear-gradient(to right, ${FAILED_COLOR} 0 4px, transparent 4px 7px)` }} />No route found
              </span>
            </div>
            <p className="text-[11px] text-slate-400 mt-2">Routes are drawn one colour here — this view is about the shape of the network. Material colouring lives on the forecasting dashboard and the public route map.</p>
            <p className="text-[11px] text-slate-400 mt-1">
              Every route is routed twice: laden out, empty back — the empty truck is lighter,
              so it can use roads the loaded one legally can't. A green vehicle chip means both
              directions are cached; <span className="font-semibold">amber ↦</span> means only the
              outbound is, which is enough to draw but not to work out a cycle time. Open a route
              row (▶) for the haul-cycle figures.
            </p>
            <p className="text-[11px] text-slate-400 mt-1">Tip: switch the basemap to Satellite or Estonia ortho to see routes sit exactly on the roads.</p>
          </div>
        </div>
      </div>

      {onLoc ? (
      <div className="card overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
          <span className="text-sm font-semibold text-slate-700">Locations <span className="text-slate-400 font-normal">· click a row to locate it on the map and open it for editing</span></span>
          <button onClick={startAdd}
            className="text-xs font-semibold px-2.5 py-1 rounded-md text-white" style={{ background: "var(--navy)" }}>
            + Add location
          </button>
        </div>
        <div className="overflow-auto" style={{ maxHeight: "40vh" }}>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs sticky top-0">
              <tr>
                <th className={th}>Location</th>
                <th className={th}>Type</th>
                <th className={th}>Role</th>
                <th className={th}>Supplies</th>
                <th className={th}>Receives</th>
                <th className="px-3 py-2 text-right font-semibold">Coordinates</th>
                <th className="px-3 py-2 text-center font-semibold">Gate</th>
                <th className="px-3 py-2 text-right font-semibold">Routes</th>
              </tr>
            </thead>
            <tbody>
              {locs.map(l => (
                <tr key={l.id} onClick={() => locateNode(l.id)}
                  className={"border-t border-slate-100 cursor-pointer " + ((form && form.id === l.id) ? "bg-blue-50" : "hover:bg-slate-50")}>
                  <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">
                    {l.name} <span className="text-slate-400 font-normal">{l.id}</span>
                  </td>
                  <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{l.loc_type || "—"}</td>
                  <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{ROLE_LABEL[l.role] || l.role || "—"}</td>
                  <td className="px-3 py-2"><CatChips list={l.supplies} /></td>
                  <td className="px-3 py-2"><CatChips list={l.receives} dir="in" /></td>
                  <td className="px-3 py-2 text-right tabular-nums text-xs text-slate-500 whitespace-nowrap">
                    {Number(l.lat).toFixed(5)}, {Number(l.lon).toFixed(5)}
                  </td>
                  <td className="px-3 py-2 text-center">
                    {(l.gate_lat != null && l.gate_lon != null)
                      ? <span title={`Routes via ${Number(l.gate_lat).toFixed(5)}, ${Number(l.gate_lon).toFixed(5)}`}
                          className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full whitespace-nowrap"
                          style={{ background: "rgba(3,158,134,.12)", color: "var(--green)" }}>set</span>
                      : <span className="text-slate-300" title="Routes to the marker itself">—</span>}
                  </td>
                  <td className="px-3 py-2 text-right tabular-nums">
                    {routeCounts[l.id]
                      ? routeCounts[l.id]
                      : <span className="text-slate-300">0</span>}
                  </td>
                </tr>
              ))}
              {!locs.length && <tr><td colSpan="8" className="px-3 py-6 text-center text-slate-400">No locations yet — add one with “+ Add location”.</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      ) : (
      <div className="card overflow-hidden">
        <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between gap-3">
          <span className="text-sm font-semibold text-slate-700">Routes <span className="text-slate-400 font-normal">· click a row to locate it on the map</span></span>
          <button onClick={clearRoutes} disabled={routeBusy || !(status && status.length)}
            className="text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200 text-[color:var(--red)] hover:bg-red-50 disabled:opacity-40">
            Clear all routes
          </button>
        </div>
        <div className="overflow-auto" style={{ maxHeight: "40vh" }}>
          <table className="w-full text-sm">
            <thead className="bg-slate-50 text-slate-500 text-xs sticky top-0">
              <tr>
                <th className="px-2 py-2 w-6"></th>
                <th className={th}>Route</th>
                <th className={th}>From → to</th>
                <th className={th}>IPT</th>
                <th className="px-3 py-2 text-right font-semibold">km ({vehShort(showProfile)})</th>
                <th className={th}>Vehicles</th>
                <th className="px-3 py-2 text-right font-semibold">Actions</th>
              </tr>
            </thead>
            <tbody>
              {(status || []).map(r => {
                const pinfo = r.profiles[showProfile];
                const open = openRow === r.id;
                return (
                  <React.Fragment key={r.id}>
                  <tr onClick={() => selectRoute(r.id)}
                    className={"border-t border-slate-100 cursor-pointer " + (selected === r.id ? "bg-blue-50" : "hover:bg-slate-50")}>
                    <td className="px-2 py-2">
                      <button
                        onClick={(e) => { e.stopPropagation(); setOpenRow(open ? null : r.id); }}
                        title={open ? "Hide analysis" : "Show haul-cycle analysis"}
                        aria-label={open ? "Hide analysis" : "Show analysis"}
                        aria-expanded={open}
                        className="w-5 h-5 rounded flex items-center justify-center text-slate-400 hover:bg-slate-200 hover:text-slate-700 transition">
                        <span style={{ display: "inline-block", transition: "transform .15s",
                          transform: open ? "rotate(90deg)" : "none", fontSize: 10 }}>▶</span>
                      </button>
                    </td>
                    <td className="px-3 py-2 font-medium text-slate-800 whitespace-nowrap">{r.id}</td>
                    <td className="px-3 py-2 text-slate-500 whitespace-nowrap">{r.origin} → {r.dest}</td>
                    <td className="px-3 py-2 text-slate-500">{r.ipt || "—"}</td>
                    <td className="px-3 py-2 text-right tabular-nums">{pinfo && pinfo.distance_km != null ? pinfo.distance_km : "—"}</td>
                    <td className="px-3 py-2"><VehChips profiles={r.profiles} /></td>
                    <td className="px-3 py-2 text-right whitespace-nowrap">
                      <button onClick={(e) => { e.stopPropagation(); deleteRoute(r.id); }}
                        className="text-[color:var(--red)] hover:underline text-xs font-semibold">Delete</button>
                    </td>
                  </tr>
                  {open && <RouteAnalysis routeId={r.id} colSpan={7} />}
                  </React.Fragment>
                );
              })}
              {status && status.length === 0 && <tr><td colSpan="7" className="px-3 py-6 text-center text-slate-400">No routes yet — author one with “Create route”.</td></tr>}
              {!status && <tr><td colSpan="7" className="px-3 py-6 text-center text-slate-400">Loading…</td></tr>}
            </tbody>
          </table>
        </div>
      </div>
      )}
    </div>
  );
}

// ================================================================= Approvals
function Approvals(){
  const [rows, setRows] = useState(null);
  const [busy, setBusy] = useState("");

  const load = () => fetch(`${API}/forecasts/summary`).then(r => r.json()).then(setRows).catch(() => setRows([]));
  useEffect(() => { load(); }, []);

  const setStatus = (routeId, status) => {
    let reason = null;
    if(status === "Rejected"){
      reason = window.prompt("Reason for rejection (optional):") || "";
    }
    setBusy(routeId);
    fetch(`${API}/routes/${encodeURIComponent(routeId)}/status`, {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status, reject_reason: reason }),
    }).then(() => load()).finally(() => setBusy(""));
  };

  if(!rows) return <div className="p-8 text-center text-slate-400">Loading…</div>;
  if(rows.length === 0) return (
    <div className="max-w-7xl mx-auto p-8 text-center text-slate-500">
      No forecasts submitted yet. Once someone saves a matrix, routes appear here for approval.
    </div>
  );

  const badge = (s) => {
    const map = { Approved:"var(--green)", Rejected:"var(--red)", Pending:"var(--gold)", Mixed:"#64748b" };
    return <span className="px-2 py-0.5 rounded-full text-[11px] font-semibold text-white" style={{background: map[s] || "#64748b"}}>{s}</span>;
  };

  return (
    <div className="max-w-7xl mx-auto p-5">
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="text-lg font-bold text-[color:var(--navy-deep)]">Approvals</h2>
          <p className="text-sm text-slate-500">Approved routes appear on the public map. Rejections send the route back to the submitter.</p>
        </div>
        <button onClick={load} className="text-sm text-[color:var(--blue)] hover:underline">Refresh</button>
      </div>

      <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-left text-slate-500 border-b border-slate-200 bg-slate-50">
              <th className="px-4 py-3 font-semibold">Route</th>
              <th className="px-4 py-3 font-semibold">Material · Vehicle</th>
              <th className="px-4 py-3 font-semibold">Window</th>
              <th className="px-4 py-3 font-semibold text-right">Total (veh)</th>
              <th className="px-4 py-3 font-semibold">Status</th>
              <th className="px-4 py-3 font-semibold text-right">Action</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.route_id} className="border-b border-slate-100 last:border-0">
                <td className="px-4 py-3 font-medium text-[color:var(--navy-deep)]">{r.route_id}</td>
                <td className="px-4 py-3 text-slate-600">{r.material_type} · {r.vehicle_type}</td>
                <td className="px-4 py-3 text-slate-600">{r.span} <span className="text-slate-400">({r.month_count} mo)</span></td>
                <td className="px-4 py-3 text-right tabular-nums">{r.total_vehicles.toLocaleString()}</td>
                <td className="px-4 py-3">{badge(r.status)}</td>
                <td className="px-4 py-3 text-right whitespace-nowrap">
                  <button disabled={busy === r.route_id} onClick={() => setStatus(r.route_id, "Approved")}
                    className="px-3 py-1.5 rounded-md text-white text-xs font-semibold mr-1 disabled:opacity-50"
                    style={{background:"var(--green)"}}>Approve</button>
                  <button disabled={busy === r.route_id} onClick={() => setStatus(r.route_id, "Rejected")}
                    className="px-3 py-1.5 rounded-md text-white text-xs font-semibold disabled:opacity-50"
                    style={{background:"var(--red)"}}>Reject</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

// ---- little presentational helpers ----
const selCls = "w-full border border-slate-300 rounded-lg px-2.5 py-2 bg-white outline-none focus:ring-2 focus:ring-[color:var(--blue)]";
function Field({ label, children }){
  return <label className="block"><span className="text-[11px] uppercase tracking-wide text-slate-400">{label}</span><div className="mt-1">{children}</div></label>;
}
function Stat({ label, value, tone }){
  return <span className="flex flex-col"><span className="text-[11px] uppercase tracking-wide text-slate-400">{label}</span><span className="font-bold text-base" style={{color: tone || "var(--navy-deep)"}}>{value}</span></span>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
