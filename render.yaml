# Render blueprint. Render reads this automatically when you create a
# "Blueprint" from your GitHub repo, and provisions both the web service
# and the database below. Free tier.
services:
  - type: web
    name: rbe-a1-logistics
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: rbe-a1-db
          property: connectionString

databases:
  - name: rbe-a1-db
    plan: free
